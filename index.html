<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat+Plus — Converse com Arquivos</title>

    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Emoji Picker -->
    <script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.16.1/index.js" defer></script>

    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #2d2d44;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a4a6a;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a7a;
        }
        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }
        input,
        textarea {
            background: #2d2d44;
            border: none;
            outline: none;
            color: #eee;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
        }
        input::placeholder,
        textarea::placeholder {
            color: #8888aa;
        }

        /* ========== TELAS DE LOGIN / REGISTRO ========== */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #14142a, #1e1e3a);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #auth-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .auth-box {
            background: #252540;
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid #3a3a5a;
        }
        .auth-box h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-align: center;
        }
        .auth-box .subtitle {
            color: #9999bb;
            text-align: center;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .auth-box .input-group {
            margin-bottom: 16px;
            position: relative;
        }
        .auth-box .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6666aa;
            font-size: 16px;
        }
        .auth-box .input-group input {
            padding-left: 44px;
            background: #1e1e36;
            border: 1px solid #3a3a5a;
            transition: 0.2s;
        }
        .auth-box .input-group input:focus {
            border-color: #7c6cf0;
            background: #262646;
        }
        .auth-box .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            transition: 0.2s;
            margin-top: 8px;
        }
        .auth-box .btn-primary:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        .auth-box .auth-switch {
            text-align: center;
            margin-top: 18px;
            color: #8888aa;
            font-size: 14px;
        }
        .auth-box .auth-switch .auth-link {
            color: #b76cf0;
            cursor: pointer;
            font-weight: 600;
        }
        .auth-box .auth-switch .auth-link:hover {
            text-decoration: underline;
        }
        .auth-box .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        /* ========== APP PRINCIPAL ========== */
        #app {
            display: none;
            width: 100%;
            height: 100vh;
            background: #16162e;
            overflow: hidden;
        }
        #app.active {
            display: flex;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: #1e1e38;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d4a;
            transition: 0.3s;
        }
        .sidebar-header {
            padding: 18px 20px 12px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-header .brand {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2d2d4a;
            padding: 4px 12px 4px 6px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #ccc;
            cursor: pointer;
            position: relative;
        }
        .sidebar-header .user-badge .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar-header .user-badge .logout-btn {
            margin-left: 4px;
            color: #8888aa;
            font-size: 14px;
            transition: 0.2s;
        }
        .sidebar-header .user-badge .logout-btn:hover {
            color: #ff6b6b;
        }

        /* Navegação (canais / DMs / grupos) */
        .sidebar-nav {
            padding: 12px 16px;
            display: flex;
            gap: 6px;
            border-bottom: 1px solid #2d2d4a;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .sidebar-nav button {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: transparent;
            color: #8888aa;
            transition: 0.2s;
        }
        .sidebar-nav button:hover {
            background: #2d2d4a;
            color: #eee;
        }
        .sidebar-nav button.active {
            background: #3a3a5a;
            color: #fff;
        }

        /* Lista de canais / usuários */
        .sidebar-channels {
            flex: 1;
            overflow-y: auto;
            padding: 10px 12px;
        }
        .sidebar-channels .channel-group-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6666aa;
            padding: 10px 8px 4px;
            font-weight: 600;
        }
        .sidebar-channels .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
            color: #aaaacc;
            font-size: 14px;
            margin-bottom: 2px;
            position: relative;
        }
        .sidebar-channels .channel-item:hover {
            background: #2d2d4a;
            color: #eee;
        }
        .sidebar-channels .channel-item.active {
            background: #3a3a5a;
            color: #fff;
        }
        .sidebar-channels .channel-item i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            color: #6666aa;
        }
        .sidebar-channels .channel-item.active i {
            color: #b76cf0;
        }
        .sidebar-channels .channel-item .badge {
            margin-left: auto;
            background: #b76cf0;
            color: #fff;
            font-size: 11px;
            padding: 1px 10px;
            border-radius: 30px;
            font-weight: 600;
        }
        .sidebar-channels .channel-item .channel-actions {
            display: none;
            gap: 4px;
            margin-left: auto;
        }
        .sidebar-channels .channel-item:hover .channel-actions {
            display: flex;
        }
        .sidebar-channels .channel-item .channel-actions button {
            color: #8888aa;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .sidebar-channels .channel-item .channel-actions button:hover {
            color: #fff;
            background: #4a4a6a;
        }
        .sidebar-channels .channel-item .channel-actions button.danger:hover {
            color: #ff6b6b;
        }

        /* Botão criar canal */
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #2d2d4a;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .sidebar-footer button {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            background: #2d2d4a;
            color: #ccc;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .sidebar-footer button:hover {
            background: #3d3d5a;
            color: #fff;
        }
        .sidebar-footer button.primary {
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            color: #fff;
        }
        .sidebar-footer button.primary:hover {
            opacity: 0.9;
        }

        /* ========== MAIN CHAT ========== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a32;
            height: 100vh;
            overflow: hidden;
        }

        /* Cabeçalho do chat */
        .chat-header {
            padding: 14px 24px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: #1e1e38;
        }
        .chat-header .chat-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .chat-info h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .chat-header .chat-info .member-count {
            font-size: 13px;
            color: #8888aa;
        }
        .chat-header .chat-actions {
            display: flex;
            gap: 8px;
        }
        .chat-header .chat-actions button {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            background: #2d2d4a;
            color: #ccc;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header .chat-actions button:hover {
            background: #3d3d5a;
            color: #fff;
        }
        .chat-header .chat-actions button.danger:hover {
            background: #6b2d2d;
            color: #ff6b6b;
        }

        /* Área de mensagens */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .chat-messages .msg-date-divider {
            text-align: center;
            font-size: 12px;
            color: #6666aa;
            padding: 12px 0 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .chat-messages .message {
            display: flex;
            gap: 12px;
            padding: 6px 12px 6px 8px;
            border-radius: 8px;
            transition: 0.1s;
            max-width: 85%;
            align-self: flex-start;
        }
        .chat-messages .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
            background: #2d2d4a;
        }
        .chat-messages .message:hover {
            background: #262642;
        }
        .chat-messages .message.own:hover {
            background: #333355;
        }
        .chat-messages .message .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-messages .message .msg-content {
            flex: 1;
            min-width: 0;
        }
        .chat-messages .message .msg-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }
        .chat-messages .message .msg-header .username {
            font-weight: 600;
            font-size: 14px;
            color: #b76cf0;
        }
        .chat-messages .message .msg-header .timestamp {
            font-size: 11px;
            color: #6666aa;
        }
        .chat-messages .message .msg-header .badge-admin {
            font-size: 10px;
            background: #7c6cf0;
            color: #fff;
            padding: 0 8px;
            border-radius: 30px;
            font-weight: 600;
        }
        .chat-messages .message .msg-text {
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            margin-top: 2px;
            color: #eee;
        }
        .chat-messages .message .msg-text .emoji {
            font-size: 22px;
            vertical-align: middle;
        }
        .chat-messages .message .msg-files {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .chat-messages .message .msg-files .file-card {
            background: #2d2d4a;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            border: 1px solid #3a3a5a;
            max-width: 200px;
            word-break: break-all;
        }
        .chat-messages .message .msg-files .file-card i {
            font-size: 20px;
            color: #b76cf0;
        }
        .chat-messages .message .msg-files .file-card a {
            color: #7c6cf0;
            text-decoration: none;
            font-weight: 500;
        }
        .chat-messages .message .msg-files .file-card a:hover {
            text-decoration: underline;
        }
        .chat-messages .message .msg-reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .chat-messages .message .msg-reactions .reaction {
            background: #2d2d4a;
            border-radius: 30px;
            padding: 1px 10px 1px 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .chat-messages .message .msg-reactions .reaction:hover {
            border-color: #7c6cf0;
            background: #3a3a5a;
        }
        .chat-messages .message .msg-reactions .reaction .count {
            font-size: 12px;
            color: #aaaacc;
        }

        /* Input de mensagem */
        .chat-input-area {
            padding: 12px 20px 16px;
            border-top: 1px solid #2d2d4a;
            background: #1e1e38;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-input-area .input-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }
        .chat-input-area .input-row .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: #2d2d44;
            border-radius: 12px;
            padding: 0 12px;
            border: 1px solid #3a3a5a;
            transition: 0.2s;
        }
        .chat-input-area .input-row .input-wrapper:focus-within {
            border-color: #7c6cf0;
        }
        .chat-input-area .input-row .input-wrapper textarea {
            background: transparent;
            border: none;
            padding: 10px 0;
            resize: none;
            height: 44px;
            max-height: 120px;
            font-size: 15px;
            line-height: 1.4;
            flex: 1;
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn {
            color: #8888aa;
            font-size: 20px;
            padding: 6px 4px 6px 8px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn:hover {
            color: #b76cf0;
        }
        .chat-input-area .input-row .input-wrapper .file-btn {
            color: #8888aa;
            font-size: 18px;
            padding: 6px 4px 6px 4px;
            transition: 0.2s;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
        }
        .chat-input-area .input-row .input-wrapper .file-btn:hover {
            color: #b76cf0;
        }
        .chat-input-area .input-row .input-wrapper .file-btn input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .chat-input-area .input-row .send-btn {
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .chat-input-area .input-row .send-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .chat-input-area .file-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px 0;
        }
        .chat-input-area .file-preview .file-tag {
            background: #2d2d4a;
            border-radius: 6px;
            padding: 4px 12px 4px 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #3a3a5a;
        }
        .chat-input-area .file-preview .file-tag i {
            color: #b76cf0;
        }
        .chat-input-area .file-preview .file-tag .remove {
            color: #ff6b6b;
            cursor: pointer;
            font-size: 14px;
        }

        /* ========== EMOJI PICKER FLUTUANTE ========== */
        .emoji-picker-container {
            position: relative;
            display: inline-block;
        }
        .emoji-picker-container .emoji-picker-popup {
            position: absolute;
            bottom: 60px;
            left: 0;
            z-index: 999;
            background: #252540;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #3a3a5a;
            padding: 8px;
            display: none;
            width: 320px;
            height: 380px;
            overflow-y: auto;
        }
        .emoji-picker-container .emoji-picker-popup.open {
            display: block;
        }
        .emoji-picker-container .emoji-picker-popup emoji-picker {
            --background: #252540;
            --border-color: #3a3a5a;
            --input-background: #1e1e36;
            --input-border-color: #4a4a6a;
            --input-font-color: #eee;
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #252540;
            border-radius: 20px;
            padding: 32px 36px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #3a3a5a;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }
        .modal-box h2 {
            font-size: 22px;
            margin-bottom: 4px;
        }
        .modal-box .modal-sub {
            color: #8888aa;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal-box .input-group {
            margin-bottom: 14px;
        }
        .modal-box .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #aaaacc;
            margin-bottom: 4px;
        }
        .modal-box .input-group input,
        .modal-box .input-group select {
            background: #1e1e36;
            border: 1px solid #3a3a5a;
            border-radius: 8px;
            padding: 10px 14px;
            color: #eee;
            width: 100%;
        }
        .modal-box .input-group input:focus,
        .modal-box .input-group select:focus {
            border-color: #7c6cf0;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions button {
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .modal-box .modal-actions .btn-cancel {
            background: #2d2d4a;
            color: #aaaacc;
        }
        .modal-box .modal-actions .btn-cancel:hover {
            background: #3d3d5a;
        }
        .modal-box .modal-actions .btn-confirm {
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            color: #fff;
        }
        .modal-box .modal-actions .btn-confirm:hover {
            opacity: 0.9;
        }
        .modal-box .modal-actions .btn-danger {
            background: #6b2d2d;
            color: #ff6b6b;
        }
        .modal-box .modal-actions .btn-danger:hover {
            background: #8b3d3d;
        }
        .modal-box .user-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #1e1e36;
            margin-bottom: 4px;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-box .user-list-item:hover {
            background: #2d2d4a;
        }
        .modal-box .user-list-item .avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
        }
        .modal-box .user-list-item .uname {
            flex: 1;
            font-weight: 500;
        }
        .modal-box .user-list-item .role-badge {
            font-size: 10px;
            background: #7c6cf0;
            padding: 0 10px;
            border-radius: 30px;
            color: #fff;
            font-weight: 600;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .sidebar {
                width: 220px;
                min-width: 220px;
            }
            .chat-messages {
                padding: 12px 14px;
            }
            .chat-header {
                padding: 10px 14px;
            }
            .modal-box {
                padding: 24px 20px;
                margin: 12px;
            }
            .auth-box {
                padding: 28px 20px;
                margin: 12px;
            }
            .chat-messages .message {
                max-width: 95%;
            }
            .sidebar-header .brand {
                font-size: 15px;
            }
            .chat-header .chat-info h2 {
                font-size: 15px;
            }
        }
        @media (max-width: 480px) {
            .sidebar {
                width: 60px;
                min-width: 60px;
            }
            .sidebar .brand,
            .sidebar .channel-item span,
            .sidebar .channel-group-label,
            .sidebar .sidebar-footer button span,
            .sidebar .user-badge .username-text {
                display: none;
            }
            .sidebar .channel-item {
                justify-content: center;
                padding: 10px;
            }
            .sidebar .channel-item i {
                font-size: 20px;
            }
            .sidebar .user-badge {
                padding: 4px 8px;
            }
            .sidebar .sidebar-footer button {
                padding: 10px;
                font-size: 16px;
            }
            .sidebar .sidebar-footer button span {
                display: none;
            }
            .sidebar-header {
                padding: 12px 10px;
            }
            .chat-header .chat-actions button span {
                display: none;
            }
            .chat-messages .message .msg-header .username {
                font-size: 13px;
            }
            .chat-input-area .input-row .input-wrapper textarea {
                font-size: 14px;
                height: 38px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== TELA DE AUTENTICAÇÃO ========== -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>💬 Chat+Plus</h1>
            <p class="subtitle">Converse, compartilhe arquivos e crie grupos</p>

            <div id="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input id="auth-username" type="text" placeholder="Nome de usuário" />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input id="auth-password" type="password" placeholder="Senha" />
                </div>
                <button class="btn-primary" id="auth-btn">Entrar</button>
                <div class="auth-switch">
                    <span id="auth-switch-prefix">Não tem conta?</span>
                    <span class="auth-link" id="auth-toggle">Registrar</span>
                </div>
                <div class="error-msg" id="auth-error"></div>
            </div>
        </div>
    </div>

    <!-- ========== APP PRINCIPAL ========== -->
    <div id="app">

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="brand">💬 Chat+Plus</span>
                <div class="user-badge" id="user-badge" title="Clique para ver perfil">
                    <div class="avatar" id="my-avatar">U</div>
                    <span class="username-text" id="my-username">Usuário</span>
                    <button class="logout-btn" id="logout-btn" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>

            <div class="sidebar-nav" id="sidebar-nav">
                <button class="active" data-filter="all"><i class="fas fa-hashtag"></i> Todos</button>
                <button data-filter="dm"><i class="fas fa-user"></i> DMs</button>
                <button data-filter="group"><i class="fas fa-users"></i> Grupos</button>
            </div>

            <div class="sidebar-channels" id="channel-list">
                <!-- renderizado pelo JS -->
            </div>

            <div class="sidebar-footer">
                <button id="create-channel-btn" class="primary"><i class="fas fa-plus-circle"></i> <span>Canal</span></button>
                <button id="create-group-btn"><i class="fas fa-user-plus"></i> <span>Grupo</span></button>
            </div>
        </div>

        <!-- MAIN CHAT -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="chat-info">
                    <h2 id="chat-title"># geral</h2>
                    <span class="member-count" id="member-count">0 membros</span>
                </div>
                <div class="chat-actions">
                    <button id="edit-channel-btn" title="Editar canal"><i class="fas fa-pen"></i> <span>Editar</span></button>
                    <button id="delete-channel-btn" class="danger" title="Excluir canal"><i class="fas fa-trash"></i> <span>Excluir</span></button>
                    <button id="manage-users-btn" title="Gerenciar usuários"><i class="fas fa-user-cog"></i> <span>Admins</span></button>
                </div>
            </div>

            <div class="chat-messages" id="message-area">
                <!-- renderizado pelo JS -->
            </div>

            <div class="chat-input-area" id="chat-input-area">
                <div class="file-preview" id="file-preview"></div>
                <div class="input-row">
                    <div class="input-wrapper">
                        <textarea id="message-input" rows="1" placeholder="Digite uma mensagem..."></textarea>
                        <button class="emoji-btn" id="emoji-toggle-btn"><i class="far fa-smile"></i></button>
                        <div class="emoji-picker-container">
                            <div class="emoji-picker-popup" id="emoji-picker-popup">
                                <emoji-picker id="emoji-picker"></emoji-picker>
                            </div>
                        </div>
                        <label class="file-btn">
                            <i class="fas fa-paperclip"></i>
                            <input type="file" id="file-input" multiple />
                        </label>
                    </div>
                    <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== MODAL ========== -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="modal-box">
            <h2 id="modal-title">Título</h2>
            <p class="modal-sub" id="modal-sub">Subtítulo</p>
            <div id="modal-body"></div>
            <div class="modal-actions" id="modal-actions">
                <button class="btn-cancel" id="modal-cancel">Cancelar</button>
                <button class="btn-confirm" id="modal-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  DATA LAYER (localStorage)
        // ============================================================
        const DB_KEY = 'chatplus_data';
        const SESSION_KEY = 'chatplus_session';

        function getDB() {
            try {
                return JSON.parse(localStorage.getItem(DB_KEY)) || { users: [], channels: [], messages: [] };
            } catch { return { users: [], channels: [], messages: [] }; }
        }

        function saveDB(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function getSession() {
            try {
                return JSON.parse(localStorage.getItem(SESSION_KEY));
            } catch { return null; }
        }

        function saveSession(session) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
        }

        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDate(ts) {
            const d = new Date(ts);
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function getInitials(name) {
            return name.charAt(0).toUpperCase();
        }

        function isAdmin(userId) {
            const db = getDB();
            const user = db.users.find(u => u.id === userId);
            return user ? user.isAdmin : false;
        }

        function getUserName(id) {
            const db = getDB();
            const u = db.users.find(u => u.id === id);
            return u ? u.username : 'Desconhecido';
        }

        function getUser(id) {
            const db = getDB();
            return db.users.find(u => u.id === id);
        }

        function getChannel(id) {
            const db = getDB();
            return db.channels.find(c => c.id === id);
        }

        function getMessages(channelId) {
            const db = getDB();
            return db.messages.filter(m => m.channelId === channelId).sort((a, b) => a.timestamp - b.timestamp);
        }

        function getChannelMembers(channelId) {
            const db = getDB();
            const ch = db.channels.find(c => c.id === channelId);
            if (!ch) return [];
            if (ch.type === 'dm') {
                return ch.members || [];
            }
            return ch.members || [];
        }

        function getChannelDisplayName(channel) {
            const session = getSession();
            if (!session) return channel.name;
            if (channel.type === 'dm') {
                const other = channel.members.find(m => m !== session.userId);
                return getUserName(other);
            }
            return channel.name;
        }

        function getChannelIcon(channel) {
            if (channel.type === 'dm') return 'fa-user';
            if (channel.type === 'group') return 'fa-users';
            return 'fa-hashtag';
        }

        // ============================================================
        //  AUTH
        // ============================================================
        let currentUser = null;
        let isLoginMode = true;

        function initAuth() {
            // Criar admin padrão se não houver usuários
            const db = getDB();
            if (db.users.length === 0) {
                const admin = {
                    id: generateId(),
                    username: 'admin',
                    password: 'admin123',
                    isAdmin: true,
                    avatar: 'A',
                    createdAt: Date.now()
                };
                db.users.push(admin);
                const channel = {
                    id: generateId(),
                    name: 'geral',
                    type: 'group',
                    members: [admin.id],
                    adminId: admin.id,
                    createdAt: Date.now()
                };
                db.channels.push(channel);
                saveDB(db);
            }

            // Verificar sessão
            const session = getSession();
            if (session) {
                const user = db.users.find(u => u.id === session.userId);
                if (user) {
                    currentUser = user;
                    showApp();
                    return;
                }
            }
            showAuth();
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app').classList.remove('active');
            document.getElementById('app').style.display = 'none';
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app').style.display = 'flex';
            document.getElementById('app').classList.add('active');
            renderSidebar();
            loadFirstChannel();
            updateUserBadge();
        }

        // ============================================================
        //  AUTH EVENTS
        // ============================================================
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-btn').textContent = isLoginMode ? 'Entrar' : 'Registrar';
            document.getElementById('auth-switch-prefix').textContent = isLoginMode ? 'Não tem conta?' : 'Já tem conta?';
            document.getElementById('auth-toggle').textContent = isLoginMode ? 'Registrar' : 'Entrar';
            document.getElementById('auth-error').textContent = '';
        }

        document.getElementById('auth-toggle').addEventListener('click', toggleAuthMode);

        document.getElementById('auth-btn').addEventListener('click', handleAuth);
        document.getElementById('auth-password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleAuth();
        });
        document.getElementById('auth-username').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleAuth();
        });

        function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorEl = document.getElementById('auth-error');

            if (!username || !password) {
                errorEl.textContent = 'Preencha todos os campos.';
                return;
            }

            const db = getDB();

            if (isLoginMode) {
                const user = db.users.find(u => u.username === username && u.password === password);
                if (!user) {
                    errorEl.textContent = 'Usuário ou senha incorretos.';
                    return;
                }
                currentUser = user;
                saveSession({ userId: user.id });
                showApp();
                errorEl.textContent = '';
            } else {
                if (db.users.find(u => u.username === username)) {
                    errorEl.textContent = 'Nome de usuário já existe.';
                    return;
                }
                const isFirst = db.users.length === 0;
                const newUser = {
                    id: generateId(),
                    username,
                    password,
                    isAdmin: isFirst,
                    avatar: getInitials(username),
                    createdAt: Date.now()
                };
                db.users.push(newUser);
                if (isFirst) {
                    const defaultChannel = {
                        id: generateId(),
                        name: 'geral',
                        type: 'group',
                        members: [newUser.id],
                        adminId: newUser.id,
                        createdAt: Date.now()
                    };
                    db.channels.push(defaultChannel);
                }
                saveDB(db);
                currentUser = newUser;
                saveSession({ userId: newUser.id });
                showApp();
                errorEl.textContent = '';
            }
        }

        // ============================================================
        //  LOGOUT
        // ============================================================
        document.getElementById('logout-btn').addEventListener('click', () => {
            clearSession();
            currentUser = null;
            showAuth();
            document.getElementById('app').style.display = 'none';
        });

        // ============================================================
        //  UI: USER BADGE
        // ============================================================
        function updateUserBadge() {
            if (!currentUser) return;
            document.getElementById('my-avatar').textContent = currentUser.avatar || getInitials(currentUser.username);
            document.getElementById('my-username').textContent = currentUser.username;
        }

        // ============================================================
        //  UI: SIDEBAR
        // ============================================================
        let currentChannelId = null;
        let currentFilter = 'all';

        function renderSidebar() {
            const db = getDB();
            const session = getSession();
            if (!session) return;

            const list = document.getElementById('channel-list');
            let channels = db.channels.filter(c => c.members.includes(session.userId));

            if (currentFilter === 'dm') {
                channels = channels.filter(c => c.type === 'dm');
            } else if (currentFilter === 'group') {
                channels = channels.filter(c => c.type === 'group' || c.type === 'text');
            }

            let html = '';
            const groups = channels.filter(c => c.type === 'group' || c.type === 'text');
            const dms = channels.filter(c => c.type === 'dm');

            if (groups.length) {
                html += `<div class="channel-group-label">📌 Canais</div>`;
                groups.forEach(c => {
                    const active = c.id === currentChannelId ? 'active' : '';
                    const name = c.name;
                    const icon = getChannelIcon(c);
                    const isAdmin = c.adminId === session.userId;
                    html += `
                        <div class="channel-item ${active}" data-id="${c.id}">
                            <i class="fas ${icon}"></i>
                            <span>${name}</span>
                            ${isAdmin ? `<div class="channel-actions">
                                <button class="edit-channel-btn" data-id="${c.id}" title="Editar"><i class="fas fa-pen"></i></button>
                                <button class="delete-channel-btn danger" data-id="${c.id}" title="Excluir"><i class="fas fa-trash"></i></button>
                            </div>` : ''}
                        </div>
                    `;
                });
            }

            if (dms.length) {
                html += `<div class="channel-group-label">💬 Mensagens Diretas</div>`;
                dms.forEach(c => {
                    const active = c.id === currentChannelId ? 'active' : '';
                    const name = getChannelDisplayName(c);
                    const icon = getChannelIcon(c);
                    html += `
                        <div class="channel-item ${active}" data-id="${c.id}">
                            <i class="fas ${icon}"></i>
                            <span>${name}</span>
                        </div>
                    `;
                });
            }

            if (!html) {
                html = `<div style="color:#6666aa;padding:20px;text-align:center;font-size:14px;">
                            Nenhum canal ainda.<br>Crie um com o botão abaixo.
                        </div>`;
            }

            list.innerHTML = html;

            list.querySelectorAll('.channel-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    if (id) switchChannel(id);
                });
            });

            list.querySelectorAll('.edit-channel-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditChannel(btn.dataset.id);
                });
            });
            list.querySelectorAll('.delete-channel-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDeleteChannel(btn.dataset.id);
                });
            });
        }

        document.querySelectorAll('#sidebar-nav button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#sidebar-nav button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderSidebar();
                const db = getDB();
                const session = getSession();
                if (session) {
                    let channels = db.channels.filter(c => c.members.includes(session.userId));
                    if (currentFilter === 'dm') channels = channels.filter(c => c.type === 'dm');
                    else if (currentFilter === 'group') channels = channels.filter(c => c.type === 'group' || c.type ===
                    'text');
                    if (channels.length && !channels.find(c => c.id === currentChannelId)) {
                        switchChannel(channels[0].id);
                    } else if (!channels.length) {
                        currentChannelId = null;
                        document.getElementById('chat-title').textContent = 'Nenhum canal';
                        document.getElementById('member-count').textContent = '';
                        document.getElementById('message-area').innerHTML =
                            '<div style="color:#6666aa;text-align:center;padding:40px;">Selecione ou crie um canal</div>';
                    }
                }
            });
        });

        // ============================================================
        //  SWITCH CHANNEL
        // ============================================================
        function switchChannel(channelId) {
            currentChannelId = channelId;
            renderSidebar();
            renderMessages();
            updateChatHeader();
        }

        function loadFirstChannel() {
            const db = getDB();
            const session = getSession();
            if (!session) return;
            const channels = db.channels.filter(c => c.members.includes(session.userId));
            if (channels.length) {
                const lastChannel = localStorage.getItem('last_channel_' + session.userId);
                if (lastChannel && channels.find(c => c.id === lastChannel)) {
                    switchChannel(lastChannel);
                    return;
                }
                switchChannel(channels[0].id);
            } else {
                currentChannelId = null;
                document.getElementById('chat-title').textContent = 'Nenhum canal';
                document.getElementById('member-count').textContent = '';
                document.getElementById('message-area').innerHTML =
                    '<div style="color:#6666aa;text-align:center;padding:40px;">Crie um canal ou grupo para começar</div>';
            }
        }

        // ============================================================
        //  UI: CHAT HEADER
        // ============================================================
        function updateChatHeader() {
            if (!currentChannelId) {
                document.getElementById('chat-title').textContent = 'Nenhum canal';
                document.getElementById('member-count').textContent = '';
                return;
            }
            const db = getDB();
            const ch = db.channels.find(c => c.id === currentChannelId);
            if (!ch) return;
            const name = getChannelDisplayName(ch);
            document.getElementById('chat-title').textContent = ch.type === 'dm' ? `💬 ${name}` : `# ${name}`;
            const members = getChannelMembers(currentChannelId);
            document.getElementById('member-count').textContent = members.length + ' membros';
        }

        // ============================================================
        //  UI: MESSAGES
        // ============================================================
        function renderMessages() {
            const area = document.getElementById('message-area');
            if (!currentChannelId) {
                area.innerHTML =
                    '<div style="color:#6666aa;text-align:center;padding:40px;">Selecione um canal para ver as mensagens</div>';
                return;
            }

            const db = getDB();
            const messages = getMessages(currentChannelId);
            const session = getSession();
            if (!session) return;

            let html = '';
            let lastDate = '';

            messages.forEach((msg, idx) => {
                const msgDate = formatDate(msg.timestamp);
                if (msgDate !== lastDate) {
                    html += `<div class="msg-date-divider">${msgDate}</div>`;
                    lastDate = msgDate;
                }
                const isOwn = msg.userId === session.userId;
                const user = getUser(msg.userId);
                const username = user ? user.username : 'Desconhecido';
                const avatar = user ? (user.avatar || getInitials(username)) : '?';
                const isAdminUser = user ? user.isAdmin : false;
                const time = formatTime(msg.timestamp);

                let filesHtml = '';
                if (msg.files && msg.files.length) {
                    filesHtml = `<div class="msg-files">`;
                    msg.files.forEach(f => {
                        const icon = f.type && f.type.startsWith('image/') ? 'fa-image' : 'fa-file';
                        const isImage = f.type && f.type.startsWith('image/');
                        if (isImage) {
                            filesHtml += `
                                <div class="file-card">
                                    <i class="fas fa-image"></i>
                                    <a href="${f.data}" target="_blank">${f.name}</a>
                                </div>
                            `;
                        } else {
                            filesHtml += `
                                <div class="file-card">
                                    <i class="fas ${icon}"></i>
                                    <a href="${f.data}" download="${f.name}" target="_blank">${f.name}</a>
                                    <span style="font-size:11px;color:#6666aa;">(${(f.size/1024).toFixed(1)} KB)</span>
                                </div>
                            `;
                        }
                    });
                    filesHtml += `</div>`;
                }

                let reactionsHtml = '';
                if (msg.reactions && Object.keys(msg.reactions).length) {
                    reactionsHtml = `<div class="msg-reactions">`;
                    for (const [emoji, users] of Object.entries(msg.reactions)) {
                        const count = users.length;
                        const hasReacted = users.includes(session.userId);
                        reactionsHtml += `
                            <div class="reaction ${hasReacted ? 'active' : ''}" data-msgid="${msg.id}" data-emoji="${emoji}">
                                <span>${emoji}</span>
                                <span class="count">${count}</span>
                            </div>
                        `;
                    }
                    reactionsHtml += `</div>`;
                }

                html += `
                    <div class="message ${isOwn ? 'own' : ''}" data-id="${msg.id}">
                        <div class="msg-avatar" style="background:${isAdminUser ? 'linear-gradient(135deg,#f093fb,#f5576c)' : 'linear-gradient(135deg,#7c6cf0,#b76cf0)'}">
                            ${avatar}
                        </div>
                        <div class="msg-content">
                            <div class="msg-header">
                                <span class="username">${username}</span>
                                ${isAdminUser ? '<span class="badge-admin">ADMIN</span>' : ''}
                                <span class="timestamp">${time}</span>
                            </div>
                            ${msg.content ? `<div class="msg-text">${escapeHtml(msg.content)}</div>` : ''}
                            ${filesHtml}
                            ${reactionsHtml}
                        </div>
                    </div>
                `;
            });

            if (!html) {
                html =
                    `<div style="color:#6666aa;text-align:center;padding:40px;">Sem mensagens ainda. Envie uma!</div>`;
            }

            area.innerHTML = html;
            area.scrollTop = area.scrollHeight;

            area.querySelectorAll('.reaction').forEach(el => {
                el.addEventListener('click', () => {
                    const msgId = el.dataset.msgid;
                    const emoji = el.dataset.emoji;
                    toggleReaction(msgId, emoji);
                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            let html = div.innerHTML;
            const emojiMap = {
                ':smile:': '😊',
                ':laugh:': '😄',
                ':heart:': '❤️',
                ':fire:': '🔥',
                ':thumbsup:': '👍',
                ':thumbsdown:': '👎',
                ':wave:': '👋',
                ':ok:': '👌',
                ':clap:': '👏',
                ':pray:': '🙏',
                ':rocket:': '🚀',
                ':star:': '⭐',
                ':cry:': '😢',

        // ============================================================
        //  SEND MESSAGE
        // ============================================================
        let pendingFiles = [];

        document.getElementById('file-input').addEventListener('change', (e) => {
            const files = e.target.files;
            for (const file of files) {
                if (file.size > 0) {
                    pendingFiles.push(file);
                }
            }
            updateFilePreview();
            e.target.value = '';
        });

        function updateFilePreview() {
            const container = document.getElementById('file-preview');
            if (!pendingFiles.length) {
                container.innerHTML = '';
                return;
            }
            let html = '';
            pendingFiles.forEach((f, idx) => {
                html += `
                    <div class="file-tag">
                        <i class="fas fa-file"></i>
                        <span>${f.name} (${(f.size/1024).toFixed(1)} KB)</span>
                        <span class="remove" data-idx="${idx}"><i class="fas fa-times-circle"></i></span>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.querySelectorAll('.remove').forEach(el => {
                el.addEventListener('click', () => {
                    pendingFiles.splice(parseInt(el.dataset.idx), 1);
                    updateFilePreview();
                });
            });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            if (!currentChannelId) {
                alert('Selecione um canal primeiro.');
                return;
            }
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content && !pendingFiles.length) return;

            const db = getDB();
            const session = getSession();
            if (!session) return;

            const msg = {
                id: generateId(),
                channelId: currentChannelId,
                userId: session.userId,
                content: content || '',
                timestamp: Date.now(),
                files: [],
                reactions: {}
            };

            const filePromises = pendingFiles.map((file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        resolve({
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            data: e.target.result
                        });
                    };
                    reader.readAsDataURL(file);
                });
            });

            Promise.all(filePromises).then((fileData) => {
                msg.files = fileData;
                db.messages.push(msg);
                saveDB(db);
                pendingFiles = [];
                updateFilePreview();
                input.value = '';
                input.style.height = '44px';
                renderMessages();
                localStorage.setItem('last_channel_' + session.userId, currentChannelId);
            });
        }

        document.getElementById('message-input').addEventListener('input', function() {
            this.style.height = '44px';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // ============================================================
        //  EMOJI PICKER
        // ============================================================
        const emojiPopup = document.getElementById('emoji-picker-popup');
        const emojiToggle = document.getElementById('emoji-toggle-btn');

        emojiToggle.addEventListener('click', () => {
            emojiPopup.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.emoji-picker-container') && !e.target.closest('#emoji-toggle-btn')) {
                emojiPopup.classList.remove('open');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const picker = document.getElementById('emoji-picker');
            if (picker) {
                picker.addEventListener('emoji-click', (event) => {
                    const input = document.getElementById('message-input');
                    input.value += event.detail.unicode;
                    input.focus();
                    emojiPopup.classList.remove('open');
                });
            }
        });

        // ============================================================
        //  REACTIONS
        // ============================================================
        function toggleReaction(msgId, emoji) {
            const db = getDB();
            const session = getSession();
            if (!session) return;
            const msg = db.messages.find(m => m.id === msgId);
            if (!msg) return;
            if (!msg.reactions) msg.reactions = {};
            if (!msg.reactions[emoji]) msg.reactions[emoji] = [];
            const idx = msg.reactions[emoji].indexOf(session.userId);
            if (idx > -1) {
                msg.reactions[emoji].splice(idx, 1);
                if (msg.reactions[emoji].length === 0) delete msg.reactions[emoji];
            } else {
                msg.reactions[emoji].push(session.userId);
            }
            saveDB(db);
            renderMessages();
        }

        //  CRIAR CANAL
        // ============================================================
        document.getElementById('create-channel-btn').addEventListener('click', () => {
            openCreateChannel();
        });

        function openCreateChannel() {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '📌 Criar Canal';
            document.getElementById('modal-sub').textContent = 'Crie um novo canal para conversar em grupo.';
            document.getElementById('modal-body').innerHTML = `
                <div class="input-group">
                    <label>Nome do canal</label>
                    <input id="new-channel-name" placeholder="Ex: jogos, filmes, estudos" />
                </div>
            `;
            document.getElementById('modal-confirm').textContent = 'Criar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('new-channel-name').value.trim();
                if (!name) { alert('Digite um nome.'); return; }
                const db = getDB();
                const session = getSession();
                if (!session) return;
                const channel = {
                    id: generateId(),
                    name: name,
                    type: 'group',
                    members: [session.userId],
                    adminId: session.userId,
                    createdAt: Date.now()
                };
                db.channels.push(channel);
                saveDB(db);
                modal.classList.remove('open');
                renderSidebar();
                switchChannel(channel.id);
            });

            document.getElementById('modal-cancel').addEventListener('click', () => {
                modal.classList.remove('open');
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('open');
            });
        }

        // ============================================================
        //  CRIAR GRUPO (DM -> grupo)
        // ============================================================
        document.getElementById('create-group-btn').addEventListener('click', () => {
            openCreateGroup();
        });

        function openCreateGroup() {
            const db = getDB();
            const session = getSession();
            if (!session) return;
            const users = db.users.filter(u => u.id !== session.userId);

            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '👥 Criar Grupo';
            document.getElementById('modal-sub').textContent = 'Selecione os participantes do grupo.';
            let userList = users.map(u => `
                <div class="user-list-item" data-id="${u.id}" style="cursor:pointer;">
                    <div class="avatar-small">${u.avatar || getInitials(u.username)}</div>
                    <span class="uname">${u.username}</span>
                    ${u.isAdmin ? '<span class="role-badge">ADMIN</span>' : ''}
                    <span style="margin-left:auto;color:#6666aa;"><input type="checkbox" class="group-member-check" data-id="${u.id}" /></span>
                </div>
            `).join('');

            if (!users.length) {
                userList = '<div style="color:#6666aa;padding:12px;">Nenhum outro usuário disponível.</div>';
            }

            document.getElementById('modal-body').innerHTML = `
                <div class="input-group">
                    <label>Nome do grupo</label>
                    <input id="group-name-input" placeholder="Ex: Amigos, Trabalho" />
                </div>
                <div style="margin-top:12px;max-height:220px;overflow-y:auto;background:#1a1a32;border-radius:10px;padding:4px;">
                    ${userList}
                </div>
            `;

            document.getElementById('modal-confirm').textContent = 'Criar Grupo';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('group-name-input').value.trim() || 'Novo Grupo';
                const checks = document.querySelectorAll('.group-member-check:checked');
                const members = [session.userId];
                checks.forEach(c => members.push(c.dataset.id));
                if (members.length < 2) {
                    alert('Selecione pelo menos uma outra pessoa.');
                    return;
                }
                const db = getDB();
                const channel = {
                    id: generateId(),
                    name: name,
                    type: 'group',
                    members: members,
                    adminId: session.userId,
                    createdAt: Date.now()
                };
                db.channels.push(channel);
                saveDB(db);
                modal.classList.remove('open');
                renderSidebar();
                switchChannel(channel.id);
            });

            document.getElementById('modal-cancel').addEventListener('click', () => {
                modal.classList.remove('open');
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('open');
            });
        }

        // ============================================================
        //  EDITAR CANAL
        // ============================================================
        function openEditChannel(channelId) {
            const db = getDB();
            const ch = db.channels.find(c => c.id === channelId);
            if (!ch) return;
            const session = getSession();
            if (!session || ch.adminId !== session.userId) {
                alert('Apenas o administrador do canal pode editá-lo.');
                return;
            }

            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '✏️ Editar Canal';
            document.getElementById('modal-sub').textContent = 'Altere o nome do canal.';
            document.getElementById('modal-body').innerHTML = `
                <div class="input-group">
                    <label>Novo nome</label>
                    <input id="edit-channel-name" value="${ch.name}" />
                </div>
            `;
            document.getElementById('modal-confirm').textContent = 'Salvar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('edit-channel-name').value.trim();
                if (!name) { alert('Digite um nome.'); return; }
                const db = getDB();
                const ch2 = db.channels.find(c => c.id === channelId);
                if (ch2) {
                    ch2.name = name;
                    saveDB(db);
                    renderSidebar();
                    updateChatHeader();
                }
                modal.classList.remove('open');
            });

            document.getElementById('modal-cancel').addEventListener('click', () => {
                modal.classList.remove('open');
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('open');
            });
        }

        // ============================================================
        //  EXCLUIR CANAL
        // ============================================================
        function openDeleteChannel(channelId) {
            const db = getDB();
            const ch = db.channels.find(c => c.id === channelId);
            if (!ch) return;
            const session = getSession();
            if (!session || ch.adminId !== session.userId) {
                alert('Apenas o administrador pode excluir o canal.');
                return;
            }

            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '⚠️ Excluir Canal';
            document.getElementById('modal-sub').textContent = `Tem certeza que deseja excluir "${ch.name}"? Todas as mensagens serão perdidas.`;
            document.getElementById('modal-body').innerHTML = '';
            document.getElementById('modal-confirm').textContent = 'Excluir';
            document.getElementById('modal-confirm').className = 'btn-danger';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

            newConfirm.addEventListener('click', () => {
                const db = getDB();
                db.channels = db.channels.filter(c => c.id !== channelId);
                db.messages = db.messages.filter(m => m.channelId !== channelId);
                saveDB(db);
                modal.classList.remove('open');
                if (currentChannelId === channelId) {
                    currentChannelId = null;
                    loadFirstChannel();
                } else {
                    renderSidebar();
                }
            });

            document.getElementById('modal-cancel').addEventListener('click', () => {
                modal.classList.remove('open');
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('open');
            });
        }

        //  BOTÕES DO HEADER
        // ============================================================
        document.getElementById('edit-channel-btn').addEventListener('click', () => {
            if (currentChannelId) openEditChannel(currentChannelId);

        document.getElementById('delete-channel-btn').addEventListener('click', () => {
            if (currentChannelId) openDeleteChannel(currentChannelId);
        });

        // ============================================================
        //  GERENCIAR ADMINS
        // ============================================================
        function openManageAdmins() {
            const db = getDB();
            const session = getSession();
            if (!session) return;
            if (!isAdmin(session.userId)) {
                alert('Apenas administradores globais podem gerenciar admins.');
                return;
            }

            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '👑 Gerenciar Administradores';
            document.getElementById('modal-sub').textContent = 'Defina quem são os administradores globais do sistema.';
            let userList = db.users.map(u => {
                const checked = u.isAdmin ? 'checked' : '';
                return `
                    <div class="user-list-item" style="cursor:default;">
                        <div class="avatar-small">${u.avatar || getInitials(u.username)}</div>
                        <span class="uname">${u.username}</span>
                        <span style="margin-left:auto;">
                            <label style="color:#8888aa;font-size:13px;">
                                <input type="checkbox" class="admin-toggle" data-id="${u.id}" ${checked} />
                                Admin
                            </label>
                        </span>
                    </div>
                `;
            }).join('');

            document.getElementById('modal-body').innerHTML = `
                <div style="max-height:300px;overflow-y:auto;background:#1a1a32;border-radius:10px;padding:4px;">
                    ${userList}
                </div>
            `;
            document.getElementById('modal-confirm').textContent = 'Salvar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

            newConfirm.addEventListener('click', () => {
                const db = getDB();
                const toggles = document.querySelectorAll('.admin-toggle');
                toggles.forEach(t => {
                    const uid = t.dataset.id;
                    const user = db.users.find(u => u.id === uid);
                    if (user) {
                        user.isAdmin = t.checked;
                    }
                });
                saveDB(db);
                const updated = db.users.find(u => u.id === session.userId);
                if (updated) currentUser = updated;
                updateUserBadge();
                modal.classList.remove('open');
                renderSidebar();
            });

            document.getElementById('modal-cancel').addEventListener('click', () => {
                modal.classList.remove('open');
            });
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('open');
            });
        }

            initAuth();

        // ============================================================
        //  POLLING PARA ATUALIZAÇÃO EM TEMPO REAL (simulado)
        // ============================================================
        let lastRender = 0;
        setInterval(() => {
            if (currentUser && currentChannelId) {
                const db = getDB();
                const messages = getMessages(currentChannelId);
                const lastMsg = messages.length ? messages[messages.length - 1] : null;
                if (lastMsg && lastMsg.timestamp > lastRender) {
                    renderMessages();
                    lastRender = Date.now();
                }
                renderSidebar();
            }
        }, 3000);

        console.log('💬 Chat+Plus carregado!');
