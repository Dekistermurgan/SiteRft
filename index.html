<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat+Plus — Converse com Arquivos</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #2d2d44; }
        ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #5a5a7a; }
        button { cursor: pointer; border: none; outline: none; background: none; color: inherit; }
        input, textarea {
            background: #2d2d44;
            border: none;
            outline: none;
            color: #eee;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
        }
        input::placeholder, textarea::placeholder { color: #8888aa; }

        /* ===== AUTH ===== */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #14142a, #1e1e3a);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #auth-screen.hidden { opacity: 0; pointer-events: none; }
        .auth-box {
            background: #252540;
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            border: 1px solid #3a3a5a;
        }
        .auth-box h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-align: center;
        }
        .auth-box .subtitle { color: #9999bb; text-align: center; font-size: 14px; margin-bottom: 28px; }
        .auth-box .input-group { margin-bottom: 16px; position: relative; }
        .auth-box .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6666aa;
            font-size: 16px;
        }
        .auth-box .input-group input {
            padding-left: 44px;
            background: #1e1e36;
            border: 1px solid #3a3a5a;
            transition: 0.2s;
        }
        .auth-box .input-group input:focus { border-color: #7c6cf0; background: #262646; }
        .auth-box .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            transition: 0.2s;
            margin-top: 8px;
        }
        .auth-box .btn-primary:hover { transform: scale(1.02); opacity: 0.9; }
        .auth-box .auth-switch { text-align: center; margin-top: 18px; color: #8888aa; font-size: 14px; }
        .auth-box .auth-switch .auth-link { color: #b76cf0; cursor: pointer; font-weight: 600; }
        .auth-box .auth-switch .auth-link:hover { text-decoration: underline; }
        .auth-box .error-msg { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 10px; min-height: 20px; }

        /* ===== APP LAYOUT ===== */
        #app { display: none; width: 100%; height: 100vh; background: #16162e; overflow: hidden; }
        #app.active { display: flex; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            min-width: 240px;
            background: #1e1e38;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d4a;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-header .brand {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header .user-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #2d2d4a;
            padding: 3px 10px 3px 5px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            color: #ccc;
            cursor: pointer;
        }
        .sidebar-header .user-badge .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar-header .user-badge .logout-btn { margin-left: 2px; color: #8888aa; font-size: 13px; transition: 0.2s; }
        .sidebar-header .user-badge .logout-btn:hover { color: #ff6b6b; }

        .sidebar-nav {
            padding: 8px 12px;
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #2d2d4a;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .sidebar-nav button {
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            background: transparent;
            color: #8888aa;
            transition: 0.2s;
        }
        .sidebar-nav button:hover { background: #2d2d4a; color: #eee; }
        .sidebar-nav button.active { background: #3a3a5a; color: #fff; }

        .sidebar-channels {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
        }
        .sidebar-channels .channel-group-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6666aa;
            padding: 8px 6px 2px;
            font-weight: 600;
        }
        .sidebar-channels .channel-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.15s;
            color: #aaaacc;
            font-size: 13px;
            margin-bottom: 1px;
            position: relative;
        }
        .sidebar-channels .channel-item:hover { background: #2d2d4a; color: #eee; }
        .sidebar-channels .channel-item.active { background: #3a3a5a; color: #fff; }
        .sidebar-channels .channel-item i { width: 18px; text-align: center; font-size: 14px; color: #6666aa; }
        .sidebar-channels .channel-item.active i { color: #b76cf0; }
        .sidebar-channels .channel-item .channel-actions {
            display: none;
            gap: 3px;
            margin-left: auto;
        }
        .sidebar-channels .channel-item:hover .channel-actions { display: flex; }
        .sidebar-channels .channel-item .channel-actions button {
            color: #8888aa;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .sidebar-channels .channel-item .channel-actions button:hover { color: #fff; background: #4a4a6a; }
        .sidebar-channels .channel-item .channel-actions button.danger:hover { color: #ff6b6b; }

        .sidebar-footer {
            padding: 8px 12px;
            border-top: 1px solid #2d2d4a;
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .sidebar-footer button {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            background: #2d2d4a;
            color: #ccc;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 50px;
        }
        .sidebar-footer button:hover { background: #3d3d5a; color: #fff; }
        .sidebar-footer button.primary { background: linear-gradient(135deg, #7c6cf0, #b76cf0); color: #fff; }
        .sidebar-footer button.primary:hover { opacity: 0.9; }
        .sidebar-footer .friend-btn { background: #2d4a4a; }
        .sidebar-footer .friend-btn:hover { background: #3d5a5a; }

        /* ===== CHAT ===== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a32;
            height: 100vh;
            overflow: hidden;
            min-width: 0;
        }

        .chat-header {
            padding: 10px 18px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: #1e1e38;
        }
        .chat-header .chat-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .chat-header .chat-info h2 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header .chat-info .member-count { font-size: 12px; color: #8888aa; white-space: nowrap; }
        .chat-header .chat-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .chat-header .chat-actions button {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            background: #2d2d4a;
            color: #ccc;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-header .chat-actions button:hover { background: #3d3d5a; color: #fff; }
        .chat-header .chat-actions button.danger:hover { background: #6b2d2d; color: #ff6b6b; }
        .chat-header .chat-actions button.success:hover { background: #2d6b2d; color: #7cff7c; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .chat-messages .msg-date-divider {
            text-align: center;
            font-size: 11px;
            color: #6666aa;
            padding: 8px 0 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .chat-messages .message {
            display: flex;
            gap: 10px;
            padding: 4px 10px 4px 6px;
            border-radius: 6px;
            transition: 0.1s;
            max-width: 88%;
            align-self: flex-start;
        }
        .chat-messages .message.own { align-self: flex-end; flex-direction: row-reverse; background: #2d2d4a; }
        .chat-messages .message:hover { background: #262642; }
        .chat-messages .message.own:hover { background: #333355; }
        .chat-messages .message .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-messages .message .msg-content { flex: 1; min-width: 0; }
        .chat-messages .message .msg-header {
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
        }
        .chat-messages .message .msg-header .username { font-weight: 600; font-size: 13px; color: #b76cf0; }
        .chat-messages .message .msg-header .timestamp { font-size: 10px; color: #6666aa; }
        .chat-messages .message .msg-header .badge-admin {
            font-size: 9px;
            background: #7c6cf0;
            color: #fff;
            padding: 0 6px;
            border-radius: 30px;
            font-weight: 600;
        }
        .chat-messages .message .msg-text { font-size: 14px; line-height: 1.5; word-wrap: break-word; margin-top: 1px; color: #eee; }
        .chat-messages .message .msg-files {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .chat-messages .message .msg-files .file-card {
            background: #2d2d4a;
            border-radius: 6px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            border: 1px solid #3a3a5a;
            max-width: 200px;
            word-break: break-all;
        }
        .chat-messages .message .msg-files .file-card i { font-size: 16px; color: #b76cf0; }
        .chat-messages .message .msg-files .file-card a { color: #7c6cf0; text-decoration: none; font-weight: 500; }
        .chat-messages .message .msg-files .file-card a:hover { text-decoration: underline; }
        .chat-messages .message .msg-reactions {
            display: flex;
            gap: 3px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .chat-messages .message .msg-reactions .reaction {
            background: #2d2d4a;
            border-radius: 30px;
            padding: 0 8px 0 4px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .chat-messages .message .msg-reactions .reaction:hover { border-color: #7c6cf0; background: #3a3a5a; }
        .chat-messages .message .msg-reactions .reaction .count { font-size: 11px; color: #aaaacc; }

        .chat-input-area {
            padding: 8px 16px 12px;
            border-top: 1px solid #2d2d4a;
            background: #1e1e38;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-input-area .input-row { display: flex; align-items: flex-end; gap: 8px; }
        .chat-input-area .input-row .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: #2d2d44;
            border-radius: 10px;
            padding: 0 10px;
            border: 1px solid #3a3a5a;
            transition: 0.2s;
        }
        .chat-input-area .input-row .input-wrapper:focus-within { border-color: #7c6cf0; }
        .chat-input-area .input-row .input-wrapper textarea {
            background: transparent;
            border: none;
            padding: 8px 0;
            resize: none;
            height: 38px;
            max-height: 100px;
            font-size: 14px;
            line-height: 1.4;
            flex: 1;
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn {
            color: #8888aa;
            font-size: 18px;
            padding: 4px 2px 4px 6px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn:hover { color: #b76cf0; }
        .chat-input-area .input-row .input-wrapper .file-btn {
            color: #8888aa;
            font-size: 16px;
            padding: 4px 2px;
            transition: 0.2s;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
        }
        .chat-input-area .input-row .input-wrapper .file-btn:hover { color: #b76cf0; }
        .chat-input-area .input-row .input-wrapper .file-btn input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .chat-input-area .input-row .send-btn {
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .chat-input-area .input-row .send-btn:hover { transform: scale(1.05); opacity: 0.9; }
        .chat-input-area .file-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 2px 0;
        }
        .chat-input-area .file-preview .file-tag {
            background: #2d2d4a;
            border-radius: 5px;
            padding: 2px 10px 2px 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid #3a3a5a;
        }
        .chat-input-area .file-preview .file-tag i { color: #b76cf0; }
        .chat-input-area .file-preview .file-tag .remove { color: #ff6b6b; cursor: pointer; font-size: 13px; }

        /* ===== ACTIVE PANEL ===== */
        .active-panel {
            width: 200px;
            min-width: 200px;
            background: #1a1a32;
            border-left: 1px solid #2d2d4a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .active-panel .panel-header {
            padding: 12px 14px 8px;
            border-bottom: 1px solid #2d2d4a;
            font-weight: 700;
            font-size: 14px;
            color: #7c6cf0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .active-panel .panel-header .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        .active-panel .panel-header .count-badge {
            background: #2d2d4a;
            border-radius: 30px;
            padding: 0 10px;
            font-size: 12px;
            font-weight: 600;
            color: #aaaacc;
            margin-left: auto;
        }
        .active-panel .panel-body { flex: 1; overflow-y: auto; padding: 8px 10px; }
        .active-panel .active-user-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            transition: 0.15s;
            margin-bottom: 2px;
            font-size: 13px;
        }
        .active-panel .active-user-item:hover { background: #2d2d4a; }
        .active-panel .active-user-item .u-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
        }
        .active-panel .active-user-item .u-name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .active-panel .active-user-item .u-status { font-size: 10px; color: #4caf50; display: flex; align-items: center; gap: 3px; }
        .active-panel .active-user-item .u-status .dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; display: inline-block; }
        .active-panel .active-user-item .invite-btn {
            background: #2d4a4a;
            color: #7cff7c;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        .active-panel .active-user-item .invite-btn:hover { background: #3d6a5a; transform: scale(1.05); }
        .active-panel .active-user-item .invite-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .active-panel .panel-empty { color: #6666aa; text-align: center; padding: 30px 10px; font-size: 13px; }
        .active-panel .panel-empty i { font-size: 28px; display: block; margin-bottom: 8px; color: #3a3a5a; }

        /* ===== EMOJI PICKER ===== */
        .emoji-picker-container { position: relative; display: inline-block; }
        .emoji-picker-container .emoji-picker-popup {
            position: absolute;
            bottom: 50px;
            left: 0;
            z-index: 999;
            background: #252540;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #3a3a5a;
            padding: 6px;
            display: none;
            width: 280px;
            height: 340px;
            overflow-y: auto;
        }
        .emoji-picker-container .emoji-picker-popup.open { display: block; }
        .emoji-picker-container .emoji-picker-popup emoji-picker {
            --background: #252540;
            --border-color: #3a3a5a;
            --input-background: #1e1e36;
            --input-border-color: #4a4a6a;
            --input-font-color: #eee;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #252540;
            border-radius: 18px;
            padding: 28px 30px;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #3a3a5a;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8);
        }
        .modal-box h2 { font-size: 20px; margin-bottom: 2px; }
        .modal-box .modal-sub { color: #8888aa; font-size: 13px; margin-bottom: 16px; }
        .modal-box .input-group { margin-bottom: 12px; }
        .modal-box .input-group label { display: block; font-size: 12px; font-weight: 500; color: #aaaacc; margin-bottom: 3px; }
        .modal-box .input-group input, .modal-box .input-group select {
            background: #1e1e36;
            border: 1px solid #3a3a5a;
            border-radius: 6px;
            padding: 8px 12px;
            color: #eee;
            width: 100%;
            font-size: 13px;
        }
        .modal-box .input-group input:focus, .modal-box .input-group select:focus { border-color: #7c6cf0; }
        .modal-box .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions button {
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }

        /* ===== INVITE TOAST ===== */

        .invite-toast .toast-title { font-weight: 700; font-size: 15px; color: #b76cf0; margin-bottom: 4px; }

<body>

    <!-- ===== AUTH ===== -->
    <div id="auth-screen">
        <div class="auth-box">

                </div>

    <!-- ===== APP ===== -->
    <div id="app">

                    <span class="username-text" id="my-username">Usuário</span>
                    <button class="logout-btn" id="logout-btn" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <div class="sidebar-nav" id="sidebar-nav">
                <button class="active" data-filter="all"><i class="fas fa-hashtag"></i> Todos</button>
                <button data-filter="dm"><i class="fas fa-user"></i> DMs</button>
                <button data-filter="group"><i class="fas fa-users"></i> Grupos</button>
            </div>
            <div class="sidebar-channels" id="channel-list"></div>
            <div class="sidebar-footer">
                <button id="create-channel-btn" class="primary"><i class="fas fa-plus-circle"></i> <span>Canal</span></button>
                <button id="create-group-btn"><i class="fas fa-user-plus"></i> <span>Grupo</span></button>
                <button id="add-friend-btn" class="friend-btn"><i class="fas fa-user-friends"></i> <span>Amigo</span></button>
            </div>

        <!-- CHAT -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="chat-info">
                    <h2 id="chat-title"># geral</h2>
                    <span class="member-count" id="member-count">0 membros</span>
                </div>
                <div class="chat-actions">
                    <button id="add-member-btn" class="success" title="Adicionar membro"><i class="fas fa-user-plus"></i> <span>Membro</span></button>
                    <button id="edit-channel-btn" title="Editar"><i class="fas fa-pen"></i> <span>Editar</span></button>
                    <button id="delete-channel-btn" class="danger" title="Excluir"><i class="fas fa-trash"></i> <span>Excluir</span></button>
                    <button id="manage-users-btn" title="Admins globais"><i class="fas fa-user-cog"></i> <span>Admins</span></button>
                </div>
            </div>
            <div class="chat-messages" id="message-area"></div>

                    <div class="input-wrapper">
                        <textarea id="message-input" rows="1" placeholder="Digite uma mensagem..."></textarea>
                        <button class="emoji-btn" id="emoji-toggle-btn"><i class="far fa-smile"></i></button>
                        <div class="emoji-picker-container">
                            <div class="emoji-picker-popup" id="emoji-picker-popup">
                                <emoji-picker id="emoji-picker"></emoji-picker>
                            </div>
                        </div>
                        <label class="file-btn">
                            <i class="fas fa-paperclip"></i>
                            <input type="file" id="file-input" multiple />
                        </label>
                    </div>
                    <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- ACTIVE USERS -->
        <div class="active-panel" id="active-panel">
            <div class="panel-header">
                <span class="online-dot"></span>
                ATIVOS
                <span class="count-badge" id="active-count">0</span>
            </div>
            <div class="panel-body" id="active-users-list">
                <div class="panel-empty">
                    <i class="fas fa-users"></i>
                    Nenhum usuário ativo no momento.
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="modal-box">
            <h2 id="modal-title">Título</h2>
            <p class="modal-sub" id="modal-sub">Subtítulo</p>
            <div id="modal-body"></div>
            <div class="modal-actions" id="modal-actions">
                <button class="btn-cancel" id="modal-cancel">Cancelar</button>
                <button class="btn-confirm" id="modal-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- ===== INVITE TOAST ===== -->
    <div class="invite-toast" id="invite-toast">
        <div class="toast-title" id="toast-title">📨 Convite recebido</div>
        <div class="toast-body" id="toast-body">Você foi convidado para entrar em um grupo.</div>
        <div class="toast-actions">
            <button class="btn-reject" id="toast-reject">Recusar</button>
            <button class="btn-accept" id="toast-accept">Aceitar</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  🔥 FIREBASE CONFIG — SUAS CREDENCIAIS
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBITkgiiBiGPM-hCQ8SW4Tbz5_rT-ORhkk",
            authDomain: "rift-f1195.firebaseapp.com",
            databaseURL: "https://rift-f1195-default-rtdb.firebaseio.com",
            projectId: "rift-f1195",
            storageBucket: "rift-f1195.firebasestorage.app",
            messagingSenderId: "768285657957",
            appId: "1:768285657957:web:6a355d9c0e07cab53faf8c",
            measurementId: "G-P1XFNGY6LC"
        };

        // Inicializa Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================================
        //  HELPERS
        // ============================================================
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

        function formatTime(ts) { return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

        function formatDate(ts) { return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }); }

        function getInitials(name) { return name.charAt(0).toUpperCase(); }

        // ============================================================
        //  AUTH STATE
        // ============================================================
        let currentUser = null;
        let isLoginMode = true;
        let currentChannelId = null;
        let currentFilter = 'all';
        let pendingFiles = [];
        let inviteCooldowns = {};

        // ============================================================
        //  AUTH LOGIC
        // ============================================================
        function initAuth() {
            const session = sessionStorage.getItem('chatplus_session');
            if (session) {
                const data = JSON.parse(session);
                db.ref('users/' + data.userId).once('value').then(snap => {
                    if (snap.exists()) {
                        currentUser = { id: data.userId, ...snap.val() };
                        showApp();
                    } else {
                        sessionStorage.removeItem('chatplus_session');
                        showAuth();
                    }
                });
            } else {
                showAuth();
            }
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app').classList.remove('active');
            document.getElementById('app').style.display = 'none';
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app').style.display = 'flex';
            document.getElementById('app').classList.add('active');
            updateUserBadge();
            startListeners();
            loadFirstChannel();
            // Marca online
            if (currentUser) {
                db.ref('users/' + currentUser.id + '/online').set(true);
                db.ref('users/' + currentUser.id + '/lastSeen').set(Date.now());
                db.ref('users/' + currentUser.id + '/online').onDisconnect().set(false);
                db.ref('users/' + currentUser.id + '/lastSeen').onDisconnect().set(Date.now());
            }
        }

        // ============================================================
        //  AUTH EVENTS
        // ============================================================
        document.getElementById('auth-toggle').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-btn').textContent = isLoginMode ? 'Entrar' : 'Registrar';
            document.getElementById('auth-switch-prefix').textContent = isLoginMode ? 'Não tem conta?' : 'Já tem conta?';
            document.getElementById('auth-toggle').textContent = isLoginMode ? 'Registrar' : 'Entrar';
            document.getElementById('auth-error').textContent = '';
        });

        document.getElementById('auth-btn').addEventListener('click', handleAuth);
        document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
        document.getElementById('auth-username').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });

        function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorEl = document.getElementById('auth-error');
            if (!username || !password) { errorEl.textContent = 'Preencha todos os campos.'; return; }

            if (isLoginMode) {
                db.ref('users').orderByChild('username').equalTo(username).once('value').then(snap => {
                    if (!snap.exists()) { errorEl.textContent = 'Usuário não encontrado.'; return; }
                    let userData = null;
                    let userId = null;
                    snap.forEach(child => {
                        userData = child.val();
                        userId = child.key;
                    });
                    if (userData.password !== password) { errorEl.textContent = 'Senha incorreta.'; return; }
                    currentUser = { id: userId, ...userData };
                    sessionStorage.setItem('chatplus_session', JSON.stringify({ userId }));
                    showApp();
                    errorEl.textContent = '';
                });
            } else {
                // Registrar
                db.ref('users').orderByChild('username').equalTo(username).once('value').then(snap => {
                    if (snap.exists()) { errorEl.textContent = 'Nome já existe.'; return; }
                    db.ref('users').once('value').then(allUsers => {
                        const first = !allUsers.exists();
                        const newUser = {
                            username,
                            password,
                            isAdmin: first,
                            friends: {},
                            avatar: getInitials(username),
                            createdAt: Date.now(),
                            online: true,
                            lastSeen: Date.now()
                        };
                        const newId = db.ref('users').push(newUser).key;
                        if (first) {
                            db.ref('channels').push({
                                name: 'geral',
                                type: 'group',
                                members: { [newId]: true },
                                adminId: newId,
                                createdAt: Date.now()
                            });
                        }
                        currentUser = { id: newId, ...newUser };
                        sessionStorage.setItem('chatplus_session', JSON.stringify({ userId: newId }));
                        showApp();
                        errorEl.textContent = '';
                    });
                });
            }
        }

        // ============================================================
        //  LOGOUT
        // ============================================================
        document.getElementById('logout-btn').addEventListener('click', () => {
            if (currentUser) {
                db.ref('users/' + currentUser.id + '/online').set(false);
                db.ref('users/' + currentUser.id + '/lastSeen').set(Date.now());
            }
            sessionStorage.removeItem('chatplus_session');
            currentUser = null;
            showAuth();
            document.getElementById('app').style.display = 'none';
            if (window.channelListener) window.channelListener();
            if (window.msgListener) window.msgListener();
            if (window.inviteListener) window.inviteListener();
        });

        // ============================================================
        //  UI: USER BADGE
        // ============================================================
        function updateUserBadge() {
            if (!currentUser) return;
            document.getElementById('my-avatar').textContent = currentUser.avatar || getInitials(currentUser.username);
            document.getElementById('my-username').textContent = currentUser.username;
        }

        // ============================================================
        //  LISTENERS (REALTIME)
        // ============================================================
        let channelListener = null;
        let msgListener = null;
        let inviteListener = null;

        function startListeners() {
            if (channelListener) channelListener();
            channelListener = db.ref('channels').on('value', snap => {
                renderSidebar();
                updateChatHeader();
            });

            if (msgListener) msgListener();
            if (currentChannelId) {
                msgListener = db.ref('messages/' + currentChannelId).on('value', snap => {
                    renderMessages();
                });
            }

            if (inviteListener) inviteListener();
            if (currentUser) {
                inviteListener = db.ref('invites').orderByChild('targetId').equalTo(currentUser.id).on('value', snap => {
                    const invites = [];
                    snap.forEach(child => {
                        const inv = child.val();
                        inv.id = child.key;
                        if (inv.status === 'pending') invites.push(inv);
                    });
                    if (invites.length) {
                        showInviteToast(invites[0]);
                    }
                });
            }
        }

        // ============================================================
        //  RENDER SIDEBAR
        // ============================================================
        function renderSidebar() {
            if (!currentUser) return;
            const list = document.getElementById('channel-list');
            db.ref('channels').once('value').then(snap => {
                const channels = [];
                snap.forEach(child => {
                    const ch = child.val();
                    ch.id = child.key;
                    if (ch.members && ch.members[currentUser.id]) {
                        channels.push(ch);
                    }
                });
                let filtered = channels;
                if (currentFilter === 'dm') filtered = filtered.filter(c => c.type === 'dm');
                else if (currentFilter === 'group') filtered = filtered.filter(c => c.type === 'group' || c.type === 'text');

                let html = '';
                const groups = filtered.filter(c => c.type === 'group' || c.type === 'text');
                const dms = filtered.filter(c => c.type === 'dm');

                if (groups.length) {
                    html += `<div class="channel-group-label">📌 Canais</div>`;
                    groups.forEach(c => {
                        const active = c.id === currentChannelId ? 'active' : '';
                        const isAdmin = c.adminId === currentUser.id;
                        html += `
                            <div class="channel-item ${active}" data-id="${c.id}">
                                <i class="fas fa-hashtag"></i>
                                <span>${c.name}</span>
                                ${isAdmin ? `<div class="channel-actions">
                                    <button class="edit-channel-btn" data-id="${c.id}" title="Editar"><i class="fas fa-pen"></i></button>
                                    <button class="delete-channel-btn danger" data-id="${c.id}" title="Excluir"><i class="fas fa-trash"></i></button>
                                </div>` : ''}
                            </div>
                        `;
                    });
                }

                if (dms.length) {
                    html += `<div class="channel-group-label">💬 DMs</div>`;
                    dms.forEach(c => {
                        const active = c.id === currentChannelId ? 'active' : '';
                        const otherId = Object.keys(c.members).find(id => id !== currentUser.id);
                        db.ref('users/' + otherId).once('value').then(userSnap => {
                            const user = userSnap.val();
                            const name = user ? user.username : 'Desconhecido';
                        });
                        html += `
                            <div class="channel-item ${active}" data-id="${c.id}">
                                <i class="fas fa-user"></i>
                                <span>${c.name || 'DM'}</span>
                            </div>
                        `;
                    });
                }

                if (currentUser.friends) {
                    const friendIds = Object.keys(currentUser.friends);
                    if (friendIds.length) {
                        html += `<div class="channel-group-label">👥 Amigos</div>`;
                        friendIds.forEach(fid => {
                            db.ref('users/' + fid).once('value').then(snap => {
                                if (snap.exists()) { }
                            });
                            html += `
                                <div class="channel-item" data-friend="${fid}">
                                    <i class="fas fa-user"></i>
                                    <span>${fid}</span>
                                </div>
                            `;
                        });
                    }
                }

                if (!html) {
                    html = `<div style="color:#6666aa;padding:16px;text-align:center;font-size:13px;">Nenhum canal ou amigo.<br>Crie ou adicione alguém.</div>`;
                }

                list.innerHTML = html;

                list.querySelectorAll('.channel-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const id = el.dataset.id;
                        if (id) switchChannel(id);
                    });
                });
                list.querySelectorAll('.edit-channel-btn').forEach(btn => {
                    btn.addEventListener('click', e => { e.stopPropagation(); openEditChannel(btn.dataset.id); });
                });
                list.querySelectorAll('.delete-channel-btn').forEach(btn => {
                    btn.addEventListener('click', e => { e.stopPropagation(); openDeleteChannel(btn.dataset.id); });
                });
            });
        }

        // ============================================================
        //  SWITCH CHANNEL
        // ============================================================
        function switchChannel(channelId) {
            currentChannelId = channelId;
            if (msgListener) {
                db.ref('messages/' + channelId).off();
                msgListener = null;
            }
            msgListener = db.ref('messages/' + channelId).on('value', snap => {
                renderMessages();
            });
            renderSidebar();
            renderMessages();
            updateChatHeader();
            db.ref('channels/' + channelId).once('value').then(snap => {
                const ch = snap.val();
                if (ch && ch.adminId === currentUser.id) {
                    document.getElementById('add-member-btn').style.display = 'flex';
                    document.getElementById('edit-channel-btn').style.display = 'flex';
                    document.getElementById('delete-channel-btn').style.display = 'flex';
                } else {
                    document.getElementById('add-member-btn').style.display = 'none';
                    document.getElementById('edit-channel-btn').style.display = 'none';
                    document.getElementById('delete-channel-btn').style.display = 'none';
                }
            });
            sessionStorage.setItem('last_channel', channelId);
        }

        function loadFirstChannel() {
            db.ref('channels').once('value').then(snap => {
                const channels = [];
                snap.forEach(child => {
                    const ch = child.val();
                    ch.id = child.key;
                    if (ch.members && ch.members[currentUser.id]) {
                        channels.push(ch);
                    }
                });
                if (channels.length) {
                    const last = sessionStorage.getItem('last_channel');
                    if (last && channels.find(c => c.id === last)) {
                        switchChannel(last);
                        return;
                    }
                    switchChannel(channels[0].id);
                } else {
                    currentChannelId = null;
                    document.getElementById('chat-title').textContent = 'Nenhum canal';
                    document.getElementById('member-count').textContent = '';

        // ============================================================

        // ============================================================
        function renderMessages() {
            const area = document.getElementById('message-area');
            if (!currentChannelId) {
                area.innerHTML = '<div style="color:#6666aa;text-align:center;padding:40px;">Selecione um canal</div>';
                return;
            }
            db.ref('messages/' + currentChannelId).once('value').then(snap => {
                const msgs = [];
                snap.forEach(child => {
                    const m = child.val();
                    m.id = child.key;
                    msgs.push(m);
                });
                msgs.sort((a, b) => a.timestamp - b.timestamp);

                let html = '';
                let lastDate = '';
                msgs.forEach(msg => {
                    const d = formatDate(msg.timestamp);
                    if (d !== lastDate) { html += `<div class="msg-date-divider">${d}</div>`; lastDate = d; }
                    const isOwn = msg.userId === currentUser.id;
                    const username = msg.username || 'Desconhecido';
                    const avatar = msg.avatar || getInitials(username);
                    const isAdmin = msg.isAdmin || false;
                    const time = formatTime(msg.timestamp);
                    let filesHtml = '';
                    if (msg.files && msg.files.length) {
                        filesHtml = `<div class="msg-files">`;
                        msg.files.forEach(f => {
                            const icon = f.type && f.type.startsWith('image/') ? 'fa-image' : 'fa-file';
                            filesHtml += `
                                <div class="file-card">
                                    <i class="fas ${icon}"></i>
                                    <a href="${f.data}" ${f.type && f.type.startsWith('image/') ? 'target="_blank"' : 'download="'+f.name+'"'} >${f.name}</a>
                                    <span style="font-size:10px;color:#6666aa;">(${(f.size/1024).toFixed(1)} KB)</span>
                                </div>
                            `;
                        });
                        filesHtml += `</div>`;
                    }
                    let reactionsHtml = '';
                    if (msg.reactions) {
                        reactionsHtml = `<div class="msg-reactions">`;
                        for (const [emoji, users] of Object.entries(msg.reactions)) {
                            const count = users.length;
                            const hasReacted = users.includes(currentUser.id);
                            reactionsHtml += `
                                <div class="reaction ${hasReacted ? 'active' : ''}" data-msgid="${msg.id}" data-emoji="${emoji}">
                                    <span>${emoji}</span>
                                    <span class="count">${count}</span>
                                </div>
                            `;
                        }
                        reactionsHtml += `</div>`;
                    }
                    html += `
                        <div class="message ${isOwn ? 'own' : ''}" data-id="${msg.id}">
                            <div class="msg-avatar" style="background:${isAdmin ? 'linear-gradient(135deg,#f093fb,#f5576c)' : 'linear-gradient(135deg,#7c6cf0,#b76cf0)'}">${avatar}</div>
                            <div class="msg-content">
                                <div class="msg-header">
                                    <span class="username">${username}</span>
                                    ${isAdmin ? '<span class="badge-admin">ADMIN</span>' : ''}
                                    <span class="timestamp">${time}</span>
                                </div>
                                ${msg.content ? `<div class="msg-text">${escapeHtml(msg.content)}</div>` : ''}
                                ${filesHtml}
                                ${reactionsHtml}
                            </div>
                        </div>
                    `;
                });
                if (!html) html = '<div style="color:#6666aa;text-align:center;padding:40px;">Sem mensagens.</div>';
                area.innerHTML = html;
                area.scrollTop = area.scrollHeight;
                area.querySelectorAll('.reaction').forEach(el => {
                    el.addEventListener('click', () => {
                        toggleReaction(el.dataset.msgid, el.dataset.emoji);
                    });
                });
            });
        }

        // ============================================================

        function toggleReaction(msgId, emoji) {
            if (!currentUser) return;
            const ref = db.ref('messages/' + currentChannelId + '/' + msgId + '/reactions/' + emoji);
            ref.transaction(current => {
                if (!current) current = [];
                const idx = current.indexOf(currentUser.id);
                if (idx > -1) { current.splice(idx, 1); } else { current.push(currentUser.id); }
                return current;
            });
        }

            updateFilePreview();
            e.target.value = '';
        });

        function updateFilePreview() {
            const c = document.getElementById('file-preview');
            if (!pendingFiles.length) { c.innerHTML = ''; return; }
            let html = '';
            pendingFiles.forEach((f, i) => {
                html += `
                    <div class="file-tag">
                        <i class="fas fa-file"></i>
                        <span>${f.name} (${(f.size/1024).toFixed(1)} KB)</span>
                        <span class="remove" data-idx="${i}"><i class="fas fa-times-circle"></i></span>
                    </div>
                `;
            });
            c.innerHTML = html;
            c.querySelectorAll('.remove').forEach(el => {
                el.addEventListener('click', () => { pendingFiles.splice(parseInt(el.dataset.idx), 1); updateFilePreview(); });
            });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        function sendMessage() {
            if (!currentChannelId) { alert('Selecione um canal.'); return; }
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content && !pendingFiles.length) return;
            if (!currentUser) return;

            const msg = {
                userId: currentUser.id,
                username: currentUser.username,
                avatar: currentUser.avatar || getInitials(currentUser.username),
                isAdmin: currentUser.isAdmin || false,
                content: content || '',
                timestamp: Date.now(),
                files: [],
                reactions: {}
            };

            const promises = pendingFiles.map(f => new Promise(r => {
                const reader = new FileReader();
                reader.onload = e => r({ name: f.name, type: f.type, size: f.size, data: e.target.result });
                reader.readAsDataURL(f);
            }));

            Promise.all(promises).then(files => {
                msg.files = files;
                const ref = db.ref('messages/' + currentChannelId).push();
                ref.set(msg);
                pendingFiles = [];
                updateFilePreview();
                input.value = '';
                input.style.height = '38px';
            });
        }

        // ============================================================
        //  INVITE TO GROUP
        // ============================================================
        function openInviteToGroup(targetId) {
            if (!currentUser) return;
            db.ref('channels').once('value').then(snap => {
                const myGroups = [];
                snap.forEach(child => {
                    const ch = child.val();
                    ch.id = child.key;
                    if (ch.type === 'group' && ch.adminId === currentUser.id && ch.members && ch.members[currentUser.id]) {
                        myGroups.push(ch);
                    }
                });
                if (!myGroups.length) {
                    alert('Você não é administrador de nenhum grupo.');
                    return;
                }
                const modal = document.getElementById('modal-overlay');
                document.getElementById('modal-title').textContent = '📨 Convidar para grupo';
                db.ref('users/' + targetId).once('value').then(userSnap => {
                    const targetName = userSnap.val() ? userSnap.val().username : 'usuário';
                    document.getElementById('modal-sub').textContent = `Selecione um grupo para convidar ${targetName}:`;
                });
                let groupList = myGroups.map(g => `
                    <div class="group-select-item">
                        <input type="radio" name="invite-group" value="${g.id}" id="g_${g.id}" />
                        <label for="g_${g.id}" style="flex:1;cursor:pointer;"># ${g.name} (${g.members ? Object.keys(g.members).length : 0} membros)</label>
                    </div>
                `).join('');
                document.getElementById('modal-body').innerHTML = `
                    <div style="max-height:200px;overflow-y:auto;background:#1a1a32;border-radius:8px;padding:4px;">
                        ${groupList}
                    </div>
                `;
                document.getElementById('modal-confirm').textContent = 'Convidar';
                document.getElementById('modal-confirm').className = 'btn-confirm';
                document.getElementById('modal-cancel').textContent = 'Cancelar';
                modal.classList.add('open');

                const confirmBtn = document.getElementById('modal-confirm');
                const newConfirm = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
                newConfirm.addEventListener('click', () => {
                    const selected = document.querySelector('input[name="invite-group"]:checked');
                    if (!selected) { alert('Selecione um grupo.'); return; }
                    const groupId = selected.value;
                    const key = currentUser.id + '_' + targetId;
                    if (inviteCooldowns[key] && (Date.now() - inviteCooldowns[key]) < 5000) {
                        alert('Aguarde 5 segundos para convidar novamente.');
                        return;
                    }
                    db.ref('invites').orderByChild('targetId').equalTo(targetId).once('value').then(snap => {
                        let exists = false;
                        snap.forEach(child => {
                            const inv = child.val();
                            if (inv.inviterId === currentUser.id && inv.groupId === groupId && inv.status === 'pending') {
                                exists = true;
                            }
                        });
                        if (exists) {
                            alert('Já existe um convite pendente para este grupo.');
                            return;
                        }
                        const invite = {
                            inviterId: currentUser.id,
                            targetId: targetId,
                            groupId: groupId,
                            status: 'pending',
                            timestamp: Date.now()
                        };
                        db.ref('invites').push(invite);
                        inviteCooldowns[key] = Date.now();
                        modal.classList.remove('open');
                        alert('Convite enviado!');
                    });
                });
                document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
            });
        }

        let currentInviteId = null;

        function showInviteToast(invite) {
            if (currentInviteId === invite.id) return;
            currentInviteId = invite.id;
            db.ref('users/' + invite.inviterId).once('value').then(inviterSnap => {
                const inviter = inviterSnap.val();
                db.ref('channels/' + invite.groupId).once('value').then(groupSnap => {
                    const group = groupSnap.val();
                    const toast = document.getElementById('invite-toast');
                    document.getElementById('toast-title').textContent = `📨 Convite de ${inviter ? inviter.username : 'alguém'}`;
                    document.getElementById('toast-body').textContent = `${inviter ? inviter.username : 'Alguém'} te convidou para o grupo "${group ? group.name : 'desconhecido'}". Aceitar?`;
                    toast.classList.add('show');

                    const acceptBtn = document.getElementById('toast-accept');
                    const rejectBtn = document.getElementById('toast-reject');
                    const newAccept = acceptBtn.cloneNode(true);
                    const newReject = rejectBtn.cloneNode(true);
                    acceptBtn.parentNode.replaceChild(newAccept, acceptBtn);
                    rejectBtn.parentNode.replaceChild(newReject, rejectBtn);

                    newAccept.addEventListener('click', () => {
                        db.ref('channels/' + invite.groupId + '/members/' + invite.targetId).set(true);
                        db.ref('invites/' + invite.id + '/status').set('accepted');
                        toast.classList.remove('show');
                        currentInviteId = null;
                        alert('✅ Você entrou no grupo!');
                        renderSidebar();
                        loadFirstChannel();
                    });

                    newReject.addEventListener('click', () => {
                        db.ref('invites/' + invite.id + '/status').set('rejected');
                        toast.classList.remove('show');
                        currentInviteId = null;
                    });
                });
            });
        }

        });

        // ============================================================
        //  ADD MEMBER (admin only)
        // ============================================================
        document.getElementById('add-member-btn').addEventListener('click', () => {
            if (!currentChannelId) return;
            db.ref('channels/' + currentChannelId).once('value').then(snap => {
                const ch = snap.val();
                if (!ch || ch.adminId !== currentUser.id) {
                    alert('Apenas o administrador do canal pode adicionar membros.');
                    return;
                }
                db.ref('users').once('value').then(userSnap => {
                    const users = [];
                    userSnap.forEach(child => {
                        const u = child.val();
                        u.id = child.key;
                        if (u.id !== currentUser.id && (!ch.members || !ch.members[u.id])) {
                            users.push(u);
                        }
                    });
                    const modal = document.getElementById('modal-overlay');
                    document.getElementById('modal-title').textContent = '➕ Adicionar Membro';
                    document.getElementById('modal-sub').textContent = `Adicione ao canal "${ch.name}".`;
                    let userList = users.map(u => `
                        <div class="user-list-item">
                            <div class="avatar-small">${u.avatar || getInitials(u.username)}</div>
                            <span class="uname">${u.username}</span>
                            ${u.isAdmin ? '<span class="role-badge">ADMIN</span>' : ''}
                            <span style="margin-left:auto;"><input type="checkbox" class="member-add-check" data-id="${u.id}" /></span>
                        </div>
                    `).join('');
                    if (!users.length) userList = '<div style="color:#6666aa;padding:12px;">Todos já estão neste canal.</div>';
                    document.getElementById('modal-body').innerHTML = `<div style="max-height:250px;overflow-y:auto;background:#1a1a32;border-radius:8px;padding:4px;">${userList}</div>`;
                    document.getElementById('modal-confirm').textContent = 'Adicionar';
                    document.getElementById('modal-confirm').className = 'btn-confirm';
                    document.getElementById('modal-cancel').textContent = 'Cancelar';
                    modal.classList.add('open');

                    const confirmBtn = document.getElementById('modal-confirm');
                    const newConfirm = confirmBtn.cloneNode(true);
                    confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
                    newConfirm.addEventListener('click', () => {
                        const checks = document.querySelectorAll('.member-add-check:checked');
                        const ids = [];
                        checks.forEach(c => ids.push(c.dataset.id));
                        if (!ids.length) { alert('Selecione pelo menos um usuário.'); return; }
                        const updates = {};
                        ids.forEach(id => { updates['members/' + id] = true; });
                        db.ref('channels/' + currentChannelId).update(updates);
                        modal.classList.remove('open');
                        renderSidebar();
                        updateChatHeader();
                    });
                    document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
                    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
                });
            });
        });

        // ============================================================
        //  EDIT / DELETE CHANNEL
        // ============================================================
        function openEditChannel(channelId) {
            db.ref('channels/' + channelId).once('value').then(snap => {
                const ch = snap.val();
                if (!ch || ch.adminId !== currentUser.id) { alert('Apenas o admin pode editar.'); return; }
                const modal = document.getElementById('modal-overlay');
                document.getElementById('modal-title').textContent = '✏️ Editar Canal';
                document.getElementById('modal-sub').textContent = 'Altere o nome.';
                document.getElementById('modal-body').innerHTML = `<div class="input-group"><label>Novo nome</label><input id="edit-channel-name" value="${ch.name}" /></div>`;
                document.getElementById('modal-confirm').textContent = 'Salvar';
                document.getElementById('modal-confirm').className = 'btn-confirm';
                document.getElementById('modal-cancel').textContent = 'Cancelar';
                modal.classList.add('open');

                const confirmBtn = document.getElementById('modal-confirm');
                const newConfirm = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
                newConfirm.addEventListener('click', () => {
                    const name = document.getElementById('edit-channel-name').value.trim();
                    if (!name) { alert('Digite um nome.'); return; }
                    db.ref('channels/' + channelId + '/name').set(name);
                    modal.classList.remove('open');
                    renderSidebar();
                    updateChatHeader();
                });
                document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
            });
        }

        function openDeleteChannel(channelId) {
            db.ref('channels/' + channelId).once('value').then(snap => {
                const ch = snap.val();
                if (!ch || ch.adminId !== currentUser.id) { alert('Apenas o admin pode excluir.'); return; }
                const modal = document.getElementById('modal-overlay');
                document.getElementById('modal-title').textContent = '⚠️ Excluir Canal';
                document.getElementById('modal-sub').textContent = `Tem certeza? "${ch.name}" será excluído com todas as mensagens.`;
                document.getElementById('modal-body').innerHTML = '';
                document.getElementById('modal-confirm').textContent = 'Excluir';
                document.getElementById('modal-confirm').className = 'btn-danger';
                document.getElementById('modal-cancel').textContent = 'Cancelar';
                modal.classList.add('open');

                const confirmBtn = document.getElementById('modal-confirm');
                const newConfirm = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
                newConfirm.addEventListener('click', () => {
                    db.ref('channels/' + channelId).remove();
                    db.ref('messages/' + channelId).remove();
                    modal.classList.remove('open');
                    if (currentChannelId === channelId) {
                        currentChannelId = null;
                        loadFirstChannel();
                    } else {
                        renderSidebar();
                    }
                });
                document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
            });
        }

        // ============================================================
        //  GLOBAL ADMINS
        // ============================================================
        document.getElementById('manage-users-btn').addEventListener('click', () => {
            if (!currentUser || !currentUser.isAdmin) {
                alert('Apenas administradores globais podem gerenciar admins.');
                return;
            }
            db.ref('users').once('value').then(snap => {
                const users = [];
                snap.forEach(child => {
                    const u = child.val();
                    u.id = child.key;
                    users.push(u);
                });
                const modal = document.getElementById('modal-overlay');
                document.getElementById('modal-title').textContent = '👑 Admins Globais';
                document.getElementById('modal-sub').textContent = 'Defina administradores do sistema.';
                let userList = users.map(u => {
                    const checked = u.isAdmin ? 'checked' : '';
                    return `
                        <div class="user-list-item">
                            <div class="avatar-small">${u.avatar || getInitials(u.username)}</div>
                            <span class="uname">${u.username}</span>
                            <span style="margin-left:auto;">
                                <label style="font-size:12px;color:#8888aa;">
                                    <input type="checkbox" class="admin-toggle" data-id="${u.id}" ${checked} /> Admin
                                </label>
                            </span>
                        </div>
                    `;
                }).join('');
                document.getElementById('modal-body').innerHTML = `<div style="max-height:300px;overflow-y:auto;background:#1a1a32;border-radius:8px;padding:4px;">${userList}</div>`;
                document.getElementById('modal-confirm').textContent = 'Salvar';
                document.getElementById('modal-confirm').className = 'btn-confirm';
                document.getElementById('modal-cancel').textContent = 'Cancelar';
                modal.classList.add('open');

                const confirmBtn = document.getElementById('modal-confirm');
                const newConfirm = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
                newConfirm.addEventListener('click', () => {
                    const toggles = document.querySelectorAll('.admin-toggle');
                    toggles.forEach(t => {
                        db.ref('users/' + t.dataset.id + '/isAdmin').set(t.checked);
                    });
                    modal.classList.remove('open');
                    db.ref('users/' + currentUser.id + '/isAdmin').once('value').then(snap => {
                        currentUser.isAdmin = snap.val();
                        updateUserBadge();
                    });
                });
                document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
            });
        });

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', initAuth);

        console.log('✅ Chat+Plus com Firebase — agora coletivo!');
        console.log('🔑 Suas credenciais Firebase estão configuradas.');
    </script>
</body>
</html>
