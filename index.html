        // ============================================================
        //  INVITE TO GROUP (modal)
        // ============================================================
        function openInviteToGroup(targetId) {
            const session = getSession();
            if (!session) return;
            const db = getDB();
            // Grupos onde o usuário é admin
            const myGroups = db.channels.filter(c =>
                c.type === 'group' &&
                c.adminId === session.userId &&
                c.members.includes(session.userId)
            );

            if (!myGroups.length) {
                alert('Você não é administrador de nenhum grupo. Crie um grupo primeiro.');
                return;
            }

            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '📨 Convidar para grupo';
            document.getElementById('modal-sub').textContent = `Selecione um grupo para convidar ${getUserName(targetId)}:`;

            let groupList = myGroups.map(g => `
                <div class="group-select-item">
                    <input type="radio" name="invite-group" value="${g.id}" id="g_${g.id}" />
                    <label for="g_${g.id}" style="flex:1;cursor:pointer;"># ${g.name} (${g.members.length} membros)</label>
                </div>
            `).join('');

            document.getElementById('modal-body').innerHTML = `
                <div style="max-height:200px;overflow-y:auto;background:#1a1a32;border-radius:8px;padding:4px;">
                    ${groupList}
                </div>
            `;

            document.getElementById('modal-confirm').textContent = 'Convidar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

            newConfirm.addEventListener('click', () => {
                const selected = document.querySelector('input[name="invite-group"]:checked');
                if (!selected) { alert('Selecione um grupo.'); return; }
                const groupId = selected.value;
                const success = sendInvite(session.userId, targetId, groupId);
                if (success) {
                    modal.classList.remove('open');
                    alert(`Convite enviado para ${getUserName(targetId)}!`);
                    // Mostra o toast de confirmação
                } else {
                    // erro já tratado no sendInvite
                }
            });

            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        }

        // ============================================================
        //  INVITE POLLER (receber convites)
        // ============================================================
        let invitePoller = null;
        let lastInviteCheck = 0;

        function startInvitePoller() {
            if (invitePoller) clearInterval(invitePoller);
            invitePoller = setInterval(() => {
                const session = getSession();
                if (!session) return;
                cleanupOldInvites();
                const pending = getPendingInvites(session.userId);
                if (pending.length) {
                    // Mostra o primeiro convite pendente
                    showInviteToast(pending[0]);
                }
            }, 2000);
        }

        let currentInviteId = null;

        function showInviteToast(invite) {
            if (currentInviteId === invite.id) return; // já mostrando
            currentInviteId = invite.id;
            const inviter = getUser(invite.inviterId);
            const group = getChannel(invite.groupId);
            const toast = document.getElementById('invite-toast');
            document.getElementById('toast-title').textContent = `📨 Convite de ${inviter ? inviter.username : 'alguém'}`;
            document.getElementById('toast-body').textContent =
                `${inviter ? inviter.username : 'Alguém'} te convidou para entrar no grupo "${group ? group.name : 'desconhecido'}". Deseja aceitar?`;
            toast.classList.add('show');

            // Remove listeners antigos
            const acceptBtn = document.getElementById('toast-accept');
            const rejectBtn = document.getElementById('toast-reject');
            const newAccept = acceptBtn.cloneNode(true);
            const newReject = rejectBtn.cloneNode(true);
            acceptBtn.parentNode.replaceChild(newAccept, acceptBtn);
            rejectBtn.parentNode.replaceChild(newReject, rejectBtn);

            newAccept.addEventListener('click', () => {
                if (acceptInvite(invite.id)) {
                    toast.classList.remove('show');
                    currentInviteId = null;
                    renderSidebar();
                    loadFirstChannel();
                    alert('✅ Você entrou no grupo!');
                } else {
                    alert('Erro ao aceitar convite.');
                }
            });

            newReject.addEventListener('click', () => {
                rejectInvite(invite.id);
                toast.classList.remove('show');
                currentInviteId = null;
            });
        }

        // ============================================================
        //  ACTIVE USERS POLLER
        // ============================================================
        let activeUsersPoller = null;

        function startActiveUsersPoller() {
            if (activeUsersPoller) clearInterval(activeUsersPoller);
            activeUsersPoller = setInterval(() => {
                renderActiveUsers();
            }, 3000);
            renderActiveUsers();
        }

        // ============================================================
        //  SIDEBAR NAV FILTER
        // ============================================================
        document.querySelectorAll('#sidebar-nav button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#sidebar-nav button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderSidebar();
                const session = getSession();
                if (session) {
                    const db = getDB();
                    let channels = db.channels.filter(c => c.members.includes(session.userId));
                    if (currentFilter === 'dm') channels = channels.filter(c => c.type === 'dm');
                    else if (currentFilter === 'group') channels = channels.filter(c => c.type === 'group' || c.type ===
                        'text');
                    if (channels.length && !channels.find(c => c.id === currentChannelId)) {
                        switchChannel(channels[0].id);
                    } else if (!channels.length) {
                        currentChannelId = null;
                        document.getElementById('chat-title').textContent = 'Nenhum canal';
                        document.getElementById('member-count').textContent = '';
                        document.getElementById('message-area').innerHTML =
                            '<div style="color:#6666aa;text-align:center;padding:40px;">Selecione ou crie um canal</div>';
                    }
                }
            });
        });

        // ============================================================
        //  CRUD: CANAL, GRUPO, AMIGO, MEMBRO
        // ============================================================
        document.getElementById('create-channel-btn').addEventListener('click', () => {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '📌 Criar Canal';
            document.getElementById('modal-sub').textContent = 'Crie um novo canal para conversar em grupo.';
            document.getElementById('modal-body').innerHTML =
                `<div class="input-group"><label>Nome do canal</label><input id="new-channel-name" placeholder="Ex: jogos" /></div>`;
            document.getElementById('modal-confirm').textContent = 'Criar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('new-channel-name').value.trim();
                if (!name) { alert('Digite um nome.'); return; }
                const session = getSession();
                if (!session) return;
                const db = getDB();
                const channel = {
                    id: generateId(),
                    name,
                    type: 'group',
                    members: [session.userId],
                    adminId: session.userId,
                    createdAt: Date.now()
                };
                db.channels.push(channel);
                saveDB(db);
                modal.classList.remove('open');
                renderSidebar();
                switchChannel(channel.id);
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        });

        document.getElementById('create-group-btn').addEventListener('click', () => {
            const session = getSession();
            if (!session) return;
            const db = getDB();
            const users = db.users.filter(u => u.id !== session.userId);
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '👥 Criar Grupo';
            document.getElementById('modal-sub').textContent = 'Selecione os participantes.';
            let userList = users.map(u => `
                <div class="user-list-item">
                    <div class="avatar-small">${u.avatar || getInitials(u.username)}</div>
                    <span class="uname">${u.username}</span>
                    ${u.isAdmin ? '<span class="role-badge">ADMIN</span>' : ''}
                    <span style="margin-left:auto;"><input type="checkbox" class="group-member-check" data-id="${u.id}" /></span>
                </div>
            `).join('');
            if (!users.length) userList = '<div style="color:#6666aa;padding:12px;">Nenhum outro usuário.</div>';
            document.getElementById('modal-body').innerHTML = `
                <div class="input-group"><label>Nome do grupo</label><input id="group-name-input" placeholder="Ex: Amigos" /></div>
                <div style="max-height:200px;overflow-y:auto;background:#1a1a32;border-radius:8px;padding:4px;">${userList}</div>
            `;
            document.getElementById('modal-confirm').textContent = 'Criar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('group-name-input').value.trim() || 'Novo Grupo';
                const checks = document.querySelectorAll('.group-member-check:checked');
                const members = [session.userId];
                checks.forEach(c => members.push(c.dataset.id));
                if (members.length < 2) { alert('Selecione pelo menos uma pessoa.'); return; }
                const db = getDB();
                const channel = {
                    id: generateId(),
                    name,
                    type: 'group',
                    members,
                    adminId: session.userId,
                    createdAt: Date.now()
                };
                db.channels.push(channel);
                saveDB(db);
                modal.classList.remove('open');
                renderSidebar();
                switchChannel(channel.id);
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        });

        document.getElementById('add-friend-btn').addEventListener('click', () => {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '👤 Adicionar Amigo';
            document.getElementById('modal-sub').textContent = 'Digite o nick do usuário.';
            document.getElementById('modal-body').innerHTML =
                `<div class="input-group"><label>Nick</label><input id="friend-nick-input" placeholder="Ex: joao123" /></div>`;
            document.getElementById('modal-confirm').textContent = 'Adicionar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const nick = document.getElementById('friend-nick-input').value.trim();
                if (!nick) { alert('Digite um nick.'); return; }
                const session = getSession();
                if (!session) return;
                const target = getUserByUsername(nick);
                if (!target) { alert(`Usuário "${nick}" não encontrado.`); return; }
                if (target.id === session.userId) { alert('Não pode adicionar a si mesmo.'); return; }
                const db = getDB();
                const user = db.users.find(u => u.id === session.userId);
                if (!user) return;
                if (user.friends && user.friends.includes(target.id)) { alert('Já são amigos.'); return; }
                if (!user.friends) user.friends = [];
                user.friends.push(target.id);
                if (!target.friends) target.friends = [];
                if (!target.friends.includes(session.userId)) target.friends.push(session.userId);
                saveDB(db);
                modal.classList.remove('open');
                renderSidebar();
                if (currentChannelId) switchChannel(currentChannelId);
                else loadFirstChannel();
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        });

        document.getElementById('add-member-btn').addEventListener('click', () => {
            if (!currentChannelId) return;
            const session = getSession();
            if (!session || !isChannelAdmin(currentChannelId, session.userId)) {
                alert('Apenas o administrador do canal pode adicionar membros.');
                return;
            }
            const db = getDB();
            const ch = getChannel(currentChannelId);
            if (!ch) return;
            const users = db.users.filter(u => u.id !== session.userId && !ch.members.includes(u.id));
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '➕ Adicionar Membro';
            document.getElementById('modal-sub').textContent = `Adicione ao canal "${ch.name}".`;
            let userList = users.map(u => `
                <div class="user-list-item">
                    <div class="avatar-small">${u.avatar || getInitials(u.username)}</div>
                    <span class="uname">${u.username}</span>
                    ${u.isAdmin ? '<span class="role-badge">ADMIN</span>' : ''}
                    <span style="margin-left:auto;"><input type="checkbox" class="member-add-check" data-id="${u.id}" /></span>
                </div>
            `).join('');
            if (!users.length) userList = '<div style="color:#6666aa;padding:12px;">Todos já estão neste canal.</div>';
            document.getElementById('modal-body').innerHTML =
                `<div style="max-height:250px;overflow-y:auto;background:#1a1a32;border-radius:8px;padding:4px;">${userList}</div>`;
            document.getElementById('modal-confirm').textContent = 'Adicionar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const checks = document.querySelectorAll('.member-add-check:checked');
                const ids = [];
                checks.forEach(c => ids.push(c.dataset.id));
                if (!ids.length) { alert('Selecione pelo menos um usuário.'); return; }
                const db = getDB();
                const ch2 = db.channels.find(c => c.id === currentChannelId);
                if (!ch2) return;
                ids.forEach(id => { if (!ch2.members.includes(id)) ch2.members.push(id); });
                saveDB(db);
                modal.classList.remove('open');
                renderSidebar();
                updateChatHeader();
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        });

        // ============================================================
        //  EDIT / DELETE CHANNEL
        // ============================================================
        function openEditChannel(channelId) {
            const ch = getChannel(channelId);
            if (!ch) return;
            const session = getSession();
            if (!session || ch.adminId !== session.userId) { alert('Apenas o admin do canal pode editar.'); return; }
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '✏️ Editar Canal';
            document.getElementById('modal-sub').textContent = 'Altere o nome.';
            document.getElementById('modal-body').innerHTML =
                `<div class="input-group"><label>Novo nome</label><input id="edit-channel-name" value="${ch.name}" /></div>`;
            document.getElementById('modal-confirm').textContent = 'Salvar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('edit-channel-name').value.trim();
                if (!name) { alert('Digite um nome.'); return; }
                const db = getDB();
                const ch2 = db.channels.find(c => c.id === channelId);
                if (ch2) { ch2.name = name;
                    saveDB(db);
                    renderSidebar();
                    updateChatHeader(); }
                modal.classList.remove('open');
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        }

        function openDeleteChannel(channelId) {
            const ch = getChannel(channelId);
            if (!ch) return;
            const session = getSession();
            if (!session || ch.adminId !== session.userId) { alert('Apenas o admin pode excluir.'); return; }
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '⚠️ Excluir Canal';
            document.getElementById('modal-sub').textContent =
                `Tem certeza? "${ch.name}" será excluído com todas as mensagens.`;
            document.getElementById('modal-body').innerHTML = '';
            document.getElementById('modal-confirm').textContent = 'Excluir';
            document.getElementById('modal-confirm').className = 'btn-danger';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const db = getDB();
                db.channels = db.channels.filter(c => c.id !== channelId);
                db.messages = db.messages.filter(m => m.channelId !== channelId);
                saveDB(db);
                modal.classList.remove('open');
                if (currentChannelId === channelId) { currentChannelId = null;
                    loadFirstChannel(); } else { renderSidebar(); }
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        }

        // ============================================================
        //  GLOBAL ADMINS
        // ============================================================
        document.getElementById('manage-users-btn').addEventListener('click', () => {
            const session = getSession();
            if (!session || !isAdminGlobal(session.userId)) {
                alert('Apenas administradores globais podem gerenciar admins.');
                return;
            }
            const db = getDB();
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '👑 Admins Globais';
            document.getElementById('modal-sub').textContent = 'Defina administradores do sistema.';
            let userList = db.users.map(u => {
                const checked = u.isAdmin ? 'checked' : '';
                return `
                    <div class="user-list-item">
                        <div class="avatar-small">${u.avatar || getInitials(u.username)}</div>
                        <span class="uname">${u.username}</span>
                        <span style="margin-left:auto;">
                            <label style="font-size:12px;color:#8888aa;">
                                <input type="checkbox" class="admin-toggle" data-id="${u.id}" ${checked} /> Admin
                            </label>
                        </span>
                    </div>
                `;
            }).join('');
            document.getElementById('modal-body').innerHTML =
                `<div style="max-height:300px;overflow-y:auto;background:#1a1a32;border-radius:8px;padding:4px;">${userList}</div>`;
            document.getElementById('modal-confirm').textContent = 'Salvar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const db = getDB();
                document.querySelectorAll('.admin-toggle').forEach(t => {
                    const u = db.users.find(u => u.id === t.dataset.id);
                    if (u) u.isAdmin = t.checked;
                });
                saveDB(db);
                const updated = db.users.find(u => u.id === session.userId);
                if (updated) currentUser = updated;
                updateUserBadge();
                modal.classList.remove('open');
                renderSidebar();
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        });

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', initAuth);

        // ============================================================
        //  POLLING PARA MENSAGENS (simples)
        // ============================================================
        let lastMsgRender = 0;
        setInterval(() => {
            if (currentUser && currentChannelId) {
                const msgs = getMessages(currentChannelId);
                const last = msgs.length ? msgs[msgs.length - 1] : null;
                if (last && last.timestamp > lastMsgRender) {
                    renderMessages();
                    lastMsgRender = Date.now();
                }
                renderSidebar();
                updateChatHeader();
            }
        }, 3000);

        console.log('✅ Chat+Plus carregado com painel ATIVOS e convites!');
        console.log('👑 Admin: admin / admin123');
        console.log('📌 Convide usuários ativos para seus grupos com o botão "+ Grupo"');
    </script>
</body>
</html>
