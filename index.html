                        general: { name: 'geral', type: 'text', topic: 'Bem-vindo!', permissions: {} }
                    }
                };
                serverRef.set(serverData);
                db.ref('users/' + currentUser.id + '/servers/' + serverId).set(true);
                modal.classList.remove('open');
                loadServers();
                switchServer(serverId);
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        }

        document.getElementById('create-server-btn')?.addEventListener('click', createServer);

        // ============================================================
        //  CREATE CHANNEL
        // ============================================================
        document.getElementById('create-channel-btn').addEventListener('click', () => {
            if (!currentServerId) return;
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '📌 Criar Canal';
            document.getElementById('modal-sub').textContent = 'Crie um novo canal de texto.';
            document.getElementById('modal-body').innerHTML = `
                <div class="input-group"><label>Nome do canal</label><input id="new-channel-name" placeholder="Ex: jogos" /></div>
                <div class="input-group"><label>Tópico</label><input id="new-channel-topic" placeholder="Tópico do canal" /></div>
            `;
            document.getElementById('modal-confirm').textContent = 'Criar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('new-channel-name').value.trim() || 'novo-canal';
                const topic = document.getElementById('new-channel-topic').value.trim() || '';
                const channelsRef = db.ref('servers/' + currentServerId + '/channels');
                const newChRef = channelsRef.push();
                newChRef.set({
                    name,
                    type: 'text',
                    topic,
                    permissions: {}
                });
                modal.classList.remove('open');
                loadChannels(currentServerId);
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        });

        // ============================================================
        //  CHANNEL SETTINGS (permissions)
        // ============================================================
        document.getElementById('channel-settings-btn').addEventListener('click', () => {
            if (!currentChannelId) return;
            openChannelSettings(currentChannelId);
        });

        function openChannelSettings(channelId) {
            const ch = channelsCache[channelId];
            if (!ch) return;
            const server = serversCache[currentServerId];
            if (!server) return;
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = `⚙️ Configurações do #${ch.name}`;
            document.getElementById('modal-sub').textContent = 'Defina permissões por cargo para este canal.';
            let html = `<div class="input-group"><label>Nome</label><input id="channel-name-edit" value="${ch.name}" /></div>`;
            html += `<div class="input-group"><label>Tópico</label><input id="channel-topic-edit" value="${ch.topic || ''}" /></div>`;
            html += `<div style="margin-top:12px;"><label style="font-weight:600;text-transform:uppercase;font-size:12px;color:var(--text-secondary);">Permissões por cargo</label>`;
            for (const [roleId, role] of Object.entries(server.roles)) {
                const perms = ch.permissions?.[roleId] || {};
                const allow = perms.allow || {};
                const deny = perms.deny || {};
                html += `
                    <div class="role-item" style="margin-top:6px;">
                        <span class="role-color" style="background:${role.color || '#5865f2'}"></span>
                        <span class="role-name">${role.name}</span>
                        <span style="font-size:11px;color:var(--text-muted);">
                            <label><input type="checkbox" class="perm-allow" data-role="${roleId}" data-perm="sendMessages" ${allow.sendMessages ? 'checked' : ''} /> Enviar</label>
                            <label><input type="checkbox" class="perm-deny" data-role="${roleId}" data-perm="sendMessages" ${deny.sendMessages ? 'checked' : ''} /> Negar</label>
                            <label><input type="checkbox" class="perm-allow" data-role="${roleId}" data-perm="readMessages" ${allow.readMessages ? 'checked' : ''} /> Ler</label>
                            <label><input type="checkbox" class="perm-deny" data-role="${roleId}" data-perm="readMessages" ${deny.readMessages ? 'checked' : ''} /> Negar</label>
                        </span>
                    </div>
                `;
            }
            html += `</div>`;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-confirm').textContent = 'Salvar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('channel-name-edit').value.trim();
                const topic = document.getElementById('channel-topic-edit').value.trim();
                const updates = {};
                if (name) updates['channels/' + channelId + '/name'] = name;
                if (topic) updates['channels/' + channelId + '/topic'] = topic;
                // Permissões
                const allows = {};
                const denies = {};
                document.querySelectorAll('.perm-allow:checked').forEach(el => {
                    const role = el.dataset.role;
                    const perm = el.dataset.perm;
                    if (!allows[role]) allows[role] = {};
                    allows[role][perm] = true;
                });
                document.querySelectorAll('.perm-deny:checked').forEach(el => {
                    const role = el.dataset.role;
                    const perm = el.dataset.perm;
                    if (!denies[role]) denies[role] = {};
                    denies[role][perm] = true;
                });
                const permUpdates = {};
                for (const roleId of Object.keys(server.roles)) {
                    if (allows[roleId] || denies[roleId]) {
                        permUpdates[roleId] = { allow: allows[roleId] || {}, deny: denies[roleId] || {} };
                    }
                }
                if (Object.keys(permUpdates).length) {
                    updates['channels/' + channelId + '/permissions'] = permUpdates;
                }
                db.ref('servers/' + currentServerId).update(updates);
                modal.classList.remove('open');
                loadChannels(currentServerId);
                // Atualiza canal atual
                if (currentChannelId === channelId) {
                    const ch = channelsCache[channelId];
                    if (ch) {
                        document.getElementById('chat-title').textContent = '# ' + ch.name;
                        document.getElementById('chat-topic').textContent = ch.topic || '';
                    }
                }
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        }

        // ============================================================
        //  DELETE CHANNEL
        // ============================================================
        function deleteChannel(channelId) {
            if (!confirm('Tem certeza que deseja excluir este canal?')) return;
            db.ref('servers/' + currentServerId + '/channels/' + channelId).remove();
            db.ref('messages/' + currentServerId + '/' + channelId).remove();
            loadChannels(currentServerId);
            if (currentChannelId === channelId) {
                currentChannelId = null;
                document.getElementById('chat-title').textContent = 'Canal excluído';
                document.getElementById('message-area').innerHTML = '';
            }
        }

        // ============================================================
        //  SERVER SETTINGS (roles)
        // ============================================================
        document.getElementById('server-settings-btn').addEventListener('click', () => {
            if (!currentServerId) return;
            const server = serversCache[currentServerId];
            if (!server) return;
            if (server.ownerId !== currentUser.id) {
                alert('Apenas o dono do servidor pode gerenciar cargos.');
                return;
            }
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = `⚙️ Configurações do Servidor`;
            document.getElementById('modal-sub').textContent = 'Gerencie cargos e permissões.';
            let html = `<div class="input-group"><label>Nome do servidor</label><input id="server-name-edit" value="${server.name}" /></div>`;
            html += `<div class="input-group"><label>Ícone (emoji)</label><input id="server-icon-edit" value="${server.icon || '📁'}" maxlength="2" /></div>`;
            html += `<hr style="border-color:var(--border-color);margin:12px 0;" />`;
            html += `<label style="font-weight:600;text-transform:uppercase;font-size:12px;color:var(--text-secondary);">Cargos</label>`;
            for (const [roleId, role] of Object.entries(server.roles)) {
                html += `
                    <div class="role-item">
                        <span class="role-color" style="background:${role.color || '#5865f2'}"></span>
                        <span class="role-name">${role.name}</span>
                        <div class="role-actions">
                            <button class="role-edit-btn" data-role="${roleId}"><i class="fas fa-pen"></i></button>
                            ${roleId !== 'admin' && roleId !== 'member' ? `<button class="role-delete-btn" data-role="${roleId}"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </div>
                `;
            }
            html += `<button id="add-role-btn" style="margin-top:8px;padding:6px 12px;background:var(--bg-tertiary);border-radius:var(--radius);color:var(--text-secondary);"><i class="fas fa-plus"></i> Adicionar cargo</button>`;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-confirm').textContent = 'Salvar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Fechar';
            modal.classList.add('open');

            // Editar cargo
            document.querySelectorAll('.role-edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const roleId = btn.dataset.role;
                    const role = server.roles[roleId];
                    if (!role) return;
                    openRoleEditor(roleId, role);
                });
            });
            document.querySelectorAll('.role-delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const roleId = btn.dataset.role;
                    if (confirm(`Excluir cargo "${server.roles[roleId].name}"?`)) {
                        delete server.roles[roleId];
                        db.ref('servers/' + currentServerId + '/roles').set(server.roles);
                        modal.classList.remove('open');
                        openServerSettings();
                    }
                });
            });
            document.getElementById('add-role-btn')?.addEventListener('click', () => {
                const newRoleId = generateId();
                server.roles[newRoleId] = { name: 'Novo Cargo', color: '#5865f2', permissions: { sendMessages: true,
                        readMessages: true, manageChannels: false, manageRoles: false, kickMembers: false,
                        banMembers: false } };
                db.ref('servers/' + currentServerId + '/roles').set(server.roles);
                modal.classList.remove('open');
                openServerSettings();
            });

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('server-name-edit').value.trim();
                const icon = document.getElementById('server-icon-edit').value.trim();
                const updates = {};
                if (name) updates['name'] = name;
                if (icon) updates['icon'] = icon;
                db.ref('servers/' + currentServerId).update(updates);
                modal.classList.remove('open');
                loadServers();
                document.getElementById('server-name').textContent = name || 'Servidor';
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

            function openServerSettings() {
                document.getElementById('server-settings-btn').click();
            }
        });

        function openRoleEditor(roleId, role) {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = `✏️ Editar Cargo: ${role.name}`;
            document.getElementById('modal-sub').textContent = 'Defina permissões do cargo.';
            let html = `
                <div class="input-group"><label>Nome</label><input id="role-name-edit" value="${role.name}" /></div>
                <div class="input-group"><label>Cor (hex)</label><input id="role-color-edit" value="${role.color || '#5865f2'}" /></div>
                <div class="perm-grid">
                    ${Object.keys(role.permissions).map(perm => `
                        <div class="perm-item">
                            <input type="checkbox" class="perm-check" data-perm="${perm}" ${role.permissions[perm] ? 'checked' : ''} />
                            <span class="perm-label">${perm}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-confirm').textContent = 'Salvar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('role-name-edit').value.trim();
                const color = document.getElementById('role-color-edit').value.trim();
                const perms = {};
                document.querySelectorAll('.perm-check').forEach(el => {
                    perms[el.dataset.perm] = el.checked;
                });
                const updates = {};
                updates['roles/' + roleId + '/name'] = name;
                updates['roles/' + roleId + '/color'] = color;
                updates['roles/' + roleId + '/permissions'] = perms;
                db.ref('servers/' + currentServerId).update(updates);
                modal.classList.remove('open');
                // Reabre settings
                document.getElementById('server-settings-btn').click();
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        }

        // ============================================================
        //  PROFILE
        // ============================================================
        function openProfile(userId) {
            if (userId === currentUser.id) {
                // Abrir configurações do usuário
                openUserSettings();
                return;
            }
            db.ref('users/' + userId).once('value').then(snap => {
                const user = snap.val();
                if (!user) return;
                const modal = document.getElementById('modal-overlay');
                document.getElementById('modal-title').textContent = `👤 ${user.username}`;
                document.getElementById('modal-sub').textContent = user.bio || 'Sem biografia.';
                document.getElementById('modal-body').innerHTML = `
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                        <div style="width:48px;height:48px;border-radius:50%;background:#5865f2;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;">${user.avatar || getInitials(user.username)}</div>
                        <div>
                            <div style="font-weight:600;font-size:16px;">${user.username}</div>
                            <div style="font-size:13px;color:var(--text-secondary);">${user.status === 'online' ? '🟢 Online' : user.status === 'idle' ? '🟡 Ausente' : user.status === 'dnd' ? '🔴 Não perturbe' : '⚫ Invisível'}</div>
                        </div>
                    </div>
                    <div style="margin-bottom:12px;background:var(--bg-tertiary);padding:10px;border-radius:var(--radius);">
                        <div style="font-size:12px;color:var(--text-muted);">Entrou em ${formatDate(user.createdAt)}</div>
                    </div>
                    <button id="dm-profile-btn" style="width:100%;padding:8px;background:var(--accent);border-radius:var(--radius);color:#fff;font-weight:600;">💬 Mensagem privada</button>
                `;
                document.getElementById('modal-confirm').style.display = 'none';
                document.getElementById('modal-cancel').textContent = 'Fechar';
                modal.classList.add('open');

                document.getElementById('dm-profile-btn')?.addEventListener('click', () => {
                    modal.classList.remove('open');
                    startDM(userId);
                });

                document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
            });
        }

        // ============================================================
        //  USER SETTINGS
        // ============================================================
        function openUserSettings() {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '⚙️ Minhas Configurações';
            document.getElementById('modal-sub').textContent = 'Edite seu perfil e preferências.';
            document.getElementById('modal-body').innerHTML = `
                <div class="input-group"><label>Nome de usuário</label><input id="settings-username" value="${currentUser.username}" /></div>
                <div class="input-group"><label>Avatar (emoji)</label><input id="settings-avatar" value="${currentUser.avatar || getInitials(currentUser.username)}" maxlength="2" /></div>
                <div class="input-group"><label>Biografia</label><textarea id="settings-bio" rows="3">${currentUser.bio || ''}</textarea></div>
                <div class="input-group"><label>Som de notificação</label>
                    <select id="settings-sound">
                        <option value="true" ${currentUser.config?.sound !== false ? 'selected' : ''}>Ativado</option>
                        <option value="false" ${currentUser.config?.sound === false ? 'selected' : ''}>Desativado</option>
                    </select>
                </div>
            `;
            document.getElementById('modal-confirm').textContent = 'Salvar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const username = document.getElementById('settings-username').value.trim();
                const avatar = document.getElementById('settings-avatar').value.trim();
                const bio = document.getElementById('settings-bio').value.trim();
                const sound = document.getElementById('settings-sound').value === 'true';
                const updates = {};
                if (username) updates['username'] = username;
                if (avatar) updates['avatar'] = avatar;
                if (bio) updates['bio'] = bio;
                updates['config/sound'] = sound;
                db.ref('users/' + currentUser.id).update(updates);
                currentUser.username = username || currentUser.username;
                currentUser.avatar = avatar || currentUser.avatar;
                currentUser.bio = bio || currentUser.bio;
                if (!currentUser.config) currentUser.config = {};
                currentUser.config.sound = sound;
                updateUserBadge();
                modal.classList.remove('open');
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        }

        // ============================================================
        //  DM (Direct Message)
        // ============================================================
        function startDM(targetId) {
            if (targetId === currentUser.id) return;
            // Verifica se já existe DM
            db.ref('dms').orderByChild('members').once('value').then(snap => {
                let dmId = null;
                snap.forEach(child => {
                    const dm = child.val();
                    if (dm.members && dm.members.includes(currentUser.id) && dm.members.includes(targetId)) {
                        dmId = child.key;
                    }
                });
                if (!dmId) {
                    const newDmRef = db.ref('dms').push();
                    dmId = newDmRef.key;
                    newDmRef.set({
                        members: [currentUser.id, targetId],
                        createdAt: Date.now()
                    });
                }
                // Abrir DM
                openDM(dmId);
            });
        }

        function openDM(dmId) {
            currentDmId = dmId;
            currentChannelId = null;
            // Carrega mensagens da DM
            if (msgListener) { db.ref('dms/' + dmId + '/messages').off();
                msgListener = null; }
            msgListener = db.ref('dms/' + dmId + '/messages').on('value', snap => {
                const msgs = [];
                snap.forEach(child => {
                    const m = child.val();
                    m.id = child.key;
                    msgs.push(m);
                });
                renderMessages(msgs);
            });
            // Header
            db.ref('dms/' + dmId + '/members').once('value').then(snap => {
                const members = snap.val() || [];
                const otherId = members.find(id => id !== currentUser.id);
                db.ref('users/' + otherId).once('value').then(userSnap => {
                    const user = userSnap.val();
                    document.getElementById('chat-title').textContent = user ? user.username : 'DM';
                    document.getElementById('chat-topic').textContent = 'Mensagem privada';
                });
            });
            document.getElementById('dm-btn').style.display = 'flex';
            document.getElementById('dm-btn').onclick = () => {
                // Fechar DM e voltar para o servidor
                currentDmId = null;
                if (currentServerId) switchServer(currentServerId);
            };
            // Limpa selected channel
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        }

        document.getElementById('dm-btn').addEventListener('click', () => {
            if (currentDmId) {
                currentDmId = null;
                if (currentServerId) switchServer(currentServerId);
            }
        });

        // ============================================================
        //  INVITE TOAST
        // ============================================================
        let currentInviteId = null;

        function showInviteToast(invite) {
            if (currentInviteId === invite.id) return;
            currentInviteId = invite.id;
            db.ref('users/' + invite.inviterId).once('value').then(inviterSnap => {
                const inviter = inviterSnap.val();
                db.ref('servers/' + invite.serverId).once('value').then(serverSnap => {
                    const server = serverSnap.val();
                    const toast = document.getElementById('invite-toast');
                    document.getElementById('toast-title').textContent =
                        `📨 Convite de ${inviter ? inviter.username : 'alguém'}`;
                    document.getElementById('toast-body').textContent =
                        `${inviter ? inviter.username : 'alguém'} te convidou para o servidor "${server ? server.name : 'desconhecido'}". Aceitar?`;
                    toast.classList.add('show');

                    const acceptBtn = document.getElementById('toast-accept');
                    const rejectBtn = document.getElementById('toast-reject');
                    const newAccept = acceptBtn.cloneNode(true);
                    const newReject = rejectBtn.cloneNode(true);
                    acceptBtn.parentNode.replaceChild(newAccept, acceptBtn);
                    rejectBtn.parentNode.replaceChild(newReject, rejectBtn);

                    newAccept.addEventListener('click', () => {
                        // Adiciona membro ao servidor
                        db.ref('servers/' + invite.serverId + '/members/' + invite.targetId).set({ role: 'member' });
                        db.ref('users/' + invite.targetId + '/servers/' + invite.serverId).set(true);
                        db.ref('invites/' + invite.id + '/status').set('accepted');
                        toast.classList.remove('show');
                        currentInviteId = null;
                        playNotificationSound();
                        loadServers();
                        if (currentServerId) switchServer(currentServerId);
                    });

                    newReject.addEventListener('click', () => {
                        db.ref('invites/' + invite.id + '/status').set('rejected');
                        toast.classList.remove('show');
                        currentInviteId = null;
                    });
                });
            });
        }

        // ============================================================
        //  NOTIFICATION
        // ============================================================
        let notificationTimeout = null;

        function showNotification(title, body, time) {
            const toast = document.getElementById('notification-toast');
            document.getElementById('notif-title').textContent = title;
            document.getElementById('notif-body').textContent = body;
            document.getElementById('notif-time').textContent = time || 'Agora';
            toast.classList.add('show');
            if (notificationTimeout) clearTimeout(notificationTimeout);
            notificationTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        // ============================================================
        //  INVITE USER (do servidor)
        // ============================================================
        document.querySelector('.server-header')?.addEventListener('click', () => {
            if (!currentServerId) return;
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '📨 Convidar para o servidor';
            document.getElementById('modal-sub').textContent = 'Digite o nome do usuário para convidar.';
            document.getElementById('modal-body').innerHTML = `
                <div class="input-group"><label>Nome do usuário</label><input id="invite-username" placeholder="Ex: joao123" /></div>
            `;
            document.getElementById('modal-confirm').textContent = 'Convidar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const username = document.getElementById('invite-username').value.trim();
                if (!username) { alert('Digite um nome.'); return; }
                db.ref('users').orderByChild('username').equalTo(username).once('value').then(snap => {
                    if (!snap.exists()) { alert('Usuário não encontrado.'); return; }
                    let targetId = null;
                    snap.forEach(child => { targetId = child.key; });
                    if (targetId === currentUser.id) { alert('Você não pode convidar a si mesmo.'); return; }
                    // Verifica se já está no servidor
                    db.ref('servers/' + currentServerId + '/members/' + targetId).once('value').then(memberSnap => {
                        if (memberSnap.exists()) {
                            alert('Este usuário já está no servidor.');
                            return;
                        }
                        const invite = {
                            inviterId: currentUser.id,
                            targetId: targetId,
                            serverId: currentServerId,
                            status: 'pending',
                            timestamp: Date.now()
                        };
                        db.ref('invites').push(invite);
                        modal.classList.remove('open');
                        alert('Convite enviado!');
                    });
                });
            });
            document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
        });

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', initAuth);
        console.log('✅ Chat+Plus com servidores, cargos, permissões, DMs e perfis!');
    </script>
</body>
</html>
