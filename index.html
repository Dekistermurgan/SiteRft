<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat+Plus — Converse com Arquivos</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* ===== RESET & BASE STYLE DISCORD ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #1e1f22;
            color: #dbdee1;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #111214; }
        
        button { cursor: pointer; border: none; outline: none; background: none; color: inherit; font-family: inherit; }
        input, textarea, select {
            background: #1e1f22;
            border: 1px solid #313338;
            outline: none;
            color: #f2f3f5;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #5865f2;
        }
        input::placeholder, textarea::placeholder { color: #87898c; }

        /* ===== AUTH SCREEN DISCORD STYLE ===== */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2b2d31 0%, #111214 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        #auth-screen.hidden { opacity: 0; pointer-events: none; }
        .auth-box {
            background: #313338;
            border-radius: 12px;
            padding: 36px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .auth-box h1 {
            font-size: 24px;
            font-weight: 700;
            color: #f2f3f5;
            margin-bottom: 6px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .auth-box .subtitle { color: #b5bac1; text-align: center; font-size: 14px; margin-bottom: 24px; }
        .auth-box .input-group { margin-bottom: 18px; position: relative; }
        .auth-box .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #949ba4;
            font-size: 15px;
        }
        .auth-box .input-group input {
            padding-left: 42px;
            background: #1e1f22;
            border: 1px solid #2b2d31;
            border-radius: 4px;
            color: #f2f3f5;
        }
        .auth-box .btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            background: #5865f2;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 6px;
        }
        .auth-box .btn-primary:hover { background: #4752c4; }
        .auth-box .btn-primary:active { transform: scale(0.98); }
        .auth-box .auth-switch { text-align: left; margin-top: 16px; color: #949ba4; font-size: 13px; }
        .auth-box .auth-switch .auth-link { color: #00a8fc; cursor: pointer; font-weight: 500; margin-left: 4px; }
        .auth-box .auth-switch .auth-link:hover { text-decoration: underline; }
        .auth-box .error-msg { color: #fa7070; font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; font-weight: 500; }

        /* ===== APP LAYOUT ===== */
        #app { display: none; width: 100%; height: 100vh; background: #313338; overflow: hidden; }
        #app.active { display: flex; }

        /* ===== SIDEBAR (CANAL / NAVEGAÇÃO) ===== */
        .sidebar {
            width: 260px;
            min-width: 260px;
            background: #2b2d31;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1f2023;
            transition: 0.3s ease;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #1f2023;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: #2b2d31;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .sidebar-header .brand {
            font-size: 15px;
            font-weight: 700;
            color: #f2f3f5;
            letter-spacing: 0.3px;
        }
        .sidebar-header .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e1f22;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #f2f3f5;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .sidebar-header .user-badge:hover { border-color: #35363c; }
        .sidebar-header .user-badge .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar-header .user-badge .logout-btn { margin-left: 4px; color: #949ba4; font-size: 13px; transition: 0.2s; }
        .sidebar-header .user-badge .logout-btn:hover { color: #f23f43; }

        .sidebar-nav {
            padding: 10px;
            display: flex;
            gap: 6px;
            border-bottom: 1px solid #1f2023;
            flex-shrink: 0;
        }
        .sidebar-nav button {
            flex: 1;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background: transparent;
            color: #949ba4;
            transition: 0.2s;
            text-align: center;
        }
        .sidebar-nav button:hover { background: #35373c; color: #dbdee1; }
        .sidebar-nav button.active { background: #404249; color: #fff; }

        .sidebar-channels {
            flex: 1;
            overflow-y: auto;
            padding: 10px 8px;
        }
        .sidebar-channels .channel-group-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #949ba4;
            padding: 12px 8px 4px;
            font-weight: 700;
        }
        .sidebar-channels .channel-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.15s;
            color: #949ba4;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            position: relative;
        }
        .sidebar-channels .channel-item:hover { background: #35373c; color: #dbdee1; }
        .sidebar-channels .channel-item.active { background: #404249; color: #fff; }
        .sidebar-channels .channel-item i { width: 18px; text-align: center; font-size: 16px; color: #80848e; }
        .sidebar-channels .channel-item.active i { color: #fff; }
        .sidebar-channels .channel-item .channel-actions {
            display: none;
            gap: 4px;
            margin-left: auto;
        }
        .sidebar-channels .channel-item:hover .channel-actions { display: flex; }
        .sidebar-channels .channel-item .channel-actions button {
            color: #b5bac1;
            font-size: 12px;
            padding: 2px 4px;
            border-radius: 3px;
            transition: 0.2s;
        }
        .sidebar-channels .channel-item .channel-actions button:hover { color: #fff; background: #4e5058; }
        .sidebar-channels .channel-item .channel-actions button.danger:hover { color: #f23f43; background: #4e5058; }

        .sidebar-footer {
            padding: 10px;
            border-top: 1px solid #1f2023;
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            background: #2b2d31;
        }
        .sidebar-footer button {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 12px;
            background: #383a40;
            color: #dbdee1;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .sidebar-footer button:hover { background: #4e5058; color: #fff; }
        .sidebar-footer button.primary { background: #5865f2; color: #fff; }
        .sidebar-footer button.primary:hover { background: #4752c4; }
        .sidebar-footer .friend-btn { background: #23a55a; color: #fff; }
        .sidebar-footer .friend-btn:hover { background: #1a7f45; }

        /* ===== CHAT AREA DISCORD ===== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #313338;
            height: 100vh;
            overflow: hidden;
            min-width: 0;
        }

        .chat-header {
            padding: 12px 18px;
            border-bottom: 1px solid #1f2023;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: #313338;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .chat-header .chat-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .chat-header .chat-info h2 { font-size: 16px; font-weight: 600; color: #f2f3f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header .chat-info .member-count { font-size: 12px; color: #949ba4; white-space: nowrap; font-weight: 500; }
        
        .chat-header .chat-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
        .chat-header .chat-actions button {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            background: #2b2d31;
            color: #dbdee1;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header .chat-actions button:hover { background: #35373c; color: #fff; }
        .chat-header .chat-actions button.danger:hover { background: #da373c; color: #fff; }
        .chat-header .chat-actions button.success:hover { background: #23a55a; color: #fff; }
        .chat-header .toggle-users-btn {
            background: transparent !important;
            font-size: 18px !important;
            padding: 4px 8px !important;
            color: #b5bac1 !important;
        }
        .chat-header .toggle-users-btn:hover { color: #f2f3f5 !important; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-messages .msg-date-divider {
            text-align: center;
            font-size: 11px;
            color: #949ba4;
            padding: 12px 0 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
        }
        .chat-messages .msg-date-divider::before {
            content: "";
            position: absolute;
            left: 0; top: 50%;
            width: 100%; height: 1px;
            background: #3f4147;
            z-index: 1;
        }
        .chat-messages .msg-date-divider span {
            position: relative;
            z-index: 2;
            background: #313338;
            padding: 0 10px;
        }
        .chat-messages .message {
            display: flex;
            gap: 12px;
            padding: 6px 10px;
            border-radius: 4px;
            transition: background 0.15s;
            max-width: 100%;
            align-self: flex-start;
            width: 100%;
        }
        .chat-messages .message.own { background: rgba(88, 101, 242, 0.05); }
        .chat-messages .message:hover { background: #2e3035; }
        .chat-messages .message .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-messages .message .msg-content { flex: 1; min-width: 0; }
        .chat-messages .message .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 2px;
        }
        .chat-messages .message .msg-header .username { font-weight: 600; font-size: 14px; color: #f2f3f5; }
        .chat-messages .message .msg-header .timestamp { font-size: 11px; color: #949ba4; }
        .chat-messages .message .msg-header .badge-admin {
            font-size: 10px;
            background: #5865f2;
            color: #fff;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .chat-messages .message .msg-text { font-size: 14px; line-height: 1.4; word-wrap: break-word; color: #dbdee1; }
        .chat-messages .message .msg-files {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .chat-messages .message .msg-files .file-card {
            background: #2b2d31;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            border: 1px solid #1f2023;
            max-width: 280px;
            word-break: break-all;
        }
        .chat-messages .message .msg-files .file-card i { font-size: 18px; color: #5865f2; }
        .chat-messages .message .msg-files .file-card a { color: #00a8fc; text-decoration: none; font-weight: 500; }
        .chat-messages .message .msg-files .file-card a:hover { text-decoration: underline; }
        .chat-messages .message .msg-reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .chat-messages .message .msg-reactions .reaction {
            background: #2b2d31;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .chat-messages .message .msg-reactions .reaction:hover { border-color: #5865f2; background: #35373c; }
        .chat-messages .message .msg-reactions .reaction .count { font-size: 11px; color: #b5bac1; font-weight: 600; }

        /* INPUT AREA DISCORD STYLE */
        .chat-input-area {
            padding: 0 16px 20px;
            background: #313338;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-input-area .input-row { display: flex; align-items: center; gap: 8px; }
        .chat-input-area .input-row .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: #383a40;
            border-radius: 8px;
            padding: 0 12px;
            border: none;
            transition: 0.2s;
        }
        .chat-input-area .input-row .input-wrapper textarea {
            background: transparent;
            border: none;
            padding: 12px 0;
            resize: none;
            height: 44px;
            max-height: 120px;
            font-size: 14px;
            line-height: 1.4;
            flex: 1;
            color: #f2f3f5;
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn {
            color: #b5bac1;
            font-size: 20px;
            padding: 4px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn:hover { color: #f2f3f5; }
        .chat-input-area .input-row .input-wrapper .file-btn {
            color: #b5bac1;
            font-size: 18px;
            padding: 4px;
            transition: 0.2s;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
            margin-right: 6px;
        }
        .chat-input-area .input-row .input-wrapper .file-btn:hover { color: #f2f3f5; }
        .chat-input-area .input-row .input-wrapper .file-btn input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .chat-input-area .input-row .send-btn {
            background: #5865f2;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .chat-input-area .input-row .send-btn:hover { background: #4752c4; }
        .chat-input-area .file-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 0;
        }
        .chat-input-area .file-preview .file-tag {
            background: #2b2d31;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #1f2023;
        }
        .chat-input-area .file-preview .file-tag i { color: #5865f2; }
        .chat-input-area .file-preview .file-tag .remove { color: #f23f43; cursor: pointer; font-size: 13px; }

        /* ===== ACTIVE PANEL (MEMBROS ATIVOS) ===== */
        .active-panel {
            width: 240px;
            min-width: 240px;
            background: #2b2d31;
            border-left: 1px solid #1f2023;
            height: 100vh;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: 0.3s ease;
        }
        .active-panel.hidden-panel {
            display: none !important;
        }
        .active-panel .panel-header {
            padding: 16px;
            border-bottom: 1px solid #1f2023;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #949ba4;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .active-panel .panel-header .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #23a55a;
            display: inline-block;
        }
        .active-panel .panel-header .count-badge {
            background: #1e1f22;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #dbdee1;
            margin-left: auto;
        }
        .active-panel .panel-body { flex: 1; overflow-y: auto; padding: 12px 8px; }
        .active-panel .active-user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-radius: 4px;
            transition: 0.15s;
            margin-bottom: 2px;
            font-size: 14px;
        }
        .active-panel .active-user-item:hover { background: #35373c; }
        .active-panel .active-user-item .u-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
            position: relative;
        }
        .active-panel .active-user-item .u-name { flex: 1; font-weight: 500; color: #949ba4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .active-panel .active-user-item:hover .u-name { color: #f2f3f5; }
        .active-panel .active-user-item .u-status { font-size: 11px; color: #23a55a; display: flex; align-items: center; gap: 4px; }
        .active-panel .active-user-item .u-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #23a55a; display: inline-block; }
        .active-panel .active-user-item .invite-btn {
            background: #23a55a;
            color: #fff;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        .active-panel .active-user-item .invite-btn:hover { background: #1a7f45; }
        .active-panel .active-user-item .invite-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .active-panel .panel-empty { color: #949ba4; text-align: center; padding: 30px 10px; font-size: 13px; }
        .active-panel .panel-empty i { font-size: 32px; display: block; margin-bottom: 8px; color: #4e5058; }

        /* ===== EMOJI PICKER ===== */
        .emoji-picker-container { position: relative; display: inline-block; }
        .emoji-picker-container .emoji-picker-popup {
            position: absolute;
            bottom: 50px;
            right: 0;
            z-index: 999;
            background: #2b2d31;
            border-radius: 8px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.5);
            border: 1px solid #1f2023;
            padding: 6px;
            display: none;
            width: 280px;
            height: 340px;
            overflow-y: auto;
        }
        .emoji-picker-container .emoji-picker-popup.open { display: block; }

        /* ===== MODAIS ESTILO DISCORD ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(2px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #313338;
            border-radius: 8px;
            padding: 24px;
            max-width: 440px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .modal-box h2 { font-size: 20px; font-weight: 700; color: #f2f3f5; margin-bottom: 4px; }
        .modal-box .modal-sub { color: #949ba4; font-size: 13px; margin-bottom: 16px; }
        .modal-box .input-group { margin-bottom: 14px; }
        .modal-box .input-group label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: #b5bac1; margin-bottom: 6px; }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
            background: #2b2d31;
            padding: 12px 24px;
            margin: 20px -24px -24px -24px;
            border-radius: 0 0 8px 8px;
        }
        .modal-box .modal-actions button {
            padding: 8px 18px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
        }
        .modal-box .modal-actions .btn-cancel { background: transparent; color: #fff; }
        .modal-box .modal-actions .btn-cancel:hover { text-decoration: underline; }
        .modal-box .modal-actions .btn-confirm { background: #5865f2; color: #fff; }
        .modal-box .modal-actions .btn-confirm:hover { background: #4752c4; }
        .modal-box .modal-actions .btn-danger { background: #da373c; color: #fff; }
        .modal-box .modal-actions .btn-danger:hover { background: #a1282c; }
        .modal-box .modal-actions .btn-success { background: #23a55a; color: #fff; }
        .modal-box .modal-actions .btn-success:hover { background: #1a7f45; }

        .modal-box .user-list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 4px;
            background: #2b2d31;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .modal-box .user-list-item:hover { background: #35373c; }
        .modal-box .user-list-item .avatar-small {
            width: 28px; height: 28px; border-radius: 50%; background: #5865f2;
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: #fff;
        }
        .modal-box .user-list-item .uname { flex: 1; font-weight: 500; font-size: 14px; color: #f2f3f5; }
        .modal-box .user-list-item .role-badge { font-size: 10px; background: #5865f2; padding: 2px 6px; border-radius: 4px; color: #fff; font-weight: 600; }

        /* ===== INVITE TOAST ===== */
        .invite-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #2b2d31;
            border: 1px solid #5865f2;
            border-radius: 8px;
            padding: 16px 20px;
            max-width: 380px;
            width: 90%;
            z-index: 99999;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            display: none;
        }
        .invite-toast.show { display: block; }
        .invite-toast .toast-title { font-weight: 700; font-size: 15px; color: #f2f3f5; margin-bottom: 4px; }
        .invite-toast .toast-body { font-size: 13px; color: #dbdee1; margin-bottom: 12px; }
        .invite-toast .toast-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .invite-toast .toast-actions button { padding: 6px 14px; border-radius: 3px; font-weight: 600; font-size: 12px; transition: 0.2s; }
        .invite-toast .toast-actions .btn-accept { background: #23a55a; color: #fff; }
        .invite-toast .toast-actions .btn-accept:hover { background: #1a7f45; }
        .invite-toast .toast-actions .btn-reject { background: #da373c; color: #fff; }
        .invite-toast .toast-actions .btn-reject:hover { background: #a1282c; }

        /* ===== RESPONSIVE DISCORD ===== */
        @media (max-width: 992px) {
            .active-panel { width: 200px; min-width: 200px; }
            .sidebar { width: 220px; min-width: 220px; }
        }
        @media (max-width: 768px) {
            .active-panel {
                position: fixed;
                right: 0;
                top: 0;
                z-index: 999;
                box-shadow: -5px 0 20px rgba(0,0,0,0.5);
            }
            .sidebar { width: 200px; min-width: 200px; }
            .chat-header .chat-actions button span { display: none; }
        }
        @media (max-width: 576px) {
            .sidebar { width: 68px; min-width: 68px; }
            .sidebar .brand, .sidebar .channel-item span, .sidebar .channel-group-label, .sidebar .sidebar-footer button span, .sidebar .user-badge .username-text { display: none; }
            .sidebar .channel-item { justify-content: center; padding: 10px; }
            .sidebar .channel-item i { font-size: 20px; }
            .sidebar .sidebar-footer button { padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h1>💬 Chat+Plus</h1>
            <p class="subtitle">Converse, compartilhe arquivos e veja quem está ativo</p>
            <div id="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input id="auth-username" type="text" placeholder="Nome de usuário" />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input id="auth-password" type="password" placeholder="Senha" />
                </div>
                <button class="btn-primary" id="auth-btn">Entrar</button>
                <div class="auth-switch">
                    <span id="auth-switch-prefix">Não tem conta?</span>
                    <span class="auth-link" id="auth-toggle">Registrar</span>
                </div>
                <div class="error-msg" id="auth-error"></div>
            </div>
        </div>
    </div>

    <div id="app">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="brand">💬 Chat+Plus</span>
                <div class="user-badge" id="user-badge">
                    <div class="avatar" id="my-avatar">U</div>
                    <span class="username-text" id="my-username">Usuário</span>
                    <button class="logout-btn" id="logout-btn" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <div class="sidebar-nav" id="sidebar-nav">
                <button class="active" data-filter="all"><i class="fas fa-hashtag"></i> Todos</button>
                <button data-filter="dm"><i class="fas fa-user"></i> DMs</button>
                <button data-filter="group"><i class="fas fa-users"></i> Grupos</button>
            </div>
            <div class="sidebar-channels" id="channel-list"></div>
            <div class="sidebar-footer">
                <button id="create-channel-btn" class="primary"><i class="fas fa-plus-circle"></i> <span>Canal</span></button>
                <button id="create-group-btn"><i class="fas fa-user-plus"></i> <span>Grupo</span></button>
                <button id="add-friend-btn" class="friend-btn"><i class="fas fa-user-friends"></i> <span>Amigo</span></button>
            </div>
        </div>

        <div class="chat-main">
            <div class="chat-header">
                <div class="chat-info">
                    <h2 id="chat-title"># geral</h2>
                    <span class="member-count" id="member-count">0 membros</span>
                </div>
                <div class="chat-actions">
                    <button id="add-member-btn" class="success" title="Adicionar membro"><i class="fas fa-user-plus"></i> <span>Membro</span></button>
                    <button id="edit-channel-btn" title="Editar"><i class="fas fa-pen"></i> <span>Editar</span></button>
                    <button id="delete-channel-btn" class="danger" title="Excluir"><i class="fas fa-trash"></i> <span>Excluir</span></button>
                    <button id="manage-users-btn" title="Admins globais"><i class="fas fa-user-cog"></i> <span>Admins</span></button>
                    <button class="toggle-users-btn" id="toggle-active-panel-btn" title="Membros On-line"><i class="fas fa-users"></i></button>
                </div>
            </div>
            <div class="chat-messages" id="message-area"></div>
            <div class="chat-input-area" id="chat-input-area">
                <div class="file-preview" id="file-preview"></div>
                <div class="input-row">
                    <div class="input-wrapper">
                        <div class="file-btn" title="Anexar arquivo">
                            <i class="fas fa-paperclip"></i>
                            <input type="file" id="file-input" multiple />
                        </div>
                        <textarea id="message-input" rows="1" placeholder="Digite uma mensagem..."></textarea>
                        <button class="emoji-btn" id="emoji-toggle-btn"><i class="far fa-smile"></i></button>
                        <div class="emoji-picker-container">
                            <div class="emoji-picker-popup" id="emoji-picker-popup">
                                <emoji-picker></emoji-picker>
                            </div>
                        </div>
                    </div>
                    <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div class="active-panel" id="active-panel">
            <div class="panel-header">
                <span class="online-dot"></span>
                <span>On-line</span>
                <span class="count-badge" id="active-count">0</span>
            </div>
            <div class="panel-body" id="active-users-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="modal-box">
            <h2 id="modal-title">Título</h2>
            <div class="modal-sub" id="modal-sub">Subtítulo</div>
            <div id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modal-cancel">Cancelar</button>
                <button class="btn-confirm" id="modal-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <div class="invite-toast" id="invite-toast">
        <div class="toast-title" id="toast-title">Convite de Grupo</div>
        <div class="toast-body" id="toast-body">Você foi convidado para participar de um grupo.</div>
        <div class="toast-actions">
            <button class="btn-reject" id="toast-reject">Recusar</button>
            <button class="btn-accept" id="toast-accept">Aceitar</button>
        </div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>

    <script>
        // TOGGLE DO PAINEL LATERAL EM TELAS PEQUENAS OU POR PREFERÊNCIA DO USUÁRIO
        document.getElementById('toggle-active-panel-btn').addEventListener('click', () => {
            document.getElementById('active-panel').classList.toggle('hidden-panel');
        });
    </script>

    <script>
        // ============================================================
        //  CONFIGURAÇÃO DO FIREBASE (Coloque suas chaves reais aqui)
        // ============================================================
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // ============================================================
        //  ESTADO DA APLICAÇÃO
        // ============================================================
        let currentUser = null;
        let isRegistering = false;
        let activeChannelId = 'geral';
        let currentFilter = 'all';
        let pendingFiles = [];
        let activeUsersListener = null;

        // ============================================================
        //  AUTENTICAÇÃO LOCAL (COM FIREBASE SYNC)
        // ============================================================
        const authScreen = document.getElementById('auth-screen');
        const authUsernameInput = document.getElementById('auth-username');
        const authPasswordInput = document.getElementById('auth-password');
        const authBtn = document.getElementById('auth-btn');
        const authToggle = document.getElementById('auth-toggle');
        const authSwitchPrefix = document.getElementById('auth-switch-prefix');
        const authError = document.getElementById('auth-error');
        const app = document.getElementById('app');

        authToggle.addEventListener('click', () => {
            isRegistering = !isRegistering;
            authBtn.textContent = isRegistering ? 'Cadastrar' : 'Entrar';
            authSwitchPrefix.textContent = isRegistering ? 'Já tem uma conta?' : 'Não tem conta?';
            authToggle.textContent = isRegistering ? 'Entrar' : 'Registrar';
            authError.textContent = '';
        });

        authBtn.addEventListener('click', handleAuth);
        authPasswordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAuth(); });

        function handleAuth() {
            const username = authUsernameInput.value.trim();
            const password = authPasswordInput.value.trim();

            if (!username || !password) {
                authError.textContent = 'Preencha todos os campos!';
                return;
            }

            const userId = username.toLowerCase().replace(/[^a-z0-9_]/g, '');

            if (!userId) {
                authError.textContent = 'Nome de usuário inválido!';
                return;
            }

            const userRef = db.ref('users/' + userId);

            if (isRegistering) {
                userRef.once('value').then(snapshot => {
                    if (snapshot.exists()) {
                        authError.textContent = 'Este usuário já existe!';
                    } else {
                        db.ref('users').once('value').then(snapAll => {
                            const isFirstUser = !snapAll.exists();
                            const userData = {
                                id: userId,
                                username: username,
                                password: password,
                                isAdmin: isFirstUser,
                                friends: {},
                                createdAt: firebase.database.ServerValue.TIMESTAMP
                            };

                            userRef.set(userData).then(() => {
                                loginUser({ id: userId, username: username, isAdmin: isFirstUser });
                            });
                        });
                    }
                });
            } else {
                userRef.once('value').then(snapshot => {
                    if (!snapshot.exists()) {
                        authError.textContent = 'Usuário não encontrado!';
                    } else {
                        const userData = snapshot.val();
                        if (userData.password !== password) {
                            authError.textContent = 'Senha incorreta!';
                        } else {
                            loginUser({ id: userData.id, username: userData.username, isAdmin: !!userData.isAdmin });
                        }
                    }
                });
            }
        }

        function loginUser(user) {
            currentUser = user;
            localStorage.setItem('chat_plus_user', JSON.stringify(currentUser));

            authScreen.classList.add('hidden');
            app.classList.add('active');

            updateUserBadge();
            setupPresence();
            ensureDefaultChannel();
            loadChannels();
            listenForInvites();
            listenToActiveUsers();
        }

        function logoutUser() {
            if (currentUser) {
                db.ref('presence/' + currentUser.id).remove();
            }
            currentUser = null;
            localStorage.removeItem('chat_plus_user');
            app.classList.remove('active');
            authScreen.classList.remove('hidden');
            authUsernameInput.value = '';
            authPasswordInput.value = '';
            authError.textContent = '';
        }

        document.getElementById('logout-btn').addEventListener('click', logoutUser);

        function updateUserBadge() {
            if (!currentUser) return;
            document.getElementById('my-avatar').textContent = currentUser.username.charAt(0).toUpperCase();
            document.getElementById('my-username').textContent = currentUser.username + (currentUser.isAdmin ? ' 👑' : '');
        }

        function initAuth() {
            const saved = localStorage.getItem('chat_plus_user');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    db.ref('users/' + parsed.id).once('value').then(snap => {
                        if (snap.exists()) {
                            const u = snap.val();
                            loginUser({ id: u.id, username: u.username, isAdmin: !!u.isAdmin });
                        } else {
                            localStorage.removeItem('chat_plus_user');
                        }
                    });
                } catch(e) {
                    localStorage.removeItem('chat_plus_user');
                }
            }
        }

        // ============================================================
        //  PRESENÇA ON-LINE (REALTIME)
        // ============================================================
        function setupPresence() {
            if (!currentUser) return;
            const myPresenceRef = db.ref('presence/' + currentUser.id);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    myPresenceRef.onDisconnect().remove();
                    myPresenceRef.set({
                        username: currentUser.username,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            });
        }

        function listenToActiveUsers() {
            const activeListEl = document.getElementById('active-users-list');
            const activeCountEl = document.getElementById('active-count');

            db.ref('presence').on('value', (snapshot) => {
                activeListEl.innerHTML = '';
                const presenceData = snapshot.val() || {};
                const activeIds = Object.keys(presenceData);

                activeCountEl.textContent = activeIds.length;

                if (activeIds.length === 0) {
                    activeListEl.innerHTML = '<div class="panel-empty"><i class="fas fa-ghost"></i><br>Ninguém on-line</div>';
                    return;
                }

                activeIds.forEach(uid => {
                    const u = presenceData[uid];
                    const item = document.createElement('div');
                    item.className = 'active-user-item';

                    const isMe = currentUser && uid === currentUser.id;

                    item.innerHTML = `
                        <div class="u-avatar">${u.username.charAt(0).toUpperCase()}</div>
                        <span class="u-name" title="${u.username}">${u.username} ${isMe ? '(Você)' : ''}</span>
                        ${!isMe ? `<button class="invite-btn" data-uid="${uid}" data-uname="${u.username}">Convidar</button>` : ''}
                    `;

                    activeListEl.appendChild(item);
                });

                document.querySelectorAll('.active-user-item .invite-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const targetUid = e.target.dataset.uid;
                        const targetUname = e.target.dataset.uname;
                        openInviteToGroupModal(targetUid, targetUname);
                    });
                });
            });
        }

        // ============================================================
        //  CONVITES PARA GRUPOS / DMs
        // ============================================================
        function openInviteToGroupModal(targetUid, targetUname) {
            db.ref('channels').once('value').then(snap => {
                const channels = snap.val() || {};
                const myGroups = [];

                Object.keys(channels).forEach(cid => {
                    const c = channels[cid];
                    if (c.type === 'group' && c.members && c.members[currentUser.id]) {
                        myGroups.push({ id: cid, ...c });
                    }
                });

                const modal = document.getElementById('modal-overlay');
                document.getElementById('modal-title').textContent = `Convidar ${targetUname}`;
                document.getElementById('modal-sub').textContent = 'Selecione um grupo para enviar um convite:';

                const body = document.getElementById('modal-body');
                if (myGroups.length === 0) {
                    body.innerHTML = '<p style="color:#aaa; font-size:13px;">Você não participa de nenhum grupo. Crie um grupo primeiro!</p>';
                } else {
                    let html = '';
                    myGroups.forEach((g, idx) => {
                        html += `
                            <label class="group-select-item">
                                <input type="radio" name="group-choice" value="${g.id}" ${idx === 0 ? 'checked' : ''}>
                                <span>👥 ${g.name}</span>
                            </label>
                        `;
                    });
                    body.innerHTML = html;
                }

                modal.classList.add('open');

                const confirmBtn = document.getElementById('modal-confirm');
                const newConfirm = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

                newConfirm.addEventListener('click', () => {
                    const selected = document.querySelector('input[name="group-choice"]:checked');
                    if (selected) {
                        const groupId = selected.value;
                        sendGroupInvite(targetUid, groupId);
                        modal.classList.remove('open');
                    }
                });

                document.getElementById('modal-cancel').onclick = () => modal.classList.remove('open');
            });
        }

        function sendGroupInvite(targetUid, groupId) {
            db.ref('channels/' + groupId).once('value').then(snap => {
                if (!snap.exists()) return;
                const group = snap.val();

                const inviteRef = db.ref('invites/' + targetUid).push();
                inviteRef.set({
                    fromId: currentUser.id,
                    fromName: currentUser.username,
                    groupId: groupId,
                    groupName: group.name,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    alert('Convite enviado com sucesso!');
                });
            });
        }

        function listenForInvites() {
            if (!currentUser) return;
            const invitesRef = db.ref('invites/' + currentUser.id);

            invitesRef.on('child_added', snap => {
                const invite = snap.val();
                const inviteKey = snap.key;

                const toast = document.getElementById('invite-toast');
                document.getElementById('toast-title').textContent = `Convite de ${invite.fromName}`;
                document.getElementById('toast-body').textContent = `${invite.fromName} convidou você para o grupo "${invite.groupName}".`;

                toast.classList.add('show');

                document.getElementById('toast-accept').onclick = () => {
                    db.ref(`channels/${invite.groupId}/members/${currentUser.id}`).set(true).then(() => {
                        invitesRef.child(inviteKey).remove();
                        toast.classList.remove('show');
                        switchChannel(invite.groupId);
                    });
                };

                document.getElementById('toast-reject').onclick = () => {
                    invitesRef.child(inviteKey).remove();
                    toast.classList.remove('show');
                };
            });
        }

        // ============================================================
        //  CANAIS, DMs E GRUPOS
        // ============================================================
        function ensureDefaultChannel() {
            db.ref('channels/geral').once('value').then(snap => {
                if (!snap.exists()) {
                    db.ref('channels/geral').set({
                        name: 'geral',
                        type: 'public',
                        createdBy: 'system'
                    });
                }
            });
        }

        function loadChannels() {
            const channelListEl = document.getElementById('channel-list');

            db.ref('channels').on('value', snap => {
                channelListEl.innerHTML = '';
                const channels = snap.val() || {};

                let publicChannels = [];
                let groupChannels = [];
                let dmChannels = [];

                Object.keys(channels).forEach(cid => {
                    const c = { id: cid, ...channels[cid] };
                    if (c.type === 'public') {
                        publicChannels.push(c);
                    } else if (c.type === 'group') {
                        if (c.members && c.members[currentUser.id]) {
                            groupChannels.push(c);
                        }
                    } else if (c.type === 'dm') {
                        if (c.members && c.members[currentUser.id]) {
                            dmChannels.push(c);
                        }
                    }
                });

                if (currentFilter === 'all' || currentFilter === 'public') {
                    if (publicChannels.length > 0) {
                        appendChannelGroup(channelListEl, 'Canais Públicos', publicChannels);
                    }
                }
                if (currentFilter === 'all' || currentFilter === 'group') {
                    if (groupChannels.length > 0) {
                        appendChannelGroup(channelListEl, 'Grupos', groupChannels);
                    }
                }
                if (currentFilter === 'all' || currentFilter === 'dm') {
                    if (dmChannels.length > 0) {
                        appendChannelGroup(channelListEl, 'Mensagens Diretas', dmChannels);
                    }
                }

                switchChannel(activeChannelId);
            });
        }

        function appendChannelGroup(container, labelText, items) {
            const label = document.createElement('div');
            label.className = 'channel-group-label';
            label.textContent = labelText;
            container.appendChild(label);

            items.forEach(c => {
                const item = document.createElement('div');
                item.className = `channel-item ${c.id === activeChannelId ? 'active' : ''}`;
                item.dataset.id = c.id;

                let iconClass = 'fa-hashtag';
                let displayName = c.name;

                if (c.type === 'group') iconClass = 'fa-users';
                if (c.type === 'dm') {
                    iconClass = 'fa-user';
                    if (c.dmNames) {
                        const otherName = Object.values(c.dmNames).find(n => n !== currentUser.username);
                        if (otherName) displayName = otherName;
                    }
                }

                const canManage = currentUser.isAdmin || c.createdBy === currentUser.id;

                item.innerHTML = `
                    <i class="fas ${iconClass}"></i>
                    <span>${displayName}</span>
                    <div class="channel-actions">
                        ${canManage && c.id !== 'geral' ? `<button class="danger delete-c-btn" data-id="${c.id}" title="Excluir"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                `;

                item.addEventListener('click', (e) => {
                    if (e.target.closest('.channel-actions')) return;
                    switchChannel(c.id);
                });

                container.appendChild(item);
            });

            document.querySelectorAll('.delete-c-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    deleteChannel(btn.dataset.id);
                };
            });
        }

        function switchChannel(channelId) {
            activeChannelId = channelId;

            document.querySelectorAll('.channel-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === channelId);
            });

            db.ref('channels/' + channelId).once('value').then(snap => {
                if (!snap.exists()) {
                    if (channelId !== 'geral') switchChannel('geral');
                    return;
                }
                const c = snap.val();

                let titleText = '# ' + c.name;
                if (c.type === 'dm' && c.dmNames) {
                    const otherName = Object.values(c.dmNames).find(n => n !== currentUser.username);
                    if (otherName) titleText = '👤 ' + otherName;
                } else if (c.type === 'group') {
                    titleText = '👥 ' + c.name;
                }

                document.getElementById('chat-title').textContent = titleText;

                let memberCountText = 'Público';
                if (c.members) {
                    memberCountText = `${Object.keys(c.members).length} membros`;
                }
                document.getElementById('member-count').textContent = memberCountText;

                loadMessages(channelId);
            });
        }

        // Filtros da barra lateral
        document.querySelectorAll('#sidebar-nav button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#sidebar-nav button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                loadChannels();
            });
        });

        // ============================================================
        //  CRIAR CANAL, GRUPO E AMIGO
        // ============================================================
        document.getElementById('create-channel-btn').onclick = () => {
            openInputModal('Criar Canal Público', 'Nome do canal:', (name) => {
                if (!name) return;
                const cid = name.toLowerCase().replace(/[^a-z0-9_]/g, '');
                db.ref('channels/' + cid).set({
                    name: name,
                    type: 'public',
                    createdBy: currentUser.id
                }).then(() => switchChannel(cid));
            });
        };

        document.getElementById('create-group-btn').onclick = () => {
            openInputModal('Criar Grupo', 'Nome do grupo:', (name) => {
                if (!name) return;
                const gid = 'group_' + Date.now();
                const members = {};
                members[currentUser.id] = true;

                db.ref('channels/' + gid).set({
                    name: name,
                    type: 'group',
                    createdBy: currentUser.id,
                    members: members
                }).then(() => switchChannel(gid));
            });
        };

        document.getElementById('add-friend-btn').onclick = () => {
            openInputModal('Iniciar DM', 'Nome exato do usuário:', (targetUsername) => {
                if (!targetUsername) return;
                const targetUid = targetUsername.toLowerCase().replace(/[^a-z0-9_]/g, '');

                if (targetUid === currentUser.id) {
                    alert('Você não pode iniciar uma DM com você mesmo!');
                    return;
                }

                db.ref('users/' + targetUid).once('value').then(snap => {
                    if (!snap.exists()) {
                        alert('Usuário não encontrado!');
                        return;
                    }
                    const targetUser = snap.val();

                    const dmId = [currentUser.id, targetUid].sort().join('_dm_');

                    const members = {};
                    members[currentUser.id] = true;
                    members[targetUid] = true;

                    const dmNames = {};
                    dmNames[currentUser.id] = currentUser.username;
                    dmNames[targetUid] = targetUser.username;

                    db.ref('channels/' + dmId).set({
                        name: `DM: ${currentUser.username} & ${targetUser.username}`,
                        type: 'dm',
                        createdBy: currentUser.id,
                        members: members,
                        dmNames: dmNames
                    }).then(() => switchChannel(dmId));
                });
            });
        };

        function deleteChannel(cid) {
            if (cid === 'geral') return;
            if (confirm('Tem certeza que deseja excluir este canal?')) {
                db.ref('channels/' + cid).remove();
                db.ref('messages/' + cid).remove();
                switchChannel('geral');
            }
        }

        document.getElementById('delete-channel-btn').onclick = () => deleteChannel(activeChannelId);

        // ============================================================
        //  MENSAGENS & CHAT REALTIME
        // ============================================================
        let messagesListener = null;

        function loadMessages(channelId) {
            const messageArea = document.getElementById('message-area');
            messageArea.innerHTML = '';

            if (messagesListener) {
                db.ref('messages/' + activeChannelId).off('value', messagesListener);
            }

            messagesListener = db.ref('messages/' + channelId).on('value', snap => {
                messageArea.innerHTML = '';
                const msgs = snap.val() || {};

                let lastDateStr = '';

                Object.keys(msgs).forEach(msgId => {
                    const m = msgs[msgId];
                    const msgDate = new Date(m.timestamp || Date.now());
                    const dateStr = msgDate.toLocaleDateString('pt-BR');

                    if (dateStr !== lastDateStr) {
                        const divider = document.createElement('div');
                        divider.className = 'msg-date-divider';
                        divider.innerHTML = `<span>${dateStr}</span>`;
                        messageArea.appendChild(divider);
                        lastDateStr = dateStr;
                    }

                    renderSingleMessage(messageArea, msgId, m);
                });

                messageArea.scrollTop = messageArea.scrollHeight;
            });
        }

        function renderSingleMessage(container, msgId, m) {
            const isOwn = currentUser && m.userId === currentUser.id;
            const msgEl = document.createElement('div');
            msgEl.className = `message ${isOwn ? 'own' : ''}`;

            const timeStr = new Date(m.timestamp || Date.now()).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            let filesHtml = '';
            if (m.files && m.files.length > 0) {
                filesHtml = '<div class="msg-files">';
                m.files.forEach(f => {
                    filesHtml += `
                        <div class="file-card">
                            <i class="fas fa-file-alt"></i>
                            <a href="${f.url}" target="_blank" download="${f.name}">${f.name}</a>
                        </div>
                    `;
                });
                filesHtml += '</div>';
            }

            let reactionsHtml = '';
            if (m.reactions) {
                reactionsHtml = '<div class="msg-reactions">';
                Object.keys(m.reactions).forEach(emoji => {
                    const count = Object.keys(m.reactions[emoji]).length;
                    reactionsHtml += `
                        <div class="reaction" data-msgid="${msgId}" data-emoji="${emoji}">
                            <span>${emoji}</span>
                            <span class="count">${count}</span>
                        </div>
                    `;
                });
                reactionsHtml += '</div>';
            }

            msgEl.innerHTML = `
                <div class="msg-avatar">${(m.username || 'U').charAt(0).toUpperCase()}</div>
                <div class="msg-content">
                    <div class="msg-header">
                        <span class="username">${m.username || 'Usuário'}</span>
                        ${m.isAdmin ? '<span class="badge-admin">ADMIN</span>' : ''}
                        <span class="timestamp">${timeStr}</span>
                    </div>
                    <div class="msg-text">${escapeHtml(m.text)}</div>
                    ${filesHtml}
                    ${reactionsHtml}
                </div>
            `;

            container.appendChild(msgEl);

            msgEl.querySelectorAll('.reaction').forEach(rEl => {
                rEl.addEventListener('click', () => {
                    const emoji = rEl.dataset.emoji;
                    toggleReaction(msgId, emoji);
                });
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Envio de Mensagem
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        sendBtn.onclick = sendMessage;
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && pendingFiles.length === 0) return;

            const msgData = {
                userId: currentUser.id,
                username: currentUser.username,
                isAdmin: !!currentUser.isAdmin,
                text: text,
                files: pendingFiles,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            db.ref('messages/' + activeChannelId).push(msgData).then(() => {
                messageInput.value = '';
                pendingFiles = [];
                renderFilePreviews();
            });
        }

        // Reações
        function toggleReaction(msgId, emoji) {
            const reactionRef = db.ref(`messages/${activeChannelId}/${msgId}/reactions/${emoji}/${currentUser.id}`);
            reactionRef.once('value').then(snap => {
                if (snap.exists()) {
                    reactionRef.remove();
                } else {
                    reactionRef.set(true);
                }
            });
        }

        // ============================================================
        //  FILES UPLOAD (SIMULADO LOCAL/BASE64 VIA FIREBASE)
        // ============================================================
        const fileInput = document.getElementById('file-input');
        const filePreview = document.getElementById('file-preview');

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    pendingFiles.push({
                        name: file.name,
                        size: file.size,
                        url: event.target.result
                    });
                    renderFilePreviews();
                };
                reader.readAsDataURL(file);
            });
            fileInput.value = '';
        });

        function renderFilePreviews() {
            filePreview.innerHTML = '';
            pendingFiles.forEach((f, idx) => {
                const tag = document.createElement('div');
                tag.className = 'file-tag';
                tag.innerHTML = `
                    <i class="fas fa-file"></i>
                    <span>${f.name}</span>
                    <span class="remove" data-idx="${idx}">&times;</span>
                `;
                filePreview.appendChild(tag);
            });

            filePreview.querySelectorAll('.remove').forEach(rm => {
                rm.onclick = (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    pendingFiles.splice(idx, 1);
                    renderFilePreviews();
                };
            });
        }

        // ============================================================
        //  EMOJI PICKER
        // ============================================================
        const emojiBtn = document.getElementById('emoji-toggle-btn');
        const emojiPopup = document.getElementById('emoji-picker-popup');

        emojiBtn.onclick = () => emojiPopup.classList.toggle('open');

        document.querySelector('emoji-picker').addEventListener('emoji-click', event => {
            messageInput.value += event.detail.unicode;
            emojiPopup.classList.remove('open');
        });

        // ============================================================
        //  MODAIS UTILITÁRIOS (GERENCIAMENTO DE ADMINS / USERS)
        // ============================================================
        function openInputModal(title, label, onConfirm) {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-sub').textContent = '';

            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <div class="input-group">
                    <label>${label}</label>
                    <input type="text" id="modal-input-field" />
                </div>
            `;

            modal.classList.add('open');
            const inputField = document.getElementById('modal-input-field');
            inputField.focus();

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

            newConfirm.addEventListener('click', () => {
                const val = inputField.value.trim();
                onConfirm(val);
                modal.classList.remove('open');
            });

            document.getElementById('modal-cancel').onclick = () => modal.classList.remove('open');
        }

        document.getElementById('manage-users-btn').onclick = () => {
            if (!currentUser.isAdmin) {
                alert('Apenas administradores podem gerenciar outros usuários!');
                return;
            }

            db.ref('users').once('value').then(snap => {
                const users = snap.val() || {};
                const modal = document.getElementById('modal-overlay');
                document.getElementById('modal-title').textContent = 'Gerenciamento de Admins Globais';
                document.getElementById('modal-sub').textContent = 'Marque para dar permissão de Admin:';

                const body = document.getElementById('modal-body');
                let html = '';

                Object.keys(users).forEach(uid => {
                    const u = users[uid];
                    html += `
                        <div class="user-list-item">
                            <div class="avatar-small">${u.username.charAt(0).toUpperCase()}</div>
                            <span class="uname">${u.username}</span>
                            <input type="checkbox" class="admin-toggle" data-id="${uid}" ${u.isAdmin ? 'checked' : ''} />
                        </div>
                    `;
                });

                body.innerHTML = html;
                modal.classList.add('open');

                const confirmBtn = document.getElementById('modal-confirm');
                const newConfirm = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

                newConfirm.addEventListener('click', () => {
                    const toggles = document.querySelectorAll('.admin-toggle');
                    toggles.forEach(t => {
                        db.ref('users/' + t.dataset.id + '/isAdmin').set(t.checked);
                    });
                    modal.classList.remove('open');
                    db.ref('users/' + currentUser.id + '/isAdmin').once('value').then(snap => {
                        currentUser.isAdmin = snap.val();
                        updateUserBadge();
                    });
                });

                document.getElementById('modal-cancel').addEventListener('click', () => modal.classList.remove('open'));
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });
            });
        };

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', initAuth);

        console.log('✅ Chat+Plus com Firebase — agora coletivo!');
        console.log('🔑 Suas credenciais Firebase estão configuradas.');
    </script>
</body>
</html>
