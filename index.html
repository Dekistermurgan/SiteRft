<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat+Plus — Servidores e Permissões</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* ========== RESET & VARIÁVEIS ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
        }
        :root {
            --bg-primary: #313338;
            --bg-secondary: #2b2d31;
            --bg-tertiary: #1e1f22;
            --bg-input: #1e1f22;
            --text-primary: #dbdee1;
            --text-secondary: #949ba4;
            --text-muted: #5c5e66;
            --border-color: #1e1f22;
            --accent: #5865f2;
            --accent-hover: #4752c4;
            --green: #23a55a;
            --yellow: #faa81a;
            --red: #f23f42;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            --radius: 8px;
            --transition: 0.15s;
        }
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-tertiary); }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; }

        button { cursor: pointer; border: none; outline: none; background: none; color: inherit; }
        input, textarea {
            background: var(--bg-input);
            border: none;
            outline: none;
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: var(--radius);
            font-size: 14px;
            width: 100%;
        }
        input::placeholder, textarea::placeholder { color: var(--text-muted); }

        /* ========== AUTH ========== */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s;
        }
        #auth-screen.hidden { opacity: 0; pointer-events: none; }
        .auth-box {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        .auth-box h1 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 4px;
        }
        .auth-box h1 span { color: var(--accent); }
        .auth-box .subtitle { color: var(--text-secondary); text-align: center; font-size: 14px; margin-bottom: 28px; }
        .auth-box .input-group { margin-bottom: 16px; position: relative; }
        .auth-box .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }
        .auth-box .input-group input {
            padding-left: 44px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .auth-box .input-group input:focus { border-color: var(--accent); }
        .auth-box .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius);
            background: var(--accent);
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            transition: var(--transition);
            margin-top: 8px;
        }
        .auth-box .btn-primary:hover { background: var(--accent-hover); }
        .auth-box .auth-switch { text-align: center; margin-top: 18px; color: var(--text-secondary); font-size: 14px; }
        .auth-box .auth-switch .auth-link { color: #00a8fc; cursor: pointer; font-weight: 600; }
        .auth-box .auth-switch .auth-link:hover { text-decoration: underline; }
        .auth-box .error-msg { color: var(--red); font-size: 13px; text-align: center; margin-top: 10px; min-height: 20px; }

        /* ========== APP ========== */
        #app { display: none; width: 100%; height: 100vh; background: var(--bg-primary); overflow: hidden; }
        #app.active { display: flex; }

        /* ========== SERVER SIDEBAR (ÍCONES) ========== */
        .server-sidebar {
            width: 72px;
            min-width: 72px;
            background: var(--bg-tertiary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            overflow-y: auto;
            gap: 8px;
        }
        .server-sidebar .server-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            border: 2px solid transparent;
            flex-shrink: 0;
            text-transform: uppercase;
        }
        .server-sidebar .server-icon:hover {
            border-radius: 16px;
            background: var(--accent);
        }
        .server-sidebar .server-icon.active {
            border-radius: 16px;
            background: var(--accent);
        }
        .server-sidebar .server-icon .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .server-sidebar .server-icon .add-server {
            font-size: 28px;
            color: var(--text-secondary);
        }
        .server-sidebar .server-icon .add-server:hover {
            color: var(--green);
            background: transparent;
        }
        .server-sidebar .divider {
            width: 32px;
            height: 2px;
            background: var(--text-muted);
            border-radius: 2px;
        }

        /* ========== CHANNEL SIDEBAR ========== */
        .channel-sidebar {
            width: 240px;
            min-width: 240px;
            background: var(--bg-secondary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .channel-sidebar .server-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
        }
        .channel-sidebar .server-header:hover { background: var(--bg-tertiary); }
        .channel-sidebar .server-header i { font-size: 14px; color: var(--text-secondary); }

        .channel-sidebar .channel-search {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .channel-sidebar .channel-search input {
            background: var(--bg-input);
            border-radius: var(--radius);
            padding: 6px 12px;
            font-size: 13px;
            color: var(--text-primary);
            border: 1px solid transparent;
        }
        .channel-sidebar .channel-search input:focus { border-color: var(--accent); }

        .channel-sidebar .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
        }
        .channel-sidebar .channel-category {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            padding: 12px 6px 4px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .channel-sidebar .channel-category i { font-size: 10px; }
        .channel-sidebar .channel-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 1px;
        }
        .channel-sidebar .channel-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .channel-sidebar .channel-item.active { background: var(--bg-tertiary); color: #fff; }
        .channel-sidebar .channel-item i { width: 18px; text-align: center; font-size: 14px; }
        .channel-sidebar .channel-item .lock { color: var(--yellow); font-size: 12px; margin-left: 4px; }
        .channel-sidebar .channel-item .channel-actions {
            display: none;
            margin-left: auto;
            gap: 4px;
        }
        .channel-sidebar .channel-item:hover .channel-actions { display: flex; }
        .channel-sidebar .channel-item .channel-actions button {
            color: var(--text-muted);
            font-size: 11px;
            padding: 1px 4px;
            border-radius: 4px;
            transition: var(--transition);
        }
        .channel-sidebar .channel-item .channel-actions button:hover { color: #fff; background: var(--bg-tertiary); }

        .channel-sidebar .channel-footer {
            padding: 8px 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .channel-sidebar .channel-footer button {
            flex: 1;
            padding: 6px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 600;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .channel-sidebar .channel-footer button:hover { background: var(--bg-primary); color: #fff; }
        .channel-sidebar .channel-footer button.primary { background: var(--accent); color: #fff; }
        .channel-sidebar .channel-footer button.primary:hover { background: var(--accent-hover); }

        /* ========== MAIN CHAT ========== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100vh;
            overflow: hidden;
            min-width: 0;
        }
        .chat-header {
            padding: 10px 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: var(--bg-secondary);
        }
        .chat-header .chat-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        .chat-header .chat-info h2 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-header .chat-info .topic {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .chat-header .chat-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .chat-header .chat-actions button {
            padding: 4px 10px;
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 500;
            background: transparent;
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-header .chat-actions button:hover { background: var(--bg-tertiary); color: #fff; }
        .chat-header .chat-actions button.danger:hover { background: #3d1f22; color: var(--red); }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .chat-messages .msg-date {
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            padding: 10px 0 6px;
            border-top: 1px solid var(--border-color);
            margin-top: 6px;
        }
        .chat-messages .msg-date:first-child { border-top: none; margin-top: 0; }
        .chat-messages .message {
            display: flex;
            gap: 10px;
            padding: 4px 10px 4px 6px;
            border-radius: var(--radius);
            transition: var(--transition);
            max-width: 88%;
            align-self: flex-start;
        }
        .chat-messages .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
            background: var(--bg-tertiary);
        }
        .chat-messages .message:hover { background: var(--bg-secondary); }
        .chat-messages .message .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            color: #fff;
            flex-shrink: 0;
            cursor: pointer;
        }
        .chat-messages .message .msg-content { flex: 1; min-width: 0; }
        .chat-messages .message .msg-header {
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
        }
        .chat-messages .message .msg-header .username {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
        }
        .chat-messages .message .msg-header .timestamp { font-size: 10px; color: var(--text-muted); }
        .chat-messages .message .msg-header .role-badge {
            font-size: 9px;
            background: var(--accent);
            color: #fff;
            padding: 0 6px;
            border-radius: 30px;
            font-weight: 600;
        }
        .chat-messages .message .msg-text {
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            margin-top: 1px;
            color: var(--text-primary);
        }
        .chat-messages .message .msg-text .mention {
            color: #00a8fc;
            background: #1e3d5a;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: 500;
        }
        .chat-messages .message .msg-files {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .chat-messages .message .msg-files .file-card {
            background: var(--bg-tertiary);
            border-radius: var(--radius);
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            border: 1px solid var(--border-color);
            max-width: 200px;
            word-break: break-all;
        }
        .chat-messages .message .msg-files .file-card i { font-size: 16px; color: var(--accent); }
        .chat-messages .message .msg-files .file-card a { color: #00a8fc; text-decoration: none; font-weight: 500; }
        .chat-messages .message .msg-files .file-card a:hover { text-decoration: underline; }
        .chat-messages .message .msg-reactions {
            display: flex;
            gap: 3px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .chat-messages .message .msg-reactions .reaction {
            background: var(--bg-tertiary);
            border-radius: 30px;
            padding: 0 8px 0 4px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .chat-messages .message .msg-reactions .reaction:hover {
            border-color: var(--accent);
            background: var(--bg-secondary);
        }
        .chat-messages .message .msg-reactions .reaction .count { font-size: 11px; color: var(--text-secondary); }

        .chat-input-area {
            padding: 8px 16px 12px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-input-area .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .chat-input-area .input-row .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: var(--radius);
            padding: 0 10px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .chat-input-area .input-row .input-wrapper:focus-within { border-color: var(--accent); }
        .chat-input-area .input-row .input-wrapper textarea {
            background: transparent;
            border: none;
            padding: 8px 0;
            resize: none;
            height: 38px;
            max-height: 100px;
            font-size: 14px;
            line-height: 1.4;
            flex: 1;
            color: var(--text-primary);
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn {
            color: var(--text-muted);
            font-size: 18px;
            padding: 4px 2px 4px 6px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn:hover { color: #fff; }
        .chat-input-area .input-row .input-wrapper .file-btn {
            color: var(--text-muted);
            font-size: 16px;
            padding: 4px 2px;
            transition: var(--transition);
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
        }
        .chat-input-area .input-row .input-wrapper .file-btn:hover { color: #fff; }
        .chat-input-area .input-row .input-wrapper .file-btn input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .chat-input-area .input-row .send-btn {
            background: var(--accent);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: var(--radius);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .chat-input-area .input-row .send-btn:hover { background: var(--accent-hover); }
        .chat-input-area .file-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 2px 0;
        }
        .chat-input-area .file-preview .file-tag {
            background: var(--bg-tertiary);
            border-radius: 4px;
            padding: 2px 10px 2px 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid var(--border-color);
        }
        .chat-input-area .file-preview .file-tag i { color: var(--accent); }
        .chat-input-area .file-preview .file-tag .remove { color: var(--red); cursor: pointer; font-size: 13px; }
        .chat-input-area .file-error { color: var(--red); font-size: 12px; padding: 2px 0; display: none; }

        /* ========== RIGHT PANEL (MEMBROS) ========== */
        .members-panel {
            width: 220px;
            min-width: 220px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .members-panel .panel-header {
            padding: 12px 14px 8px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .members-panel .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }
        .members-panel .member-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            border-radius: var(--radius);
            transition: var(--transition);
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
        }
        .members-panel .member-item:hover { background: var(--bg-tertiary); }
        .members-panel .member-item .avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
            position: relative;
        }
        .members-panel .member-item .avatar-small .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
        }
        .members-panel .member-item .avatar-small .status-dot.online { background: var(--green); }
        .members-panel .member-item .avatar-small .status-dot.idle { background: var(--yellow); }
        .members-panel .member-item .avatar-small .status-dot.dnd { background: var(--red); }
        .members-panel .member-item .avatar-small .status-dot.invisible { background: var(--text-muted); }
        .members-panel .member-item .member-name { flex: 1; font-weight: 500; }
        .members-panel .member-item .role-tag {
            font-size: 10px;
            background: var(--bg-tertiary);
            padding: 0 8px;
            border-radius: 30px;
            color: var(--text-secondary);
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 28px 30px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .modal-box h2 { font-size: 20px; color: #fff; margin-bottom: 2px; }
        .modal-box .modal-sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 16px; }
        .modal-box .input-group { margin-bottom: 12px; }
        .modal-box .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .modal-box .input-group input,
        .modal-box .input-group select,
        .modal-box .input-group textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 8px 12px;
            color: var(--text-primary);
            width: 100%;
            font-size: 13px;
        }
        .modal-box .input-group input:focus,
        .modal-box .input-group select:focus,
        .modal-box .input-group textarea:focus {
            border-color: var(--accent);
        }
        .modal-box .input-group textarea { resize: vertical; min-height: 60px; }

            display: flex;

        }
        .modal-box .perm-grid .perm-item .perm-label { flex: 1; }

        /* ========== TOASTS ========== */
        .invite-toast, .notification-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;

            background: var(--bg-secondary);

            padding: 16px 24px;

            animation: slideUp 0.3s ease-out;
        }
        .invite-toast.show, .notification-toast.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .invite-toast .toast-title,
        .notification-toast .notif-title {
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            margin-bottom: 2px;
        }
        .invite-toast .toast-body,
        .notification-toast .notif-body {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .invite-toast .toast-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .invite-toast .toast-actions button {
            padding: 6px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 13px;
            transition: var(--transition);
        }
        .invite-toast .toast-actions .btn-accept {
            background: var(--green);
            color: #fff;
        }
        .invite-toast .toast-actions .btn-accept:hover { background: #1d8b4a; }
        .invite-toast .toast-actions .btn-reject {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        .invite-toast .toast-actions .btn-reject:hover { background: var(--bg-primary); }
        .notification-toast {
            bottom: auto;
            top: 20px;
            right: 20px;
            left: auto;
            transform: none;
            border-left: 4px solid var(--accent);
            max-width: 360px;
        }
        .notification-toast .notif-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 992px) {
            .members-panel { width: 180px; min-width: 180px; }
            .channel-sidebar { width: 200px; min-width: 200px; }
        }
        @media (max-width: 768px) {
            .members-panel { width: 160px; min-width: 160px; }
            .channel-sidebar { width: 160px; min-width: 160px; }
            .chat-header .chat-actions button span { display: none; }
            .chat-messages .message { max-width: 95%; }
            .server-sidebar { width: 56px; min-width: 56px; }
            .server-sidebar .server-icon { width: 40px; height: 40px; font-size: 14px; }
        }
        @media (max-width: 576px) {
            .members-panel { display: none; }
            .channel-sidebar { width: 60px; min-width: 60px; }
            .channel-sidebar .server-header span,
            .channel-sidebar .channel-item span,
            .channel-sidebar .channel-category span,
            .channel-sidebar .channel-footer button span,
            .channel-sidebar .channel-search input { display: none; }
            .channel-sidebar .channel-item { justify-content: center; padding: 8px; }
            .channel-sidebar .channel-item i { font-size: 18px; }
            .channel-sidebar .channel-footer button { padding: 8px; font-size: 14px; }
            .channel-sidebar .channel-footer button span { display: none; }
            .server-sidebar { width: 48px; min-width: 48px; }

            .chat-header .chat-actions button span { display: none; }
            .chat-messages .message .msg-header .username { font-size: 12px; }
            .chat-input-area .input-row .input-wrapper textarea { font-size: 13px; height: 34px; }
        }
    </style>
</head>
<body>

    <!-- ===== AUTH ===== -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>Chat<span>+Plus</span></h1>
            <p class="subtitle">Servidores, cargos e permissões</p>
            <div id="auth-form">
                <div class="input-group"><i class="fas fa-user"></i><input id="auth-username" type="text" placeholder="Nome de usuário" /></div>
                <div class="input-group"><i class="fas fa-lock"></i><input id="auth-password" type="password" placeholder="Senha" /></div>
                <button class="btn-primary" id="auth-btn">Entrar</button>
                <div class="auth-switch">
                    <span id="auth-switch-prefix">Não tem conta?</span>
                    <span class="auth-link" id="auth-toggle">Registrar</span>
                </div>
                <div class="error-msg" id="auth-error"></div>
            </div>
        </div>
    </div>

    <!-- ===== APP ===== -->
    <div id="app">
        <!-- SERVER SIDEBAR -->
        <div class="server-sidebar" id="server-sidebar"></div>

        <!-- CHANNEL SIDEBAR -->
        <div class="channel-sidebar" id="channel-sidebar">
            <div class="server-header" id="server-header">
                <span id="server-name">Servidor</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="channel-search"><input id="channel-search" placeholder="Buscar canais..." /></div>
            <div class="channels-list" id="channels-list"></div>
            <div class="channel-footer">
                <button id="create-channel-btn" class="primary"><i class="fas fa-plus-circle"></i> <span>Canal</span></button>
                <button id="server-settings-btn"><i class="fas fa-cog"></i> <span>Servidor</span></button>
            </div>
        </div>

        <!-- MAIN CHAT -->
        <div class="chat-main">
            <div class="chat-header">
                <div class="chat-info">
                    <h2 id="chat-title"># geral</h2>
                    <span class="topic" id="chat-topic">Tópico do canal</span>
                </div>
                <div class="chat-actions">
                    <button id="channel-settings-btn" title="Configurações do canal"><i class="fas fa-cog"></i> <span>Canal</span></button>
                    <button id="dm-btn" title="DM com este usuário"><i class="fas fa-envelope"></i> <span>DM</span></button>
                </div>
            </div>
            <div class="chat-messages" id="message-area"></div>
            <div class="chat-input-area">
                <div class="file-preview" id="file-preview"></div>
                <div class="file-error" id="file-error"></div>
                <div class="input-row">
                    <div class="input-wrapper">
                        <textarea id="message-input" rows="1" placeholder="Digite uma mensagem..."></textarea>
                        <button class="emoji-btn" id="emoji-toggle-btn"><i class="far fa-smile"></i></button>
                        <div class="emoji-picker-container">
                            <div class="emoji-picker-popup" id="emoji-picker-popup">
                                <emoji-picker id="emoji-picker"></emoji-picker>
                            </div>
                        </div>
                        <label class="file-btn">
                            <i class="fas fa-paperclip"></i>
                            <input type="file" id="file-input" multiple />
                        </label>
                    </div>
                    <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- MEMBERS PANEL -->
        <div class="members-panel" id="members-panel">
            <div class="panel-header">👥 Membros</div>
            <div class="panel-body" id="members-list"></div>
        </div>
    </div>

    <!-- ===== STATUS POPUP ===== -->
    <div class="status-popup" id="status-popup" style="display:none;position:fixed;bottom:70px;left:10px;background:var(--bg-secondary);border-radius:var(--radius);border:1px solid var(--border-color);box-shadow:var(--shadow);padding:6px;z-index:100;min-width:140px;">
        <div class="status-option" data-status="online" style="display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:4px;cursor:pointer;transition:var(--transition);color:var(--text-primary);">
            <span class="dot online" style="width:10px;height:10px;border-radius:50%;background:var(--green);"></span> Online
            <span class="check" style="margin-left:auto;color:var(--accent);display:none;"><i class="fas fa-check"></i></span>
        </div>
        <div class="status-option" data-status="idle" style="display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:4px;cursor:pointer;transition:var(--transition);color:var(--text-primary);">
            <span class="dot idle" style="width:10px;height:10px;border-radius:50%;background:var(--yellow);"></span> Ausente
            <span class="check" style="margin-left:auto;color:var(--accent);display:none;"><i class="fas fa-check"></i></span>
        </div>
        <div class="status-option" data-status="dnd" style="display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:4px;cursor:pointer;transition:var(--transition);color:var(--text-primary);">
            <span class="dot dnd" style="width:10px;height:10px;border-radius:50%;background:var(--red);"></span> Não perturbe
            <span class="check" style="margin-left:auto;color:var(--accent);display:none;"><i class="fas fa-check"></i></span>
        </div>
        <div class="status-option" data-status="invisible" style="display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:4px;cursor:pointer;transition:var(--transition);color:var(--text-primary);">
            <span class="dot invisible" style="width:10px;height:10px;border-radius:50%;background:var(--text-muted);"></span> Invisível
            <span class="check" style="margin-left:auto;color:var(--accent);display:none;"><i class="fas fa-check"></i></span>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="modal-box">
            <h2 id="modal-title">Título</h2>
            <p class="modal-sub" id="modal-sub">Subtítulo</p>
            <div id="modal-body"></div>
            <div class="modal-actions" id="modal-actions">
                <button class="btn-cancel" id="modal-cancel">Cancelar</button>
                <button class="btn-confirm" id="modal-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- ===== TOASTS ===== -->
    <div class="invite-toast" id="invite-toast">
        <div class="toast-title" id="toast-title">📨 Convite recebido</div>
        <div class="toast-body" id="toast-body">Você foi convidado para entrar em um servidor.</div>
        <div class="toast-actions">
            <button class="btn-reject" id="toast-reject">Recusar</button>
            <button class="btn-accept" id="toast-accept">Aceitar</button>
        </div>
    </div>

    <div class="notification-toast" id="notification-toast">
        <div class="notif-title" id="notif-title">🔔 Nova mensagem</div>
        <div class="notif-body" id="notif-body">Conteúdo da mensagem</div>
        <div class="notif-time" id="notif-time">Agora</div>
    </div>

    <script>
        // ============================================================
        //  FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBITkgiiBiGPM-hCQ8SW4Tbz5_rT-ORhkk",
            authDomain: "rift-f1195.firebaseapp.com",
            databaseURL: "https://rift-f1195-default-rtdb.firebaseio.com",
            projectId: "rift-f1195",
            storageBucket: "rift-f1195.firebasestorage.app",
            messagingSenderId: "768285657957",
            appId: "1:768285657957:web:6a355d9c0e07cab53faf8c",
            measurementId: "G-P1XFNGY6LC"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================================
        //  HELPERS
        // ============================================================
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

        function formatTime(ts) { return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

        function formatDate(ts) { return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }); }

        function getInitials(name) { return name.charAt(0).toUpperCase(); }

        // ============================================================
        //  AUDIO
        // ============================================================
        let audioCtx = null;

        function playNotificationSound() {
            try {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 800;
                osc.type = 'sine';
                gain.gain.value = 0.12;
                osc.start();
                setTimeout(() => { osc.frequency.value = 1000;
                    setTimeout(() => { osc.stop(); }, 100); }, 100);
            } catch (e) {}
        }

        // ============================================================
        //  STATE
        // ============================================================
        let currentUser = null;
        let isLoginMode = true;
        let currentServerId = null;
        let currentChannelId = null;
        let currentDmId = null; // se estiver em DM
        let currentFilter = 'all';
        let pendingFiles = [];
        let inviteCooldowns = {};
        let userStatus = 'online';
        let serversCache = {};
        let channelsCache = {};
        let messagesCache = {};
        let membersCache = {};
        let rolesCache = {};
        let dmChannels = {}; // { userId: dmId }

        // ============================================================
        //  AUTH
        // ============================================================
        function initAuth() {
            const session = sessionStorage.getItem('chatplus_session');
            if (session) {
                const data = JSON.parse(session);
                db.ref('users/' + data.userId).once('value').then(snap => {
                    if (snap.exists()) {
                        currentUser = { id: data.userId, ...snap.val() };
                        showApp();
                    } else {
                        sessionStorage.removeItem('chatplus_session');
                        showAuth();
                    }
                });
            } else {
                showAuth();
            }
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app').classList.remove('active');
            document.getElementById('app').style.display = 'none';
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app').style.display = 'flex';
            document.getElementById('app').classList.add('active');
            updateUserBadge();
            startListeners();
            loadServers();
            // Status
            if (currentUser) {
                db.ref('users/' + currentUser.id + '/online').set(true);
                db.ref('users/' + currentUser.id + '/status').set(userStatus);
                db.ref('users/' + currentUser.id + '/lastSeen').set(Date.now());
                db.ref('users/' + currentUser.id + '/online').onDisconnect().set(false);
                db.ref('users/' + currentUser.id + '/lastSeen').onDisconnect().set(Date.now());
            }
        }

        document.getElementById('auth-toggle').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-btn').textContent = isLoginMode ? 'Entrar' : 'Registrar';
            document.getElementById('auth-switch-prefix').textContent = isLoginMode ? 'Não tem conta?' : 'Já tem conta?';
            document.getElementById('auth-toggle').textContent = isLoginMode ? 'Registrar' : 'Entrar';
            document.getElementById('auth-error').textContent = '';
        });

        document.getElementById('auth-btn').addEventListener('click', handleAuth);
        document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
        document.getElementById('auth-username').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });

        function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorEl = document.getElementById('auth-error');
            if (!username || !password) { errorEl.textContent = 'Preencha todos os campos.'; return; }

            if (isLoginMode) {
                db.ref('users').orderByChild('username').equalTo(username).once('value').then(snap => {
                    if (!snap.exists()) { errorEl.textContent = 'Usuário não encontrado.'; return; }
                    let userData = null,
                        userId = null;
                    snap.forEach(child => { userData = child.val();
                        userId = child.key; });
                    if (userData.password !== password) { errorEl.textContent = 'Senha incorreta.'; return; }
                    currentUser = { id: userId, ...userData };
                    sessionStorage.setItem('chatplus_session', JSON.stringify({ userId }));
                    showApp();
                    errorEl.textContent = '';
                });
            } else {
                db.ref('users').orderByChild('username').equalTo(username).once('value').then(snap => {
                    if (snap.exists()) { errorEl.textContent = 'Nome já existe.'; return; }
                    db.ref('users').once('value').then(allUsers => {
                        const newUser = {
                            username,
                            password,
                            isAdmin: false,
                            friends: {},
                            bio: '',
                            avatar: getInitials(username),
                            createdAt: Date.now(),
                            online: true,
                            status: 'online',
                            config: { theme: 'dark', sound: true },
                            servers: {}
                        };
                        const newId = db.ref('users').push(newUser).key;
                        // Cria um servidor padrão para o usuário
                        const serverRef = db.ref('servers').push();
                        const serverId = serverRef.key;
                        const serverData = {
                            name: 'Meu Servidor',
                            icon: '📁',
                            ownerId: newId,
                            createdAt: Date.now(),
                            members: { [newId]: { role: 'admin' } },
                            roles: {
                                admin: { name: 'Admin', color: '#f23f42', permissions: { sendMessages: true,
                                        readMessages: true, manageChannels: true, manageRoles: true,
                                        kickMembers: true, banMembers: true } },
                                member: { name: 'Membro', color: '#5865f2', permissions: { sendMessages: true,
                                        readMessages: true, manageChannels: false, manageRoles: false,
                                        kickMembers: false, banMembers: false } }
                            },
                            channels: {
                                general: { name: 'geral', type: 'text', topic: 'Bem-vindo!',
                                    permissions: {} }
                            }
                        };
                        serverRef.set(serverData);
                        // Adiciona servidor ao usuário
                        db.ref('users/' + newId + '/servers/' + serverId).set(true);
                        currentUser = { id: newId, ...newUser };
                        sessionStorage.setItem('chatplus_session', JSON.stringify({ userId: newId }));
                        showApp();
                        errorEl.textContent = '';
                    });
                });
            }
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            if (currentUser) {
                db.ref('users/' + currentUser.id + '/online').set(false);
                db.ref('users/' + currentUser.id + '/lastSeen').set(Date.now());
            }
            sessionStorage.removeItem('chatplus_session');
            currentUser = null;
            showAuth();
            document.getElementById('app').style.display = 'none';
            if (window.serverListener) window.serverListener();
            if (window.channelListener) window.channelListener();
            if (window.msgListener) window.msgListener();
            if (window.inviteListener) window.inviteListener();
        });

        // ============================================================
        //  USER BADGE & STATUS
        // ============================================================
        function updateUserBadge() {
            if (!currentUser) return;
            document.getElementById('my-avatar').textContent = currentUser.avatar || getInitials(currentUser.username);
            document.getElementById('my-username').textContent = currentUser.username;
            if (currentUser.status) {
                userStatus = currentUser.status;
                updateStatusUI(userStatus);
            }
        }

        function updateStatusUI(status) {
            const dot = document.getElementById('my-status-dot');
            if (dot) dot.className = 'status-dot ' + status;
            document.querySelectorAll('.status-option .check').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.status-option').forEach(opt => {
                if (opt.dataset.status === status) {
                    const check = opt.querySelector('.check');
                    if (check) check.style.display = 'inline';
                }
            });
        }

        // Status popup
        document.getElementById('my-avatar')?.addEventListener('click', (e) => {
            e.stopPropagation();
            const popup = document.getElementById('status-popup');
            popup.style.display = popup.style.display === 'none' ? 'block' : 'none';
        });
        document.querySelectorAll('.status-option').forEach(opt => {
            opt.addEventListener('click', () => {
                const status = opt.dataset.status;
                userStatus = status;
                if (currentUser) {
                    db.ref('users/' + currentUser.id + '/status').set(status);
                    if (status === 'invisible') {
                        db.ref('users/' + currentUser.id + '/online').set(false);
                    } else {
                        db.ref('users/' + currentUser.id + '/online').set(true);
                    }
                }
                updateStatusUI(status);
                document.getElementById('status-popup').style.display = 'none';
            });
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#my-avatar') && !e.target.closest('#status-popup')) {
                document.getElementById('status-popup').style.display = 'none';
            }
        });

        // ============================================================
        //  LISTENERS
        // ============================================================
        let serverListener = null,
            channelListener = null,
            msgListener = null,
            inviteListener = null;

        function startListeners() {
            // Servidores do usuário
            if (serverListener) serverListener();
            serverListener = db.ref('users/' + currentUser.id + '/servers').on('value', snap => {
                const servers = snap.val() || {};
                const serverIds = Object.keys(servers);
                if (serverIds.length && !currentServerId) {
                    currentServerId = serverIds[0];
                }
                loadServers();
            });

            // Convites
            if (inviteListener) inviteListener();
            inviteListener = db.ref('invites').orderByChild('targetId').equalTo(currentUser.id).on('value', snap => {
                const invites = [];
                snap.forEach(child => {
                    const inv = child.val();
                    inv.id = child.key;
                    if (inv.status === 'pending') invites.push(inv);
                });
                if (invites.length) showInviteToast(invites[0]);
            });
        }

        // ============================================================
        //  LOAD SERVERS
        // ============================================================
        function loadServers() {
            const container = document.getElementById('server-sidebar');
            db.ref('users/' + currentUser.id + '/servers').once('value').then(snap => {
                const serverIds = Object.keys(snap.val() || {});
                if (!serverIds.length) {
                    container.innerHTML = `
                        <div class="server-icon" id="create-server-btn" title="Criar servidor">
                            <i class="fas fa-plus-circle add-server"></i>
                        </div>
                    `;
                    return;
                }
                let html = '';
                serverIds.forEach(id => {
                    db.ref('servers/' + id).once('value').then(serverSnap => {
                        const server = serverSnap.val();
                        if (!server) return;
                        serversCache[id] = server;
                        const active = id === currentServerId ? 'active' : '';
                        const icon = server.icon || '📁';
                        html += `
                            <div class="server-icon ${active}" data-id="${id}" title="${server.name}">
                                ${icon}
                            </div>
                        `;
                        container.innerHTML = html + `
                            <div class="server-icon" id="create-server-btn" title="Criar servidor">
                                <i class="fas fa-plus-circle add-server"></i>
                            </div>
                        `;
                        // Bind events
                        container.querySelectorAll('.server-icon[data-id]').forEach(el => {
                            el.addEventListener('click', () => {
                                const sid = el.dataset.id;
                                if (sid) switchServer(sid);
                            });
                        });
                        container.querySelector('#create-server-btn')?.addEventListener('click', createServer);
                    });
                });
                if (currentServerId && serverIds.includes(currentServerId)) {
                    switchServer(currentServerId);
                } else if (serverIds.length) {
                    switchServer(serverIds[0]);
                }
            });
        }

        // ============================================================
        //  SWITCH SERVER
        // ============================================================
        function switchServer(serverId) {
            currentServerId = serverId;
            currentChannelId = null;
            currentDmId = null;
            document.querySelectorAll('.server-icon').forEach(el => el.classList.remove('active'));
            document.querySelector(`.server-icon[data-id="${serverId}"]`)?.classList.add('active');
            loadChannels(serverId);
            loadMembers(serverId);
            document.getElementById('server-name').textContent = serversCache[serverId]?.name || 'Servidor';
            // Carrega primeiro canal
            db.ref('servers/' + serverId + '/channels').once('value').then(snap => {
                const chs = snap.val() || {};
                const keys = Object.keys(chs);
                if (keys.length) {
                    const firstKey = keys.find(k => chs[k].type === 'text') || keys[0];
                    switchChannel(serverId, firstKey);
                } else {
                    document.getElementById('chat-title').textContent = 'Nenhum canal';
                    document.getElementById('message-area').innerHTML = '<div style="color:#5c5e66;padding:40px;text-align:center;">Crie um canal</div>';
                }
            });
            // Esconde DM button
            document.getElementById('dm-btn').style.display = 'none';
        }

        // ============================================================
        //  LOAD CHANNELS
        // ============================================================
        function loadChannels(serverId) {
            const container = document.getElementById('channels-list');
            db.ref('servers/' + serverId + '/channels').once('value').then(snap => {
                const chs = snap.val() || {};
                channelsCache = chs;
                let html = '';
                const categories = {};
                Object.keys(chs).forEach(key => {
                    const ch = chs[key];
                    const cat = ch.category || 'Canais de texto';
                    if (!categories[cat]) categories[cat] = [];
                    categories[cat].push({ id: key, ...ch });
                });
                for (const [cat, items] of Object.entries(categories)) {
                    html += `<div class="channel-category"><span>${cat}</span> <i class="fas fa-chevron-down"></i></div>`;
                    items.forEach(ch => {
                        const active = ch.id === currentChannelId ? 'active' : '';
                        const icon = ch.type === 'voice' ? 'fa-volume-up' : 'fa-hashtag';
                        const lock = ch.permissions && !ch.permissions[Object.keys(ch.permissions).find(r =>
                            ch.permissions[r].readMessages === true)] ? '<i class="fas fa-lock lock"></i>' :
                        '';
                        html += `
                            <div class="channel-item ${active}" data-id="${ch.id}">
                                <i class="fas ${icon}"></i>
                                <span>${ch.name}</span> ${lock}
                                <div class="channel-actions">
                                    <button class="channel-edit-btn" data-id="${ch.id}" title="Editar"><i class="fas fa-pen"></i></button>
                                    <button class="channel-delete-btn danger" data-id="${ch.id}" title="Excluir"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                        `;
                    });
                }
                container.innerHTML = html || '<div style="color:#5c5e66;padding:16px;text-align:center;">Nenhum canal</div>';
                container.querySelectorAll('.channel-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const cid = el.dataset.id;
                        if (cid) switchChannel(serverId, cid);
                    });
                });
                container.querySelectorAll('.channel-edit-btn').forEach(btn => {
                    btn.addEventListener('click', e => { e.stopPropagation();
                        openChannelSettings(btn.dataset.id); });
                });
                container.querySelectorAll('.channel-delete-btn').forEach(btn => {
                    btn.addEventListener('click', e => { e.stopPropagation();
                        deleteChannel(btn.dataset.id); });
                });
            });
        }

        // ============================================================
        //  SWITCH CHANNEL
        // ============================================================
        function switchChannel(serverId, channelId) {
            currentServerId = serverId;
            currentChannelId = channelId;
            currentDmId = null;
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`.channel-item[data-id="${channelId}"]`)?.classList.add('active');
            // Atualiza header
            const ch = channelsCache[channelId];
            if (ch) {
                document.getElementById('chat-title').textContent = '# ' + ch.name;
                document.getElementById('chat-topic').textContent = ch.topic || '';
            }
            // Carrega mensagens
            if (msgListener) { db.ref('messages/' + serverId + '/' + channelId).off();
                msgListener = null; }
            msgListener = db.ref('messages/' + serverId + '/' + channelId).on('value', snap => {
                const msgs = [];
                snap.forEach(child => {
                    const m = child.val();
                    m.id = child.key;
                    msgs.push(m);
                });
                renderMessages(msgs);
            });
            // Atualiza membros
            loadMembers(serverId);
            // DM button
            document.getElementById('dm-btn').style.display = 'none';
            // Verifica permissão para enviar
            checkSendPermission(serverId, channelId);
        }

        // ============================================================
        //  CHECK PERMISSION
        // ============================================================
        function checkSendPermission(serverId, channelId) {
            const ch = channelsCache[channelId];
            if (!ch) return;
            const server = serversCache[serverId];
            if (!server) return;
            const roleId = server.members[currentUser.id]?.role || 'member';
            const role = server.roles[roleId];
            const perms = role?.permissions || {};
            const channelPerms = ch.permissions || {};
            const allow = channelPerms[roleId]?.allow || {};
            const deny = channelPerms[roleId]?.deny || {};
            const canSend = (deny.sendMessages !== true) && (allow.sendMessages !== false) && (perms.sendMessages !== false);
            if (!canSend) {
                document.getElementById('message-input').disabled = true;
                document.getElementById('message-input').placeholder = 'Você não tem permissão para enviar mensagens aqui.';
                document.getElementById('send-btn').disabled = true;
            } else {
                document.getElementById('message-input').disabled = false;
                document.getElementById('message-input').placeholder = 'Digite uma mensagem...';
                document.getElementById('send-btn').disabled = false;
            }
        }

        // ============================================================
        //  LOAD MEMBERS
        // ============================================================
        function loadMembers(serverId) {
            const container = document.getElementById('members-list');
            db.ref('servers/' + serverId + '/members').once('value').then(snap => {
                const members = snap.val() || {};
                const userIds = Object.keys(members);
                let html = '';
                userIds.forEach(uid => {
                    db.ref('users/' + uid).once('value').then(userSnap => {
                        const user = userSnap.val();
                        if (!user) return;
                        const roleId = members[uid]?.role || 'member';
                        const server = serversCache[serverId];
                        const role = server?.roles[roleId];
                        const color = role?.color || '#5865f2';
                        const isOnline = user.online && user.status !== 'invisible';
                        const status = isOnline ? (user.status || 'online') : 'offline';
                        const statusDot = isOnline ? status : 'invisible';
                        html += `
                            <div class="member-item" data-id="${uid}">
                                <div class="avatar-small" style="background:${color}">
                                    ${user.avatar || getInitials(user.username)}
                                    <span class="status-dot ${statusDot}"></span>
                                </div>
                                <span class="member-name">${user.username}</span>
                                <span class="role-tag">${role?.name || 'Membro'}</span>
                            </div>
                        `;
                        container.innerHTML = html;
                        container.querySelectorAll('.member-item').forEach(el => {
                            el.addEventListener('click', () => {
                                const uid = el.dataset.id;
                                if (uid) openProfile(uid);
                            });
                        });
                    });
                });
                if (!userIds.length) {
                    container.innerHTML = '<div style="color:#5c5e66;padding:12px;text-align:center;">Nenhum membro</div>';
                }
            });
        }

        // ============================================================
        //  RENDER MESSAGES
        // ============================================================
        function renderMessages(msgs) {
            const area = document.getElementById('message-area');
            if (!currentChannelId && !currentDmId) {
                area.innerHTML = '<div style="color:#5c5e66;text-align:center;padding:40px;">Selecione um canal ou DM</div>';
                return;
            }
            msgs.sort((a, b) => a.timestamp - b.timestamp);
            let html = '';
            let lastDate = '';
            msgs.forEach(msg => {
                const d = formatDate(msg.timestamp);
                if (d !== lastDate) { html += `<div class="msg-date">${d}</div>`; lastDate = d; }
                const isOwn = msg.userId === currentUser.id;
                const username = msg.username || 'Desconhecido';
                const avatar = msg.avatar || getInitials(username);
                const isAdmin = msg.isAdmin || false;
                const time = formatTime(msg.timestamp);
                let content = msg.content || '';
                if (content) {
                    const mentionRegex = /@(\w+)/g;
                    content = content.replace(mentionRegex, (match, username) => {
                        if (username === currentUser.username) {
                            return `<span class="mention">@${username}</span>`;
                        }
                        return match;
                    });
                }
                let filesHtml = '';
                if (msg.files && msg.files.length) {
                    filesHtml = `<div class="msg-files">`;
                    msg.files.forEach(f => {
                        const icon = f.type && f.type.startsWith('image/') ? 'fa-image' : 'fa-file';
                        filesHtml += `
                            <div class="file-card">
                                <i class="fas ${icon}"></i>
                                <a href="${f.data}" ${f.type && f.type.startsWith('image/') ? 'target="_blank"' : 'download="'+f.name+'"'} >${f.name}</a>
                                <span style="font-size:10px;color:#5c5e66;">(${(f.size/1024).toFixed(1)} KB)</span>
                            </div>
                        `;
                    });
                    filesHtml += `</div>`;
                }
                let reactionsHtml = '';
                if (msg.reactions) {
                    reactionsHtml = `<div class="msg-reactions">`;
                    for (const [emoji, users] of Object.entries(msg.reactions)) {
                        const count = users.length;
                        const hasReacted = users.includes(currentUser.id);
                        reactionsHtml += `
                            <div class="reaction ${hasReacted ? 'active' : ''}" data-msgid="${msg.id}" data-emoji="${emoji}">
                                <span>${emoji}</span>
                                <span class="count">${count}</span>
                            </div>
                        `;
                    }
                    reactionsHtml += `</div>`;
                }
                html += `
                    <div class="message ${isOwn ? 'own' : ''}" data-id="${msg.id}">
                        <div class="msg-avatar" style="background:${isAdmin ? 'linear-gradient(135deg,#f093fb,#f5576c)' : '#5865f2'}">${avatar}</div>
                        <div class="msg-content">
                            <div class="msg-header">
                                <span class="username">${username}</span>
                                ${isAdmin ? '<span class="role-badge">ADMIN</span>' : ''}
                                <span class="timestamp">${time}</span>
                            </div>
                            ${content ? `<div class="msg-text">${content}</div>` : ''}
                            ${filesHtml}
                            ${reactionsHtml}
                        </div>
                    </div>
                `;
            });
            if (!html) html = '<div style="color:#5c5e66;text-align:center;padding:40px;">Sem mensagens.</div>';
            area.innerHTML = html;
            area.scrollTop = area.scrollHeight;
            area.querySelectorAll('.reaction').forEach(el => {
                el.addEventListener('click', () => {
                    toggleReaction(el.dataset.msgid, el.dataset.emoji);
                });
            });
        }

        // ============================================================
        //  SEND MESSAGE
        // ============================================================
        const MAX_FILE_SIZE = 8 * 1024 * 1024;
        const MAX_FILES = 5;

        document.getElementById('file-input').addEventListener('change', (e) => {
            const errorEl = document.getElementById('file-error');
            errorEl.style.display = 'none';
            errorEl.textContent = '';
            const files = e.target.files;
            if (files.length > MAX_FILES) {
                errorEl.textContent = `Máximo de ${MAX_FILES} arquivos.`;
                errorEl.style.display = 'block';
                e.target.value = '';
                return;
            }
            for (const file of files) {
                if (file.size > MAX_FILE_SIZE) {
                    errorEl.textContent = `Arquivo "${file.name}" excede 8 MB.`;
                    errorEl.style.display = 'block';
                    e.target.value = '';
                    return;
                }
            }
            for (const file of files) { if (file.size > 0) pendingFiles.push(file); }
            updateFilePreview();
            e.target.value = '';
        });

        function updateFilePreview() {
            const c = document.getElementById('file-preview');
            if (!pendingFiles.length) { c.innerHTML = ''; return; }
            let html = '';
            pendingFiles.forEach((f, i) => {
                html += `
                    <div class="file-tag">
                        <i class="fas fa-file"></i>
                        <span>${f.name} (${(f.size/1024).toFixed(1)} KB)</span>
                        <span class="remove" data-idx="${i}"><i class="fas fa-times-circle"></i></span>
                    </div>
                `;
            });
            c.innerHTML = html;
            c.querySelectorAll('.remove').forEach(el => {
                el.addEventListener('click', () => { pendingFiles.splice(parseInt(el.dataset.idx), 1);
                    updateFilePreview(); });
            });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                sendMessage(); }
        });

        function sendMessage() {
            if (!currentChannelId && !currentDmId) { alert('Selecione um canal ou DM.'); return; }
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content && !pendingFiles.length) return;
            if (!currentUser) return;

            const msg = {
                userId: currentUser.id,
                username: currentUser.username,
                avatar: currentUser.avatar || getInitials(currentUser.username),
                isAdmin: currentUser.isAdmin || false,
                content: content || '',
                timestamp: Date.now(),
                files: [],
                reactions: {}
            };

            const promises = pendingFiles.map(f => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve({ name: f.name, type: f.type || 'application/octet-stream',
                        size: f.size, data: e.target.result });
                reader.onerror = reject;
                reader.readAsDataURL(f);
            }));

            Promise.all(promises).then(files => {
                msg.files = files;
                let path;
                if (currentDmId) {
                    path = 'dms/' + currentDmId + '/messages';
                } else {
                    path = 'messages/' + currentServerId + '/' + currentChannelId;
                }
                const ref = db.ref(path).push();
                ref.set(msg);
                pendingFiles = [];
                updateFilePreview();
                input.value = '';
                input.style.height = '38px';
                document.getElementById('file-error').style.display = 'none';
            }).catch(err => {
                alert('Erro ao ler arquivo: ' + err.message);
            });
        }

        document.getElementById('message-input').addEventListener('input', function() {
            this.style.height = '38px';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // ============================================================
        //  REACTIONS
        // ============================================================
        function toggleReaction(msgId, emoji) {
            if (!currentUser) return;
            let path;
            if (currentDmId) {
                path = 'dms/' + currentDmId + '/messages/' + msgId + '/reactions/' + emoji;
            } else {
                path = 'messages/' + currentServerId + '/' + currentChannelId + '/' + msgId + '/reactions/' + emoji;
            }
            const ref = db.ref(path);
            ref.transaction(current => {
                if (!current) current = [];
                const idx = current.indexOf(currentUser.id);
                if (idx > -1) { current.splice(idx, 1); } else { current.push(currentUser.id); }
                return current;
            });
        }

        // ============================================================
        //  EMOJI PICKER
        // ============================================================
        const emojiPopup = document.getElementById('emoji-picker-popup');
        document.getElementById('emoji-toggle-btn').addEventListener('click', () => emojiPopup.classList.toggle('open'));
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.emoji-picker-container') && !e.target.closest('#emoji-toggle-btn')) emojiPopup
                .classList.remove('open');
        });
        document.addEventListener('DOMContentLoaded', () => {
            const picker = document.getElementById('emoji-picker');
            if (picker) {
                picker.addEventListener('emoji-click', (e) => {
                    document.getElementById('message-input').value += e.detail.unicode;
                    document.getElementById('message-input').focus();
                    emojiPopup.classList.remove('open');
                });
            }
        });

        // ============================================================
        //  CREATE SERVER
        // ============================================================
        function createServer() {
            const modal = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '📁 Criar Servidor';
            document.getElementById('modal-sub').textContent = 'Dê um nome e ícone para seu servidor.';
            document.getElementById('modal-body').innerHTML = `
                <div class="input-group"><label>Nome do servidor</label><input id="server-name-input" placeholder="Ex: Meu servidor" /></div>
                <div class="input-group"><label>Ícone (emoji)</label><input id="server-icon-input" placeholder="Ex: 📁" maxlength="2" /></div>
            `;
            document.getElementById('modal-confirm').textContent = 'Criar';
            document.getElementById('modal-confirm').className = 'btn-confirm';
            document.getElementById('modal-cancel').textContent = 'Cancelar';
            modal.classList.add('open');

            const confirmBtn = document.getElementById('modal-confirm');
            const newConfirm = confirmBtn.cloneNode(true);
            confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
            newConfirm.addEventListener('click', () => {
                const name = document.getElementById('server-name-input').value.trim() || 'Novo Servidor';
                const icon = document.getElementById('server-icon-input').value.trim() || '📁';
                const serverRef = db.ref('servers').push();
                const serverId = serverRef.key;
                const serverData = {
                    name,
                    icon,
                    ownerId: currentUser.id,
                    createdAt: Date.now(),
                    members: { [currentUser.id]: { role: 'admin' } },
                    roles: {
                        admin: { name: 'Admin', color: '#f23f42', permissions: { sendMessages: true,
                                readMessages: true, manageChannels: true, manageRoles: true,
                                kickMembers: true, banMembers: true } },
                        member: { name: 'Membro', color: '#5865f2', permissions: { sendMessages: true,
                                readMessages: true, manageChannels: false, manageRoles: false,
                                kickMembers: false, banMembers: false } }
                    },
                    channels: {
