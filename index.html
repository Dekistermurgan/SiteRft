<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat+Plus — Converse com Arquivos</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Emoji Picker -->
    <script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.16.1/index.js" defer></script>

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #2d2d44;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a4a6a;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a7a;
        }
        button {
            cursor: pointer;
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }
        input,
        textarea {
            background: #2d2d44;
            border: none;
            outline: none;
            color: #eee;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
        }
        input::placeholder,
        textarea::placeholder {
            color: #8888aa;
        }

        /* ===== AUTH ===== */
        #auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #14142a, #1e1e3a);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #auth-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .auth-box {
            background: #252540;
            border-radius: 20px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid #3a3a5a;
        }
        .auth-box h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-align: center;
        }
        .auth-box .subtitle {
            color: #9999bb;
            text-align: center;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .auth-box .input-group {
            margin-bottom: 16px;
            position: relative;
        }
        .auth-box .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #6666aa;
            font-size: 16px;
        }
        .auth-box .input-group input {
            padding-left: 44px;
            background: #1e1e36;
            border: 1px solid #3a3a5a;
            transition: 0.2s;
        }
        .auth-box .input-group input:focus {
            border-color: #7c6cf0;
            background: #262646;
        }
        .auth-box .btn-primary {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            font-weight: 600;
            font-size: 16px;
            color: #fff;
            transition: 0.2s;
            margin-top: 8px;
        }
        .auth-box .btn-primary:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        .auth-box .auth-switch {
            text-align: center;
            margin-top: 18px;
            color: #8888aa;
            font-size: 14px;
        }
        .auth-box .auth-switch .auth-link {
            color: #b76cf0;
            cursor: pointer;
            font-weight: 600;
        }
        .auth-box .auth-switch .auth-link:hover {
            text-decoration: underline;
        }
        .auth-box .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }

        /* ===== APP LAYOUT ===== */
        #app {
            display: none;
            width: 100%;
            height: 100vh;
            background: #16162e;
            overflow: hidden;
        }
        #app.active {
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            min-width: 240px;
            background: #1e1e38;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #2d2d4a;
            transition: 0.3s;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .sidebar-header .brand {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header .user-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #2d2d4a;
            padding: 3px 10px 3px 5px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            color: #ccc;
            cursor: pointer;
        }
        .sidebar-header .user-badge .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar-header .user-badge .logout-btn {
            margin-left: 2px;
            color: #8888aa;
            font-size: 13px;
            transition: 0.2s;
        }
        .sidebar-header .user-badge .logout-btn:hover {
            color: #ff6b6b;
        }

        .sidebar-nav {
            padding: 8px 12px;
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #2d2d4a;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .sidebar-nav button {
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            background: transparent;
            color: #8888aa;
            transition: 0.2s;
        }
        .sidebar-nav button:hover {
            background: #2d2d4a;
            color: #eee;
        }
        .sidebar-nav button.active {
            background: #3a3a5a;
            color: #fff;
        }

        .sidebar-channels {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
        }
        .sidebar-channels .channel-group-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6666aa;
            padding: 8px 6px 2px;
            font-weight: 600;
        }
        .sidebar-channels .channel-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.15s;
            color: #aaaacc;
            font-size: 13px;
            margin-bottom: 1px;
            position: relative;
        }
        .sidebar-channels .channel-item:hover {
            background: #2d2d4a;
            color: #eee;
        }
        .sidebar-channels .channel-item.active {
            background: #3a3a5a;
            color: #fff;
        }
        .sidebar-channels .channel-item i {
            width: 18px;
            text-align: center;
            font-size: 14px;
            color: #6666aa;
        }
        .sidebar-channels .channel-item.active i {
            color: #b76cf0;
        }
        .sidebar-channels .channel-item .channel-actions {
            display: none;
            gap: 3px;
            margin-left: auto;
        }
        .sidebar-channels .channel-item:hover .channel-actions {
            display: flex;
        }
        .sidebar-channels .channel-item .channel-actions button {
            color: #8888aa;
            font-size: 11px;
            padding: 1px 5px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .sidebar-channels .channel-item .channel-actions button:hover {
            color: #fff;
            background: #4a4a6a;
        }
        .sidebar-channels .channel-item .channel-actions button.danger:hover {
            color: #ff6b6b;
        }

        .sidebar-footer {
            padding: 8px 12px;
            border-top: 1px solid #2d2d4a;
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .sidebar-footer button {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            background: #2d2d4a;
            color: #ccc;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 50px;
        }
        .sidebar-footer button:hover {
            background: #3d3d5a;
            color: #fff;
        }
        .sidebar-footer button.primary {
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            color: #fff;
        }
        .sidebar-footer button.primary:hover {
            opacity: 0.9;
        }
        .sidebar-footer .friend-btn {
            background: #2d4a4a;
        }
        .sidebar-footer .friend-btn:hover {
            background: #3d5a5a;
        }

        /* ===== MIDDLE: CHAT ===== */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a32;
            height: 100vh;
            overflow: hidden;
            min-width: 0;
        }

        .chat-header {
            padding: 10px 18px;
            border-bottom: 1px solid #2d2d4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: #1e1e38;
        }
        .chat-header .chat-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }
        .chat-header .chat-info h2 {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-header .chat-info .member-count {
            font-size: 12px;
            color: #8888aa;
            white-space: nowrap;
        }
        .chat-header .chat-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .chat-header .chat-actions button {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            background: #2d2d4a;
            color: #ccc;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .chat-header .chat-actions button:hover {
            background: #3d3d5a;
            color: #fff;
        }
        .chat-header .chat-actions button.danger:hover {
            background: #6b2d2d;
            color: #ff6b6b;
        }
        .chat-header .chat-actions button.success:hover {
            background: #2d6b2d;
            color: #7cff7c;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .chat-messages .msg-date-divider {
            text-align: center;
            font-size: 11px;
            color: #6666aa;
            padding: 8px 0 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .chat-messages .message {
            display: flex;
            gap: 10px;
            padding: 4px 10px 4px 6px;
            border-radius: 6px;
            transition: 0.1s;
            max-width: 88%;
            align-self: flex-start;
        }
        .chat-messages .message.own {
            align-self: flex-end;
            flex-direction: row-reverse;
            background: #2d2d4a;
        }
        .chat-messages .message:hover {
            background: #262642;
        }
        .chat-messages .message.own:hover {
            background: #333355;
        }
        .chat-messages .message .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
            color: #fff;
            flex-shrink: 0;
        }
        .chat-messages .message .msg-content {
            flex: 1;
            min-width: 0;
        }
        .chat-messages .message .msg-header {
            display: flex;
            align-items: baseline;
            gap: 6px;
            flex-wrap: wrap;
        }
        .chat-messages .message .msg-header .username {
            font-weight: 600;
            font-size: 13px;
            color: #b76cf0;
        }
        .chat-messages .message .msg-header .timestamp {
            font-size: 10px;
            color: #6666aa;
        }
        .chat-messages .message .msg-header .badge-admin {
            font-size: 9px;
            background: #7c6cf0;
            color: #fff;
            padding: 0 6px;
            border-radius: 30px;
            font-weight: 600;
        }
        .chat-messages .message .msg-text {
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            margin-top: 1px;
            color: #eee;
        }
        .chat-messages .message .msg-files {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .chat-messages .message .msg-files .file-card {
            background: #2d2d4a;
            border-radius: 6px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            border: 1px solid #3a3a5a;
            max-width: 200px;
            word-break: break-all;
        }
        .chat-messages .message .msg-files .file-card i {
            font-size: 16px;
            color: #b76cf0;
        }
        .chat-messages .message .msg-files .file-card a {
            color: #7c6cf0;
            text-decoration: none;
            font-weight: 500;
        }
        .chat-messages .message .msg-files .file-card a:hover {
            text-decoration: underline;
        }
        .chat-messages .message .msg-reactions {
            display: flex;
            gap: 3px;
            margin-top: 3px;
            flex-wrap: wrap;
        }
        .chat-messages .message .msg-reactions .reaction {
            background: #2d2d4a;
            border-radius: 30px;
            padding: 0 8px 0 4px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .chat-messages .message .msg-reactions .reaction:hover {
            border-color: #7c6cf0;
            background: #3a3a5a;
        }
        .chat-messages .message .msg-reactions .reaction .count {
            font-size: 11px;
            color: #aaaacc;
        }

        .chat-input-area {
            padding: 8px 16px 12px;
            border-top: 1px solid #2d2d4a;
            background: #1e1e38;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-input-area .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .chat-input-area .input-row .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: #2d2d44;
            border-radius: 10px;
            padding: 0 10px;
            border: 1px solid #3a3a5a;
            transition: 0.2s;
        }
        .chat-input-area .input-row .input-wrapper:focus-within {
            border-color: #7c6cf0;
        }
        .chat-input-area .input-row .input-wrapper textarea {
            background: transparent;
            border: none;
            padding: 8px 0;
            resize: none;
            height: 38px;
            max-height: 100px;
            font-size: 14px;
            line-height: 1.4;
            flex: 1;
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn {
            color: #8888aa;
            font-size: 18px;
            padding: 4px 2px 4px 6px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .chat-input-area .input-row .input-wrapper .emoji-btn:hover {
            color: #b76cf0;
        }
        .chat-input-area .input-row .input-wrapper .file-btn {
            color: #8888aa;
            font-size: 16px;
            padding: 4px 2px;
            transition: 0.2s;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
        }
        .chat-input-area .input-row .input-wrapper .file-btn:hover {
            color: #b76cf0;
        }
        .chat-input-area .input-row .input-wrapper .file-btn input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .chat-input-area .input-row .send-btn {
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .chat-input-area .input-row .send-btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .chat-input-area .file-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 2px 0;
        }
        .chat-input-area .file-preview .file-tag {
            background: #2d2d4a;
            border-radius: 5px;
            padding: 2px 10px 2px 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid #3a3a5a;
        }
        .chat-input-area .file-preview .file-tag i {
            color: #b76cf0;
        }
        .chat-input-area .file-preview .file-tag .remove {
            color: #ff6b6b;
            cursor: pointer;
            font-size: 13px;
        }

        /* ===== RIGHT PANEL: ATIVOS ===== */
        .active-panel {
            width: 200px;
            min-width: 200px;
            background: #1a1a32;
            border-left: 1px solid #2d2d4a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .active-panel .panel-header {
            padding: 12px 14px 8px;
            border-bottom: 1px solid #2d2d4a;
            font-weight: 700;
            font-size: 14px;
            color: #7c6cf0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .active-panel .panel-header .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }
        .active-panel .panel-header .count-badge {
            background: #2d2d4a;
            border-radius: 30px;
            padding: 0 10px;
            font-size: 12px;
            font-weight: 600;
            color: #aaaacc;
            margin-left: auto;
        }
        .active-panel .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
        }
        .active-panel .active-user-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            transition: 0.15s;
            margin-bottom: 2px;
            font-size: 13px;
        }
        .active-panel .active-user-item:hover {
            background: #2d2d4a;
        }
        .active-panel .active-user-item .u-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c6cf0, #b76cf0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 11px;
            color: #fff;
            flex-shrink: 0;
        }
        .active-panel .active-user-item .u-name {
            flex: 1;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .active-panel .active-user-item .u-status {
            font-size: 10px;
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .active-panel .active-user-item .u-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
        }
        .active-panel .active-user-item .invite-btn {
            background: #2d4a4a;
            color: #7cff7c;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        .active-panel .active-user-item .invite-btn:hover {
            background: #3d6a5a;
            transform: scale(1.05);
        }
        .active-panel .active-user-item .invite-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .active-panel .panel-empty {
            color: #6666aa;
            text-align: center;
            padding: 30px 10px;
            font-size: 13px;
        }
        .active-panel .panel-empty i {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
            color: #3a3a5a;
        }

        /* ===== EMOJI PICKER ===== */
        .emoji-picker-container {
            position: relative;
            display: inline-block;
        }
        .emoji-picker-container .emoji-picker-popup {
            position: absolute;
            bottom: 50px;
            left: 0;
            z-index: 999;
            background: #252540;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid #3a3a5a;
            padding: 6px;
            display: none;
            width: 280px;
            height: 340px;
            overflow-y: auto;
        }
        .emoji-picker-container .emoji-picker-popup.open {
            display: block;
        }
        .emoji-picker-container .emoji-picker-popup emoji-picker {
            --background: #252540;

        /* ===== MODAL ===== */
        .modal-overlay {

        .modal-box .modal-actions {

        .modal-box .modal-actions button {

        .modal-box .modal-actions .btn-cancel {

        }
        .modal-box .modal-actions .btn-cancel:hover {

        .modal-box .modal-actions .btn-confirm {

        .modal-box .modal-actions .btn-danger {

        .modal-box .modal-actions .btn-success:hover {

        .modal-box .user-list-item {

        .modal-box .user-list-item .avatar-small {

        /* ===== INVITE NOTIFICATION (toast) ===== */

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {

        }
    </style>
</head>
<body>

    <!-- ===== AUTH ===== -->
    <div id="auth-screen">
        <div class="auth-box">
            <h1>💬 Chat+Plus</h1>
            <p class="subtitle">Converse, compartilhe arquivos e veja quem está ativo</p>
            <div id="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input id="auth-username" type="text" placeholder="Nome de usuário" />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input id="auth-password" type="password" placeholder="Senha" />
                </div>
                <button class="btn-primary" id="auth-btn">Entrar</button>
                <div class="auth-switch">
                    <span id="auth-switch-prefix">Não tem conta?</span>
                    <span class="auth-link" id="auth-toggle">Registrar</span>
                </div>
                <div class="error-msg" id="auth-error"></div>
            </div>
        </div>
    </div>

    <!-- ===== APP ===== -->
    <div id="app">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="brand">💬 Chat+Plus</span>
                <div class="user-badge" id="user-badge">
                    <div class="avatar" id="my-avatar">U</div>
                    <span class="username-text" id="my-username">Usuário</span>
                    <button class="logout-btn" id="logout-btn" title="Sair"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <div class="sidebar-nav" id="sidebar-nav">
                <button class="active" data-filter="all"><i class="fas fa-hashtag"></i> Todos</button>
                <button data-filter="dm"><i class="fas fa-user"></i> DMs</button>
                <button data-filter="group"><i class="fas fa-users"></i> Grupos</button>
            </div>
            <div class="sidebar-channels" id="channel-list"></div>
            <div class="sidebar-footer">
                <button id="create-channel-btn" class="primary"><i class="fas fa-plus-circle"></i> <span>Canal</span></button>
                <button id="create-group-btn"><i class="fas fa-user-plus"></i> <span>Grupo</span></button>
                <button id="add-friend-btn" class="friend-btn"><i class="fas fa-user-friends"></i> <span>Amigo</span></button>

        <!-- CHAT -->
        <div class="chat-main">
            <div class="chat-header">

                <div class="chat-actions">
                    <button id="add-member-btn" class="success" title="Adicionar membro"><i class="fas fa-user-plus"></i> <span>Membro</span></button>
                    <button id="edit-channel-btn" title="Editar"><i class="fas fa-pen"></i> <span>Editar</span></button>
                    <button id="delete-channel-btn" class="danger" title="Excluir"><i class="fas fa-trash"></i> <span>Excluir</span></button>
                    <button id="manage-users-btn" title="Admins globais"><i class="fas fa-user-cog"></i> <span>Admins</span></button>

            <div class="chat-messages" id="message-area"></div>

                    <div class="input-wrapper">

                        <button class="emoji-btn" id="emoji-toggle-btn"><i class="far fa-smile"></i></button>
                        <div class="emoji-picker-container">
                            <div class="emoji-picker-popup" id="emoji-picker-popup">
                                <emoji-picker id="emoji-picker"></emoji-picker>
                            </div>
                        </div>
                        <label class="file-btn">
                            <i class="fas fa-paperclip"></i>
                            <input type="file" id="file-input" multiple />
                        </label>
                    </div>
                    <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>

        <!-- ACTIVE USERS PANEL -->
        <div class="active-panel" id="active-panel">
            <div class="panel-header">
                <span class="online-dot"></span>
                ATIVOS
                <span class="count-badge" id="active-count">0</span>
            </div>
            <div class="panel-body" id="active-users-list">
                <div class="panel-empty">
                    <i class="fas fa-users"></i>
                    Nenhum usuário ativo no momento.
                </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box" id="modal-box">
            <h2 id="modal-title">Título</h2>
            <p class="modal-sub" id="modal-sub">Subtítulo</p>
            <div id="modal-body"></div>
            <div class="modal-actions" id="modal-actions">
                <button class="btn-cancel" id="modal-cancel">Cancelar</button>
                <button class="btn-confirm" id="modal-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- ===== INVITE TOAST ===== -->
    <div class="invite-toast" id="invite-toast">
        <div class="toast-title" id="toast-title">📨 Convite recebido</div>
        <div class="toast-body" id="toast-body">Você foi convidado para entrar em um grupo.</div>
        <div class="toast-actions">
            <button class="btn-reject" id="toast-reject">Recusar</button>
            <button class="btn-accept" id="toast-accept">Aceitar</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  DATA LAYER
        // ============================================================
        const DB_KEY = 'chatplus_data';
        const SESSION_KEY = 'chatplus_session';
        const ONLINE_KEY = 'chatplus_online';
        const INVITES_KEY = 'chatplus_invites';

        function getDB() {
            try { return JSON.parse(localStorage.getItem(DB_KEY)) || { users: [], channels: [], messages: [] }; } catch
            { return { users: [], channels: [], messages: [] }; }
        }

        function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

        function getSession() {
            try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; }
        }

        function saveSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }

        function clearSession() { localStorage.removeItem(SESSION_KEY); }

        function getOnline() {
            try { return JSON.parse(localStorage.getItem(ONLINE_KEY)) || {}; } catch { return {}; }
        }

        function saveOnline(data) { localStorage.setItem(ONLINE_KEY, JSON.stringify(data)); }

        function getInvites() {
            try { return JSON.parse(localStorage.getItem(INVITES_KEY)) || []; } catch { return []; }
        }

        function saveInvites(invites) { localStorage.setItem(INVITES_KEY, JSON.stringify(invites)); }

        // ============================================================
        //  HELPERS
        // ============================================================
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

        function formatTime(ts) { return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

        function formatDate(ts) { return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit',
                year: 'numeric' }); }

        function getInitials(name) { return name.charAt(0).toUpperCase(); }

        function getUser(id) { const db = getDB(); return db.users.find(u => u.id === id); }

        function getUserName(id) { const u = getUser(id); return u ? u.username : 'Desconhecido'; }

        function getUserByUsername(username) {
            const db = getDB();
            return db.users.find(u => u.username.toLowerCase() === username.toLowerCase().trim());
        }

        function getChannel(id) { const db = getDB(); return db.channels.find(c => c.id === id); }

        function getMessages(channelId) {
            const db = getDB();
            return db.messages.filter(m => m.channelId === channelId).sort((a, b) => a.timestamp - b.timestamp);
        }

        function getChannelMembers(channelId) {
            const ch = getChannel(channelId);
            return ch ? ch.members || [] : [];
        }

        function getChannelDisplayName(channel) {
            const session = getSession();
            if (!session) return channel.name;
            if (channel.type === 'dm') {
                const other = channel.members.find(m => m !== session.userId);
                return getUserName(other);
            }
            return channel.name;
        }

        function getChannelIcon(channel) {
            if (channel.type === 'dm') return 'fa-user';
            if (channel.type === 'group') return 'fa-users';
            return 'fa-hashtag';
        }

        function isChannelAdmin(channelId, userId) {
            const ch = getChannel(channelId);
            return ch ? ch.adminId === userId : false;
        }

        function isAdminGlobal(userId) {
            const u = getUser(userId);
            return u ? u.isAdmin : false;
        }

        function isActive(userId) {
            const online = getOnline();
            const entry = online[userId];
            if (!entry) return false;
            return (Date.now() - entry.lastActive) < 30000; // 30 segundos
        }

        function getActiveUsers() {
            const db = getDB();
            const online = getOnline();
            const active = [];
            for (const [id, data] of Object.entries(online)) {
                if ((Date.now() - data.lastActive) < 30000) {
                    const user = getUser(id);
                    if (user) active.push(user);
                }
            }
            return active;
        }

        // ============================================================
        //  HEARTBEAT (online status)
        // ============================================================
        let heartbeatInterval = null;

        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                const session = getSession();
                if (!session) return;
                const online = getOnline();
                online[session.userId] = {
                    lastActive: Date.now(),
                    username: getUserName(session.userId)
                };
                saveOnline(online);
            }, 5000);
            // Immediate ping
            const session = getSession();
            if (session) {
                const online = getOnline();
                online[session.userId] = {
                    lastActive: Date.now(),
                    username: getUserName(session.userId)
                };
                saveOnline(online);
            }
        }

        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
            // Remove online status
            const session = getSession();
            if (session) {
                const online = getOnline();
                delete online[session.userId];
                saveOnline(online);
            }
        }

        // ============================================================
        //  INVITE SYSTEM
        // ============================================================
        let inviteCooldowns = {}; // { targetUserId: timestamp }

        function sendInvite(inviterId, targetId, groupId) {
            const invites = getInvites();
            // Check cooldown
            const key = inviterId + '_' + targetId;
            if (inviteCooldowns[key] && (Date.now() - inviteCooldowns[key]) < 5000) {
                alert('Aguarde 5 segundos antes de convidar esta pessoa novamente.');
                return false;
            }
            // Check if already pending
            const existing = invites.find(i =>
                i.inviterId === inviterId &&
                i.targetId === targetId &&
                i.groupId === groupId &&
                i.status === 'pending'
            );
            if (existing) {
                alert('Já existe um convite pendente para esta pessoa neste grupo.');
                return false;
            }
            const invite = {
                id: generateId(),
                inviterId,
                targetId,
                groupId,
                status: 'pending',
                timestamp: Date.now()
            };
            invites.push(invite);
            saveInvites(invites);
            inviteCooldowns[key] = Date.now();
            return true;
        }

        function getPendingInvites(targetId) {
            const invites = getInvites();
            return invites.filter(i => i.targetId === targetId && i.status === 'pending');
        }

        function acceptInvite(inviteId) {
            const invites = getInvites();
            const idx = invites.findIndex(i => i.id === inviteId);
            if (idx === -1) return false;
            const invite = invites[idx];
            if (invite.status !== 'pending') return false;

            // Add user to group
            const db = getDB();
            const ch = db.channels.find(c => c.id === invite.groupId);
            if (!ch) return false;
            if (!ch.members.includes(invite.targetId)) {
                ch.members.push(invite.targetId);
                saveDB(db);
            }
            // Update invite status
            invite.status = 'accepted';
            invite.respondedAt = Date.now();
            saveInvites(invites);
            return true;
        }

        function rejectInvite(inviteId) {
            const invites = getInvites();
            const idx = invites.findIndex(i => i.id === inviteId);
            if (idx === -1) return false;
            invites[idx].status = 'rejected';
            invites[idx].respondedAt = Date.now();
            saveInvites(invites);
            return true;
        }

        function cleanupOldInvites() {
            const invites = getInvites();
            const now = Date.now();
            const filtered = invites.filter(i => {
                if (i.status === 'pending' && (now - i.timestamp) > 60000) return false; // 1 minuto
                if (i.status !== 'pending' && (now - i.respondedAt) > 30000) return false; // 30 segundos
                return true;
            });
            if (filtered.length !== invites.length) {
                saveInvites(filtered);
            }
        }

        // ============================================================
        //  AUTH
        // ============================================================
        let currentUser = null;
        let isLoginMode = true;

        function initAuth() {
            const db = getDB();
            if (db.users.length === 0) {
                const admin = {
                    id: generateId(),
                    username: 'admin',
                    password: 'admin123',
                    isAdmin: true,
                    friends: [],
                    avatar: 'A',
                    createdAt: Date.now()
                };
                db.users.push(admin);
                const channel = {
                    id: generateId(),
                    name: 'geral',
                    type: 'group',
                    members: [admin.id],
                    adminId: admin.id,
                    createdAt: Date.now()
                };
                db.channels.push(channel);
                saveDB(db);
            }
            const session = getSession();
            if (session) {
                const user = getUser(session.userId);
                if (user) {
                    currentUser = user;
                    showApp();
                    return;
                }
            }
            showAuth();
        }

        function showAuth() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app').classList.remove('active');
            document.getElementById('app').style.display = 'none';
            stopHeartbeat();
        }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app').style.display = 'flex';
            document.getElementById('app').classList.add('active');
            updateUserBadge();
            renderSidebar();
            loadFirstChannel();
            startHeartbeat();
            startInvitePoller();
            startActiveUsersPoller();
        }

        // ============================================================
        //  AUTH EVENTS
        // ============================================================
        document.getElementById('auth-toggle').addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-btn').textContent = isLoginMode ? 'Entrar' : 'Registrar';
            document.getElementById('auth-switch-prefix').textContent = isLoginMode ? 'Não tem conta?' : 'Já tem conta?';
            document.getElementById('auth-toggle').textContent = isLoginMode ? 'Registrar' : 'Entrar';
            document.getElementById('auth-error').textContent = '';
        });

        document.getElementById('auth-btn').addEventListener('click', handleAuth);
        document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
        document.getElementById('auth-username').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });

        function handleAuth() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const errorEl = document.getElementById('auth-error');
            if (!username || !password) { errorEl.textContent = 'Preencha todos os campos.'; return; }
            const db = getDB();

            if (isLoginMode) {
                const user = db.users.find(u => u.username === username && u.password === password);
                if (!user) { errorEl.textContent = 'Usuário ou senha incorretos.'; return; }
                currentUser = user;
                saveSession({ userId: user.id });
                showApp();
                errorEl.textContent = '';
            } else {
                if (db.users.find(u => u.username.toLowerCase() === username.toLowerCase())) {
                    errorEl.textContent = 'Nome de usuário já existe.';
                    return;
                }
                const isFirst = db.users.length === 0;
                const newUser = {
                    id: generateId(),
                    username,
                    password,
                    isAdmin: isFirst,
                    friends: [],
                    avatar: getInitials(username),
                    createdAt: Date.now()
                };
                db.users.push(newUser);
                if (isFirst) {
                    db.channels.push({
                        id: generateId(),
                        name: 'geral',
                        type: 'group',
                        members: [newUser.id],
                        adminId: newUser.id,
                        createdAt: Date.now()
                    });
                }
                saveDB(db);
                currentUser = newUser;
                saveSession({ userId: newUser.id });
                showApp();
                errorEl.textContent = '';
            }
        }

            clearSession();

        });

            const session = getSession();

            const db = getDB();
            let channels = db.channels.filter(c => c.members.includes(session.userId));
            if (currentFilter === 'dm') channels = channels.filter(c => c.type === 'dm');
            else if (currentFilter === 'group') channels = channels.filter(c => c.type === 'group' || c.type === 'text');

            let html = '';

            if (groups.length) {
                html += `<div class="channel-group-label">📌 Canais</div>`;

                        <div class="channel-item ${active}" data-id="${c.id}">

                html += `<div class="channel-group-label">💬 DMs</div>`;

                    const active = c.id === currentChannelId ? 'active' : '';

                        <div class="channel-item ${active}" data-id="${c.id}">

                            <span>${name}</span>

            if (user && user.friends && user.friends.length) {
                html += `<div class="channel-group-label">👥 Amigos</div>`;
                user.friends.forEach(friendId => {
                    const friend = getUser(friendId);
                    if (!friend) return;
                    let dmChannel = db.channels.find(c =>
                        c.type === 'dm' &&

                    if (!dmChannel) {
                        dmChannel = {

                            type: 'dm',
                            members: [session.userId, friendId],
                            adminId: session.userId,
                            createdAt: Date.now()

        function loadFirstChannel() {
            const session = getSession();
            if (!session) return;
            const db = getDB();
            const channels = db.channels.filter(c => c.members.includes(session.userId));
            if (channels.length) {
                const last = localStorage.getItem('last_channel_' + session.userId);
                if (last && channels.find(c => c.id === last)) { switchChannel(last); return; }

        function renderMessages() {

            messages.forEach(msg => {
                const d = formatDate(msg.timestamp);
                if (d !== lastDate) { html += `<div class="msg-date-divider">${d}</div>`;
                    lastDate = d; }
                const isOwn = msg.userId === session.userId;
                const user = getUser(msg.userId);
                const username = user ? user.username : 'Desconhecido';
                const avatar = user ? (user.avatar || getInitials(username)) : '?';
                const isAdminUser = user ? user.isAdmin : false;
                const time = formatTime(msg.timestamp);
                let filesHtml = '';
                if (msg.files && msg.files.length) {
                    filesHtml = `<div class="msg-files">`;
                    msg.files.forEach(f => {
                        const icon = f.type && f.type.startsWith('image/') ? 'fa-image' : 'fa-file';
                        filesHtml += `
                            <div class="file-card">
                                <i class="fas ${icon}"></i>

                            </div>

                    });

                let reactionsHtml = '';
                if (msg.reactions && Object.keys(msg.reactions).length) {
                    reactionsHtml = `<div class="msg-reactions">`;
                    for (const [emoji, users] of Object.entries(msg.reactions)) {

        // ============================================================
        //  REACTIONS
        // ============================================================
        function toggleReaction(msgId, emoji) {
            const session = getSession();
            if (!session) return;
            const db = getDB();
            const msg = db.messages.find(m => m.id === msgId);
            if (!msg) return;
            if (!msg.reactions) msg.reactions = {};
            if (!msg.reactions[emoji]) msg.reactions[emoji] = [];
            const idx = msg.reactions[emoji].indexOf(session.userId);
            if (idx > -1) { msg.reactions[emoji].splice(idx, 1); if (msg.reactions[emoji].length === 0) delete msg
                    .reactions[emoji]; } else { msg.reactions[emoji].push(session.userId); }
            saveDB(db);
            renderMessages();
        }

        // ============================================================
        let pendingFiles = [];

        document.getElementById('file-input').addEventListener('change', (e) => {
            for (const file of e.target.files) { if (file.size > 0) pendingFiles.push(file); }
            updateFilePreview();
            e.target.value = '';
        });

        function updateFilePreview() {
            const c = document.getElementById('file-preview');
            if (!pendingFiles.length) { c.innerHTML = ''; return; }
            let html = '';
            pendingFiles.forEach((f, i) => {
                html += `
                    <div class="file-tag">
                        <i class="fas fa-file"></i>
                        <span>${f.name} (${(f.size/1024).toFixed(1)} KB)</span>
                        <span class="remove" data-idx="${i}"><i class="fas fa-times-circle"></i></span>
                    </div>
                `;
            });
            c.innerHTML = html;
            c.querySelectorAll('.remove').forEach(el => {
                el.addEventListener('click', () => { pendingFiles.splice(parseInt(el.dataset.idx), 1);
                    updateFilePreview(); });
            });
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                sendMessage(); }
        });

        function sendMessage() {
            if (!currentChannelId) { alert('Selecione um canal.'); return; }
            const input = document.getElementById('message-input');
            const content = input.value.trim();
            if (!content && !pendingFiles.length) return;
            const session = getSession();
            if (!session) return;
            const db = getDB();
            const msg = {
                id: generateId(),
                channelId: currentChannelId,
                userId: session.userId,
                content: content || '',
                timestamp: Date.now(),
                files: [],
                reactions: {}
            };
            const promises = pendingFiles.map(f => new Promise(r => {
                const reader = new FileReader();
                reader.onload = e => r({ name: f.name, type: f.type, size: f.size, data: e.target.result });
                reader.readAsDataURL(f);
            }));
            Promise.all(promises).then(files => {
                msg.files = files;
                db.messages.push(msg);
                saveDB(db);
                pendingFiles = [];
                updateFilePreview();
                input.value = '';
                input.style.height = '38px';
                renderMessages();
            });
        }
