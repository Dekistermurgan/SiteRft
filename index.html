<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090d" />
  <title>Viagem de Formatura • 9C</title>

  <style>
    :root {
      --text: #ffffff;
      --muted: rgba(255,255,255,.68);
      --glass: rgba(10,12,18,.48);
      --border: rgba(255,255,255,.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; min-height: 100%; }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: #08090d;
    }

    /* Background slideshow */
    .background {
      position: fixed;
      inset: -28px;
      z-index: -5;
      overflow: hidden;
      background: #08090d;
    }

    .slide {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      filter: blur(5px);
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 1.8s ease;
    }

    .slide.active {
      opacity: 1;
      animation: slowZoom 10s ease-in-out both;
    }

    @keyframes slowZoom {
      from { transform: scale(1.05); }
      to   { transform: scale(1.13); }
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.72)),
        radial-gradient(circle at center, rgba(0,0,0,.04), rgba(0,0,0,.58));
      z-index: 2;
    }

    /* Fine cinematic grain */
    .grain {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: .07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .page {
      width: min(1080px, 92vw);
      text-align: center;
      position: relative;
      z-index: 3;
    }

    .topline {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: rgba(255,255,255,.82);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .topline::before,
    .topline::after {
      content: "";
      width: 46px;
      height: 1px;
      background: rgba(255,255,255,.35);
    }

    h1 {
      font-size: clamp(38px, 7vw, 78px);
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 850;
      text-shadow: 0 8px 35px rgba(0,0,0,.4);
    }

    .subtitle {
      margin: 18px auto 32px;
      max-width: 650px;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 19px);
      line-height: 1.5;
    }

    .card {
      width: 100%;
      padding: clamp(22px, 4vw, 42px);
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--glass);
      box-shadow:
        0 30px 100px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .unit {
      min-width: 0;
      padding: clamp(18px, 3vw, 30px) 8px 22px;
      border-radius: 20px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.09);
    }

    .number {
      display: block;
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -.045em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 6px 25px rgba(0,0,0,.3);
    }

    .label {
      display: block;
      margin-top: 10px;
      color: rgba(255,255,255,.55);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .target {
      margin-top: 22px;
      color: rgba(255,255,255,.62);
      font-size: 13px;
      letter-spacing: .03em;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 17px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      color: white;
      background: rgba(255,255,255,.075);
      text-decoration: none;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.13);
      border-color: rgba(255,255,255,.24);
    }

    .instagram-icon {
      width: 18px;
      height: 18px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .sound-status {
      color: rgba(255,255,255,.45);
      font-size: 11px;
    }

    .location {
      position: fixed;
      left: 24px;
      bottom: 20px;
      z-index: 4;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      border: 1px solid rgba(255,255,255,.1);
      color: rgba(255,255,255,.58);
      font-size: 11px;
      backdrop-filter: blur(12px);
    }

    .location strong {
      color: rgba(255,255,255,.9);
    }

    #finished {
      display: none;
      font-size: clamp(30px, 6vw, 70px);
      font-weight: 900;
      letter-spacing: -.04em;
    }

    /* Player musical inspirado no Spotify */
    .music-player {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 20;
      width: min(680px, calc(100vw - 28px));
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 16px;
      background: rgba(18, 18, 18, .88);
      box-shadow: 0 16px 48px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .music-cover {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: #111;
      background: linear-gradient(135deg, #d7d7d7, #777);
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,.28);
    }

    .music-info { min-width: 0; text-align: left; }
    .music-title {
      overflow: hidden;
      color: #fff;
      font-size: 13px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .music-artist {
      margin-top: 3px;
      overflow: hidden;
      color: rgba(255,255,255,.58);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .music-controls { display: flex; align-items: center; gap: 8px; }
    .music-button {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #111;
      background: #fff;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }
    .music-button:hover { transform: scale(1.06); background: #d9d9d9; }
    .music-progress {
      grid-column: 2 / 3;
      width: 100%;
      height: 4px;
      accent-color: #fff;
      cursor: pointer;
    }
    .music-player audio { display: none; }

    @media (max-width: 680px) {
      body { overflow: auto; padding: 50px 0 110px; }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .music-player {
        bottom: 10px;
        width: calc(100vw - 20px);
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        padding: 10px 12px;
      }

      .music-cover { width: 40px; height: 40px; font-size: 18px; }
      .music-title { font-size: 12px; }
      .music-progress { grid-column: 2 / 3; }

      .location {
        position: static;
        margin: 20px auto 0;
      }

      .card { border-radius: 24px; }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true">
    <div class="slide active"
      style="background-image:url('https://atribunaregional.com.br/wp-content/uploads/2024/07/festa-peao-barretos-2024.jpeg')"></div>

    <div class="slide"
      style="background-image:url('https://www.guiathermas.com/img/cidade2.jpg')"></div>

    <div class="slide"
      style="background-image:url('https://carpediemecoresortolimpia.com.br/carpediemparkhotel/img/600px/carpe-diem-park-hotel-imagem-galeria-thermas-dos-laranjais-verao-o-ano-todo-olimpia-sp-64d2dcab7b553_1.webp')"></div>

    <div class="slide"
      style="background-image:url('https://media.gazetadopovo.com.br/2016/08/be93b1c7753ab1ec633e0d867689b224-full.jpg')"></div>

    <div class="slide"
      style="background-image:url('https://www.correiodopovo.com.br/image/contentid/policy%3A1.472783%3A1674847335/Captura%20de%20Tela%202020-08-30%20%C3%A0s%2012.45.57.png?%24p%24f%24q%24w=0766191&f=4x3&q=0.9&w=800')"></div>
  </div>

  <div class="grain"></div>

  <main class="page">
    <div class="topline">9C • VIAGEM DE FORMATURA</div>

    <h1>Está chegando.</h1>
    <p class="subtitle">
      A contagem regressiva para a viagem que vai ficar na memória.
    </p>

    <section class="card">
      <div class="countdown" id="countdown">
        <div class="unit">
          <span class="number" id="days">00</span>
          <span class="label">Dias</span>
        </div>
        <div class="unit">
          <span class="number" id="hours">00</span>
          <span class="label">Horas</span>
        </div>
        <div class="unit">
          <span class="number" id="minutes">00</span>
          <span class="label">Minutos</span>
        </div>
        <div class="unit">
          <span class="number" id="seconds">00</span>
          <span class="label">Segundos</span>
        </div>
      </div>

      <div id="finished">CHEGOU O DIA! 🎓✈️</div>

      <div class="target">21 de setembro de 2026 • 07:30 • Horário de Brasília</div>

      <div class="actions">
        <a class="button" href="https://www.instagram.com/nono_c_maximus/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"></rect>
            <circle cx="12" cy="12" r="4.1"></circle>
            <circle cx="17.55" cy="6.55" r="1"></circle>
          </svg>
          Instagram
        </a>

        <button class="button" id="soundBtn" type="button">
          🔊 Som do relógio
        </button>

        <span class="sound-status" id="soundStatus">desativado</span>
      </div>
    </section>
  </main>

  <div class="location" id="location">📍 <strong>Barretos, SP</strong></div>

  <div class="music-player" aria-label="Player de música">
    <div class="music-cover" aria-hidden="true">♫</div>
    <div class="music-info">
      <div class="music-title">Tempo Perdido</div>
      <div class="music-artist">Legião Urbana</div>
    </div>
    <div class="music-controls">
      <button class="music-button" id="musicPlay" type="button" aria-label="Reproduzir música">▶</button>
    </div>
    <input class="music-progress" id="musicProgress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Progresso da música" />
    <audio id="musicAudio" preload="auto" autoplay loop>
      <source src="tempo-perdido.mp3" type="audio/mpeg" />
      O seu navegador não suporta a reprodução de áudio.
    </audio>
  </div>

  <script>
    // Alvo fixo: 21/09/2026 às 07:30 no horário de Brasília (UTC-3).
    const targetDate = new Date("2026-09-21T07:30:00-03:00");

    // ------------------------------------------------------------
    // CONTADOR
    // ------------------------------------------------------------
    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("countdown").style.display = "none";
        document.getElementById("finished").style.display = "block";
        return;
      }

      const days = Math.floor(diff / 86400000);
      const hours = Math.floor((diff / 3600000) % 24);
      const minutes = Math.floor((diff / 60000) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // ------------------------------------------------------------
    // SOM DE RELÓGIO "GRANDE"
    // O navegador gera um tick/tock mais encorpado, sem arquivo externo.
    // O som só começa depois de clicar no botão (regra de autoplay do navegador).
    // ------------------------------------------------------------
    let soundEnabled = false;
    let audioContext = null;
    let tickNumber = 0;

    function ensureAudio() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") audioContext.resume();
    }

    function clockSound() {
      if (!soundEnabled) return;
      ensureAudio();

      const now = audioContext.currentTime;
      const isTock = tickNumber % 2 === 1;

      // Corpo grave do relógio.
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(isTock ? 520 : 690, now);
      osc.frequency.exponentialRampToValueAtTime(isTock ? 235 : 310, now + 0.12);

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1500, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.17, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.19);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);
      osc.start(now);
      osc.stop(now + 0.2);

      // Pequeno estalo agudo para dar sensação mecânica.
      const click = audioContext.createOscillator();
      const clickGain = audioContext.createGain();

      click.type = "square";
      click.frequency.setValueAtTime(isTock ? 1250 : 1550, now);
      clickGain.gain.setValueAtTime(0.035, now);
      clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);

      click.connect(clickGain);
      clickGain.connect(audioContext.destination);
      click.start(now);
      click.stop(now + 0.03);

      tickNumber++;
    }

    const soundBtn = document.getElementById("soundBtn");
    const soundStatus = document.getElementById("soundStatus");

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;

      if (soundEnabled) {
        ensureAudio();
        soundBtn.textContent = "🔊 Som do relógio";
        soundStatus.textContent = "ativado";
        clockSound();
      } else {
        soundBtn.textContent = "🔇 Som do relógio";
        soundStatus.textContent = "desativado";
      }
    });

    // O primeiro tick ocorre aproximadamente um segundo depois da ativação.
    setInterval(clockSound, 1000);

    // ------------------------------------------------------------
    // PLAYER DE MÚSICA
    // O autoplay é tentado; se o navegador bloquear áudio com som,
    // o visitante pode iniciar a faixa no botão ▶.
    // ------------------------------------------------------------
    const musicAudio = document.getElementById("musicAudio");
    const musicPlay = document.getElementById("musicPlay");
    const musicProgress = document.getElementById("musicProgress");

    function updateMusicButton() {
      const playing = !musicAudio.paused;
      musicPlay.textContent = playing ? "Ⅱ" : "▶";
      musicPlay.setAttribute("aria-label", playing ? "Pausar música" : "Reproduzir música");
    }

    musicPlay.addEventListener("click", () => {
      if (musicAudio.paused) musicAudio.play();
      else musicAudio.pause();
    });

    musicAudio.addEventListener("play", updateMusicButton);
    musicAudio.addEventListener("pause", updateMusicButton);
    musicAudio.addEventListener("timeupdate", () => {
      if (musicAudio.duration) musicProgress.value = (musicAudio.currentTime / musicAudio.duration) * 100;
    });
    musicProgress.addEventListener("input", () => {
      if (musicAudio.duration) musicAudio.currentTime = (musicProgress.value / 100) * musicAudio.duration;
    });
    musicAudio.play().catch(() => updateMusicButton());

    // ------------------------------------------------------------
    // BACKGROUND SLIDESHOW
    // ------------------------------------------------------------
    const slides = [...document.querySelectorAll(".slide")];
    const locationEl = document.getElementById("location");

    const places = [
      "Barretos, SP",
      "Olímpia, SP",
      "Thermas dos Laranjais",
      "Hopi Hari",
      "Barretos, SP"
    ];

    let slideIndex = 0;

    setInterval(() => {
      slides[slideIndex].classList.remove("active");
      slideIndex = (slideIndex + 1) % slides.length;
      slides[slideIndex].classList.add("active");
      locationEl.innerHTML = "📍 <strong>" + places[slideIndex] + "</strong>";
    }, 7000);
  </script>
</body>
</html>
